name: Content depth audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "articles/**/*.html"
      - "dossiers/**/*.html"
      - "sitemap.xml"
      - ".github/workflows/content-depth-audit.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Audit the current editorial standard
        shell: python
        run: |
          from __future__ import annotations
          import html
          import pathlib
          import re
          import urllib.parse
          import xml.etree.ElementTree as ET

          root = pathlib.Path('.').resolve()
          prefix = 'https://contreevidence.github.io/'
          ns = {'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = [n.text.strip() for n in ET.parse('sitemap.xml').findall('.//s:loc', ns) if n.text]

          script_re = re.compile(r'<(script|style)\b.*?</\1>', re.I | re.S)
          tag_re = re.compile(r'<[^>]+>')
          table_re = re.compile(r'<table\b', re.I)
          collapsed_detail_re = re.compile(r'<details\b[^>]*class=(["\'])[^"\']*\bce-legacy-detail\b[^"\']*\1[^>]*>.*?</details\s*>', re.I|re.S)
          h2_re = re.compile(r'<h2\b', re.I)
          source_re = re.compile(r'href=["\']https?://([^/"\']+)', re.I)
          internal_link_re = re.compile(r'href=["\'](?!https?://|#|mailto:|tel:)([^"\']+\.html(?:#[^"\']*)?)', re.I)
          word_re = re.compile(r"[A-Za-zÀ-ÖØ-öø-ÿ0-9]+(?:['’\-][A-Za-zÀ-ÖØ-öø-ÿ0-9]+)*")
          number_re = re.compile(r'\b\d+(?:[\s.,]\d+)?\s*(?:€|%|euros?|mois|ans?|heures?|h\b|jours?|k€)', re.I)
          case_re = re.compile(r'\b(?:cas|exemple|scénario|profil)\b', re.I)
          action_re = re.compile(r'\b(?:plan d.?action|protocole|checklist|à faire|étapes?|questions à poser|commencez|faites|vérifiez|comparez|décidez)\b', re.I)
          human_re = re.compile(r'\b(?:vous|votre|vos|je |j[’\']|famille|couple|travail|temps|vie|budget|logement|projet)\b', re.I)
          jargon_re = re.compile(r'\b(?:gatekeeper|runway|framework|scorecard|flywheel|proof point|use case|red flags?)\b', re.I)
          visual_re = re.compile(r'(?:<figure\b|role=["\']img["\']|class=["\'][^"\']*(?:ce-visual|diagram|flow|map|ladder|triage|path|steps|timeline|priority-visual)[^"\']*["\'])', re.I)

          institutional = (
              'banque-france.fr','economie.gouv.fr','service-public.fr','service-public.gouv.fr',
              'legifrance.gouv.fr','amf-france.org','francetravail.fr','francecompetences.fr',
              'moncompteformation.gouv.fr','transitionspro.fr','insee.fr','urssaf.fr','impots.gouv.fr',
              'anil.org','abe-infoservice.fr','data.gouv.fr','ecologie.gouv.fr','travail-emploi.gouv.fr',
              'bpifrance-creation.fr','vae.gouv.fr','entreprendre.service-public.fr','inrs.fr'
          )
          primary_market = ('msci.com','spglobal.com','ecb.europa.eu','eurostat.ec.europa.eu')

          def count_hosts(hosts, domains):
              return sum(1 for host in hosts if any(host == d or host.endswith('.'+d) for d in domains))

          def classify(rel, raw):
              low = rel.lower()
              if low.startswith('articles/'): return 'article'
              acquisition_markers = ('comment-', 'combien-', 'faut-il-', 'puis-je-', 'accepter-', 'acheter-', 'quitter-', 'changer-', 'passer-', 'travailler-', 'depenses-', 'audit-', 'reconversion-', 'premier-', 'finances-difficiles')
              if any(pathlib.PurePosixPath(low).name.startswith(x) for x in acquisition_markers): return 'decision/acquisition'
              if 'simulateur' in low or 'outil' in low: return 'tool'
              return 'reference/deep-dive'

          rows=[]
          for url in urls:
              if not url.startswith(prefix): continue
              rel = urllib.parse.unquote(url[len(prefix):]) or 'index.html'
              if not (rel.startswith('dossiers/') or rel.startswith('articles/')): continue
              page=root/rel
              if not page.exists(): continue
              raw=page.read_text(encoding='utf-8', errors='replace')
              if re.search(r'<meta\s+name=["\']robots["\'][^>]*noindex', raw, re.I): continue
              clean=script_re.sub(' ', raw)
              visible=html.unescape(tag_re.sub(' ', clean))
              words=len(word_re.findall(visible))
              tables_total=len(table_re.findall(raw))
              collapsed_blocks=collapsed_detail_re.findall(raw)
              collapsed_tables=sum(len(table_re.findall(block)) for block in re.findall(r'<details\b[^>]*class=(["\'])[^"\']*\bce-legacy-detail\b[^"\']*\1[^>]*>(.*?)</details\s*>', raw, re.I|re.S) for block in [block[1]])
              tables=max(0,tables_total-collapsed_tables)
              h2=len(h2_re.findall(raw))
              cases=len(case_re.findall(visible))
              numbers=len(number_re.findall(visible))
              hosts=[h.lower() for h in source_re.findall(raw)]
              sources=count_hosts(hosts, institutional)+count_hosts(hosts, primary_market)
              internal=len(internal_link_re.findall(raw))
              answer=('answer-box' in raw)
              voice=('voice-signature' in raw)
              visual=bool(visual_re.search(raw))
              action=('decision-box' in raw or bool(action_re.search(visible)))
              human=bool(human_re.search(visible[:1800]))
              jargon=len(jargon_re.findall(visible))
              kind=classify(rel, raw)

              score=0
              if answer: score+=2
              if voice or human: score+=1
              if visual: score+=2
              if cases>=1: score+=1
              if numbers>=3: score+=1
              if action: score+=2
              if internal>=2: score+=1
              if sources>=1: score+=1
              if words>=700: score+=1
              if tables<=2: score+=1
              elif tables>=5: score-=2
              elif tables==4: score-=1
              if words>=1500 and not visual: score-=2
              if jargon: score-=min(2,jargon)
              if h2>=14: score-=1

              flags=[]
              if not answer: flags.append('réponse immédiate')
              if not visual: flags.append('visuel de compréhension')
              if not action: flags.append('décision/action')
              if internal<2: flags.append('sortie logique')
              if cases<1 and kind!='article': flags.append('cas concret')
              if numbers<3 and kind!='article': flags.append('chiffrage')
              if tables>=4: flags.append(f'{tables} tableaux visibles')
              if tables_total>tables: flags.append(f'{tables_total-tables} tableau(x) en détail')
              if words>=1500 and not visual: flags.append('long sans visuel')
              if jargon: flags.append('jargon')
              if h2>=14: flags.append(f'{h2} sections')
              rows.append(dict(score=score,kind=kind,words=words,tables=tables,tables_total=tables_total,h2=h2,cases=cases,numbers=numbers,sources=sources,internal=internal,visual=visual,answer=answer,action=action,jargon=jargon,rel=rel,flags=flags))

          print(f'Indexable dossiers/articles audités: {len(rows)}')
          print('\nNOUVEAU STANDARD : situation/question → réponse immédiate → chiffres/cas → visuel → décision/action → étape suivante.')
          print('Les tableaux repliés en détail ne sont pas comptés dans la densité de lecture principale.')

          print('\nRépartition par niveau:')
          for label, pred in [
              ('A · déjà au niveau', lambda r:r['score']>=10 and r['tables']<=3),
              ('B · bonne base, finition', lambda r:7<=r['score']<10 or (r['score']>=10 and r['tables']>3)),
              ('C · migration prioritaire', lambda r:r['score']<7),
          ]:
              subset=[r for r in rows if pred(r)]
              print(f'{label}: {len(subset)}')

          priority=sorted(rows,key=lambda r:(r['score'],-r['tables'],-r['words']))
          print('\n40 pages à migrer en priorité:')
          for r in priority[:40]:
              print(f"{r['score']:2}/13 | {r['tables']:2} tab visibles / {r['tables_total']:2} total | {r['words']:4} mots | {r['kind']:<20} | {r['rel']} | {', '.join(r['flags']) or 'finition'}")

          print('\nPages avec 4 tableaux visibles ou plus:')
          heavy=sorted([r for r in rows if r['tables']>=4], key=lambda r:(-r['tables'],-r['words']))
          for r in heavy:
              print(f"{r['tables']:2} visibles / {r['tables_total']:2} total | {r['words']:4} mots | {r['rel']}")
          print(f'Total: {len(heavy)}')

          print('\nPages longues sans visuel de compréhension:')
          long_no_visual=sorted([r for r in rows if r['words']>=1500 and not r['visual']], key=lambda r:-r['words'])
          for r in long_no_visual[:50]:
              print(f"{r['words']:4} mots | {r['tables']:2} tab visibles | {r['rel']}")
          print(f'Total: {len(long_no_visual)}')

          print('\nJargon à éliminer ou traduire:')
          jargon_rows=[r for r in rows if r['jargon']]
          for r in jargon_rows:
              print(f"{r['jargon']:2} occurrence(s) | {r['rel']}")
          print(f'Total: {len(jargon_rows)}')

          print('\nAudit informatif : une page de référence peut rester plus dense lorsqu’un tableau est réellement l’outil adéquat. Le signal porte sur l’accumulation visible et l’absence de hiérarchie.')
