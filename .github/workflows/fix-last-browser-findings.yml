name: Fix last browser findings
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-last-browser-findings.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Resolve final four browser findings
        shell: python
        run: |
          from pathlib import Path

          # Chromium confirms no visible/content element crosses the viewport on these pages.
          # Their extra document width is produced by legacy off-canvas/pseudo-element decoration.
          for file in [
              'dossiers/competent-mais-invisible-travail.html',
              'outil-capital-professionnel.html',
              'simulateur-investissement-locatif.html',
          ]:
              p=Path(file); s=p.read_text(encoding='utf-8')
              marker='final-page-scrollwidth-guard'
              if marker not in s:
                  s=s.replace('</head>', '<style id="final-page-scrollwidth-guard">html,body{overflow-x:clip}</style></head>', 1)
                  p.write_text(s,encoding='utf-8')

          p=Path('articles/retrouver-emploi-apres-interruption.html')
          s=p.read_text(encoding='utf-8')
          if 'rel="icon"' not in s and "rel='icon'" not in s:
              s=s.replace('</head>', '<link rel="icon" href="../assets/logo.png"></head>', 1)
              p.write_text(s,encoding='utf-8')
      - name: Commit final browser fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dossiers/competent-mais-invisible-travail.html outil-capital-professionnel.html simulateur-investissement-locatif.html articles/retrouver-emploi-apres-interruption.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Resolve final browser rendering findings"
          git push
