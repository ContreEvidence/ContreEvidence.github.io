name: All pages browser audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/all-pages-browser-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install lightweight browser driver
        run: npm install --no-save puppeteer-core@24
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ce-http.log 2>&1 &
          echo $! > /tmp/ce-http.pid
          sleep 1
      - name: Render every published HTML page on desktop and mobile
        run: |
          cat > /tmp/audit.mjs <<'JS'
          import fs from 'fs';
          import path from 'path';
          import puppeteer from 'puppeteer-core';

          const root = process.cwd();
          const excluded = new Set(['.git','.github','scripts','editorial','publication','publications','node_modules','_site']);
          function walk(dir, out=[]) {
            for (const name of fs.readdirSync(dir)) {
              if (excluded.has(name)) continue;
              const p = path.join(dir,name); const st = fs.statSync(p);
              if (st.isDirectory()) walk(p,out); else if (name.endsWith('.html')) out.push(path.relative(root,p).replaceAll('\\','/'));
            }
            return out;
          }
          const pages = walk(root).sort();
          const candidates = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'];
          const executablePath = candidates.find(p => fs.existsSync(p));
          if (!executablePath) throw new Error('No Chrome/Chromium executable found');
          const browser = await puppeteer.launch({executablePath, headless:'new', args:['--no-sandbox','--disable-dev-shm-usage']});
          const viewports = [{name:'desktop',width:1440,height:900},{name:'mobile',width:390,height:844}];
          const failures=[];
          let renders=0;

          for (const rel of pages) {
            for (const vp of viewports) {
              const page = await browser.newPage();
              await page.setViewport({width:vp.width,height:vp.height,deviceScaleFactor:1});
              const jsErrors=[]; const requestFailures=[]; const badResponses=[];
              page.on('pageerror', e => jsErrors.push(String(e.message||e)));
              page.on('requestfailed', r => { if (r.url().startsWith('http://127.0.0.1:4173/')) requestFailures.push(`${r.url()} :: ${r.failure()?.errorText||'failed'}`); });
              page.on('response', r => { if (r.url().startsWith('http://127.0.0.1:4173/') && r.status() >= 400) badResponses.push(`${r.status()} ${r.url()}`); });
              const url='http://127.0.0.1:4173/'+rel.split('/').map(encodeURIComponent).join('/');
              let navError='';
              try { await page.goto(url,{waitUntil:'networkidle0',timeout:12000}); }
              catch(e){ navError=String(e.message||e); }
              await new Promise(r=>setTimeout(r,120));
              const m = await page.evaluate(() => {
                const visible = el => {
                  if(!el) return false; const cs=getComputedStyle(el); const r=el.getBoundingClientRect();
                  return cs.display!=='none' && cs.visibility!=='hidden' && r.width>5 && r.height>5;
                };
                const scrollX=Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth);
                const badTables=[];
                document.querySelectorAll('table').forEach((t,i)=>{
                  const r=t.getBoundingClientRect();
                  if(r.right<=innerWidth+2 && r.left>=-2) return;
                  let a=t.parentElement, protectedScroll=false;
                  while(a && a!==document.body){ const cs=getComputedStyle(a); if(['auto','scroll'].includes(cs.overflowX) && a.scrollWidth>a.clientWidth+2){protectedScroll=true;break;} a=a.parentElement; }
                  if(!protectedScroll) badTables.push(i+1);
                });
                const header=document.querySelector('#site-header, header');
                const main=document.querySelector('main');
                return {
                  title:document.title,
                  textLen:(document.body?.innerText||'').trim().length,
                  scrollX,
                  headerVisible:visible(header),
                  mainVisible:visible(main),
                  badTables,
                  bodyWidth:document.body?.getBoundingClientRect().width||0,
                  viewport:innerWidth
                };
              });
              const reasons=[];
              if(navError) reasons.push('navigation-timeout/error');
              if(badResponses.length) reasons.push('local-http-'+badResponses.join('|'));
              if(requestFailures.length) reasons.push('request-failed-'+requestFailures.join('|'));
              if(jsErrors.length) reasons.push('js-'+[...new Set(jsErrors)].join('|'));
              if(m.scrollX>3) reasons.push(`horizontal-overflow-${m.scrollX}px`);
              if(m.badTables.length) reasons.push(`uncontained-table-${m.badTables.join(',')}`);
              if(!m.headerVisible && rel!=='404.html') reasons.push('header-not-visible');
              if(!m.mainVisible && rel!=='404.html') reasons.push('main-not-visible');
              if(m.textLen<80 && !['merci.html','404.html'].includes(rel)) reasons.push(`very-low-text-${m.textLen}`);
              if(reasons.length) failures.push({rel,viewport:vp.name,reasons});
              renders++;
              await page.close();
            }
          }
          await browser.close();
          console.log(`PUBLISHED_HTML=${pages.length}`);
          console.log(`RENDERS=${renders}`);
          console.log(`FAILURE_RENDER_CASES=${failures.length}`);
          const grouped=new Map();
          for(const f of failures){ if(!grouped.has(f.rel)) grouped.set(f.rel,[]); grouped.get(f.rel).push(`${f.viewport}: ${f.reasons.join('; ')}`); }
          console.log(`PAGES_WITH_RENDER_FINDINGS=${grouped.size}`);
          for(const [rel,rows] of grouped){ console.log(`\n## ${rel}`); rows.forEach(x=>console.log(x)); }
          fs.writeFileSync('/tmp/browser-audit.json',JSON.stringify({pages:pages.length,renders,failures},null,2));
          JS
          node /tmp/audit.mjs
      - name: Upload browser audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-pages-browser-audit
          path: /tmp/browser-audit.json
          if-no-files-found: warn
          retention-days: 7
