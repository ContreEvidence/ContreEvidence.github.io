name: Fix management mobile table

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-management-mobile.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Make the two-column case table compact on mobile
        shell: python
        run: |
          from pathlib import Path
          p = Path('dossiers/management-relations-conflits.html')
          text = p.read_text(encoding='utf-8')
          marker = '<table class="compare-table"><tbody><tr><th>Équipe</th><td>6 nouveaux opérateurs</td></tr>'
          replacement = '<table class="compare-table ce-compact-kv"><tbody><tr><th>Équipe</th><td>6 nouveaux opérateurs</td></tr>'
          if marker in text:
              text = text.replace(marker, replacement, 1)
          style = '<style>@media(max-width:759px){.prose .compare-wrap .ce-compact-kv{display:table!important;min-width:0!important;width:100%!important;max-width:100%!important;table-layout:fixed;overflow:visible!important}.prose .ce-compact-kv th{width:42%}.prose .ce-compact-kv th,.prose .ce-compact-kv td{overflow-wrap:anywhere;word-break:normal}}</style>'
          if 'ce-compact-kv' not in text.split('</head>',1)[0]:
              text = text.replace('</head>', style + '</head>', 1)
          p.write_text(text, encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- dossiers/management-relations-conflits.html; then
            echo 'Already fixed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dossiers/management-relations-conflits.html
          git commit -m 'Corriger le tableau management sur mobile'
          git pull --rebase origin main
          git push
