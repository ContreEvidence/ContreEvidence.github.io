name: Site integrity

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "sitemap.xml"
      - ".github/workflows/site-integrity.yml"
  pull_request:
    paths:
      - "**/*.html"
      - "sitemap.xml"
      - ".github/workflows/site-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

# This job is also the regression guard for accidental assistant/UI citation tokens.
jobs:
  check-indexable-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check sitemap, canonicals, metadata, internal links and source hygiene
        shell: python
        run: |
          from __future__ import annotations
          import collections
          import html
          import pathlib
          import re
          import sys
          import urllib.parse
          import xml.etree.ElementTree as ET

          root = pathlib.Path('.').resolve()
          errors = []
          warnings = []

          def local_path_from_site_url(url: str) -> pathlib.Path | None:
              parsed = urllib.parse.urlparse(url)
              if parsed.netloc and parsed.netloc != 'contreevidence.github.io':
                  return None
              path = urllib.parse.unquote(parsed.path)
              if path in ('', '/'):
                  return root / 'index.html'
              if path.startswith('/'):
                  path = path[1:]
              path = path.lstrip('/')
              return (root / path).resolve()

          # Assistant/UI citation tokens are rendering metadata, never public editorial content.
          # U+E200/U+E201 delimit tokens such as cite, filecite or memcite.
          for page in root.rglob('*.html'):
              if any(part in {'.git', 'node_modules', 'publications'} for part in page.parts):
                  continue
              text = page.read_text(encoding='utf-8', errors='replace')
              if '\ue200' in text or '\ue201' in text:
                  rel = page.relative_to(root)
                  bad_lines = [
                      str(i)
                      for i, line in enumerate(text.splitlines(), start=1)
                      if '\ue200' in line or '\ue201' in line
                  ]
                  errors.append(
                      f'Marqueur interne de citation/UI dans une page publique: {rel} '
                      f'(ligne(s) {", ".join(bad_lines[:12])})'
                  )

          tree = ET.parse('sitemap.xml')
          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = [node.text.strip() for node in tree.findall('.//s:loc', ns) if node.text]

          noindex_re = re.compile(
              r'''<meta\b[^>]*name=["']robots["'][^>]*content=["'][^"']*noindex|'''
              r'''<meta\b[^>]*content=["'][^"']*noindex[^"']*["'][^>]*name=["']robots["']''',
              re.I,
          )

          indexable_files = []
          for url in urls:
              target = local_path_from_site_url(url)
              if target is None:
                  errors.append(f'Sitemap URL hors domaine attendu: {url}')
                  continue
              if not target.exists():
                  errors.append(f'Sitemap → fichier introuvable: {url} -> {target.relative_to(root)}')
                  continue
              if target.suffix.lower() == '.html':
                  target_text = target.read_text(encoding='utf-8', errors='replace')
                  if noindex_re.search(target_text):
                      errors.append(f'Page noindex présente dans le sitemap: {target.relative_to(root)}')
                      continue
                  indexable_files.append(target)

          href_re = re.compile(r'''href\s*=\s*["']([^"']+)["']''', re.I)
          canonical_re = re.compile(r'''<link\b[^>]*rel=["'][^"']*canonical[^"']*["'][^>]*href=["']([^"']+)["']|<link\b[^>]*href=["']([^"']+)["'][^>]*rel=["'][^"']*canonical[^"']*["']''', re.I)
          title_re = re.compile(r'<title>(.*?)</title>', re.I | re.S)
          desc_re = re.compile(r'''<meta\b[^>]*name=["']description["'][^>]*content=["']([^"']*)["']|<meta\b[^>]*content=["']([^"']*)["'][^>]*name=["']description["']''', re.I | re.S)
          h1_re = re.compile(r'<h1\b[^>]*>(.*?)</h1>', re.I | re.S)
          tag_re = re.compile(r'<[^>]+>')

          titles = collections.defaultdict(list)
          canonicals = collections.defaultdict(list)

          for page in sorted(set(indexable_files)):
              text = page.read_text(encoding='utf-8', errors='replace')
              rel = page.relative_to(root)

              title_match = title_re.search(text)
              if not title_match:
                  errors.append(f'Title absent sur page indexable: {rel}')
              else:
                  title = re.sub(r'\s+', ' ', html.unescape(tag_re.sub('', title_match.group(1)))).strip()
                  titles[title.casefold()].append(str(rel))
                  if not title:
                      errors.append(f'Title vide sur page indexable: {rel}')

              desc_match = desc_re.search(text)
              if not desc_match or not next((g for g in desc_match.groups() if g), '').strip():
                  warnings.append(f'Meta description absente ou vide: {rel}')

              if not h1_re.search(text):
                  warnings.append(f'H1 absent: {rel}')

              canon = canonical_re.search(text)
              if not canon:
                  errors.append(f'Canonical absent sur page indexable: {rel}')
              else:
                  canonical_url = html.unescape(next(x for x in canon.groups() if x)).strip()
                  canonicals[canonical_url.casefold()].append(str(rel))
                  canonical_target = local_path_from_site_url(canonical_url)
                  if canonical_target is not None:
                      if not canonical_target.exists():
                          errors.append(f'Canonical vers fichier introuvable: {rel} -> {canonical_url}')
                      elif canonical_target.resolve() != page.resolve():
                          errors.append(f'Page présente dans sitemap mais canonical vers une autre page: {rel} -> {canonical_url}')

              for raw_href in href_re.findall(text):
                  href = html.unescape(raw_href).strip()
                  if not href or href.startswith(('#', 'mailto:', 'tel:', 'javascript:', 'data:')):
                      continue
                  # JavaScript/template placeholders are not static links and must not be resolved as files.
                  if '${' in href or '{{' in href:
                      continue
                  parsed = urllib.parse.urlparse(href)
                  if parsed.scheme in ('http', 'https'):
                      if parsed.netloc != 'contreevidence.github.io':
                          continue
                      target = local_path_from_site_url(href)
                  else:
                      clean = urllib.parse.unquote(parsed.path)
                      if not clean or clean.endswith(('.css','.js','.png','.jpg','.jpeg','.webp','.svg','.xml','.json','.webmanifest','.pdf','.mp4','.mp3','.csv','.zip')):
                          continue
                      target = (page.parent / clean).resolve()
                      if clean.endswith('/'):
                          target = target / 'index.html'
                  if target is None:
                      continue
                  try:
                      target.relative_to(root)
                  except ValueError:
                      errors.append(f'Lien sortant du dépôt: {rel} -> {href}')
                      continue
                  if not target.exists():
                      errors.append(f'Lien interne cassé: {rel} -> {href}')

          for key, pages in titles.items():
              if key and len(pages) > 1:
                  errors.append(f'Title dupliqué: {pages}')
          for key, pages in canonicals.items():
              if key and len(pages) > 1:
                  errors.append(f'Canonical dupliqué entre pages du sitemap: {pages}')

          for warning in warnings:
              print(f'WARNING: {warning}')

          if errors:
              print('\n'.join(f'ERROR: {e}' for e in errors))
              print(f'\n{len(errors)} erreur(s), {len(warnings)} avertissement(s).')
              sys.exit(1)

          print(f'OK — {len(indexable_files)} pages HTML du sitemap contrôlées, {len(warnings)} avertissement(s).')
