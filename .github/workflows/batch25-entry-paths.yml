name: Batch 25 entry paths

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/batch25-entry-paths.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Align visible metadata and sitemap dates
        shell: python
        run: |
          from pathlib import Path
          p = Path("articles/construire-epargne-de-zero.html")
          text = p.read_text(encoding="utf-8")
          old = "Revu le 16/08/2026 · Déficit, micro-épargne, revenu variable, premier coussin, dette et conditions de renversement intégrés"
          new = "Revu le 16/08/2026 · Premiers 7 jours, déficit, micro-épargne, revenu variable, dette et conditions de renversement intégrés"
          if old in text:
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          p = Path("sitemap.xml")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              "<url><loc>https://contreevidence.github.io/parcours-vie-professionnelle.html</loc><lastmod>2026-08-15</lastmod></url>",
              "<url><loc>https://contreevidence.github.io/parcours-vie-professionnelle.html</loc><lastmod>2026-08-16</lastmod></url>"
          )
          text = text.replace(
              "<url><loc>https://contreevidence.github.io/themes/argent.html</loc><lastmod>2026-08-15</lastmod></url>",
              "<url><loc>https://contreevidence.github.io/themes/argent.html</loc><lastmod>2026-08-16</lastmod></url>"
          )
          p.write_text(text, encoding="utf-8")
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/construire-epargne-de-zero.html sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m "Align batch 25 entry-path metadata"
          git push
