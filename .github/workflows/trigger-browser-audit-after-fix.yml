name: Trigger browser audit after fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-browser-audit-after-fix.yml'
permissions:
  actions: write
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exhaustive browser audit on current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ContreEvidence/ContreEvidence.github.io/actions/workflows/all-pages-browser-audit-v2.yml/dispatches \
            -d '{"ref":"main"}'
# third full pass after targeted residual fixes
