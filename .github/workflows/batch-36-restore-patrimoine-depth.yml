name: Batch 36 restore patrimoine depth

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore direct patrimoine decisions
        run: python scripts/batch36_restore_patrimoine_depth.py
      - name: Commit batch 36
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/argent.html reports/content-review-decisions-2026-08-17-batch-36.md
          git diff --cached --check
          git commit -m "Restore direct patrimoine decisions"
          git pull --rebase origin main
          git push
