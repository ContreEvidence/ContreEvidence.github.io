name: Solution engineering report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/solution-engineering-report.yml"
      - "dossiers/indivision-couple-separation-rachat-soulte.html"
      - "dossiers/indivision-rachat-progressif-parts.html"
      - "dossiers/creer-entreprise-sans-diplome.html"

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build structural report
        shell: python
        run: |
          from pathlib import Path
          import re, html

          paths = [
            'dossiers/indivision-couple-separation-rachat-soulte.html',
            'dossiers/indivision-rachat-progressif-parts.html',
            'dossiers/creer-entreprise-sans-diplome.html',
          ]
          strip_scripts=re.compile(r'<(script|style)\b.*?</\1>',re.I|re.S)
          strip_tags=re.compile(r'<[^>]+>')
          word_re=re.compile(r"[A-Za-zÀ-ÖØ-öø-ÿ0-9]+(?:['’\-][A-Za-zÀ-ÖØ-öø-ÿ0-9]+)*")
          num_re=re.compile(r'\b\d+(?:[\s.,]\d+)?\s*(?:€|%|euros?|mois|ans?|heures?|h\b|jours?|km|clients?|candidatures?|ventes?|points?)',re.I)

          pats = {
            'obstacle': r'\b(?:obstacle|verrou|bloqu|empêche|impossible|refus|limite|contrainte|fragilit|frein)\w*',
            'variables': r'\b(?:variable|modifiable|fixe|levier|marge de manœuvre|dépendance|hypothèse|paramètre)\w*',
            'windows': r'\b(?:fenêtre|alternative|option|solution|montage|séquen|transitoire|intermédiaire|transform|réorganis|hybride|contourn)\w*',
            'conditions': r'\b(?:condition|à partir de|il faut que|doit être|doit atteindre|pour rendre|devient possible|seuil|point de bascule|écart à fermer|si .{0,45} alors)\b',
            'scenarios': r'\b(?:scénario|stratégie|option|chemin|cas|architecture)\b',
            'execution': r'\b(?:plan d.?action|plan d.?exécution|prochaines? étapes?|dans les \d+ jours|dans \d+ mois|ordre des actions|ordre des opérations|commencez par|vérifiez d.?abord|à faire maintenant|première action|calendrier)\b',
            'revision': r'\b(?:abandon|renoncer|arrêter|condition de sortie|condition d.?arrêt|revoir|réviser|changer de stratégie|cesse d.?être|trop coûteu|trop risqu|ne vaut plus|mauvaise idée)\w*',
            'progressive': r'\b(?:progressi|fractionn|tranche|par étapes?|montée en puissance|poste passerelle)\w*',
            'sequence': r'\b(?:séquen|ordre des opérations|inverser l.?ordre|faire .{0,40} avant|d.?abord .{0,80} ensuite)\w*',
            'combination': r'\b(?:combinaison|combiner|recomposer|plusieurs leviers|aucun levier seul|2, 3 ou 4 leviers|deux leviers|trois leviers)\b',
            'substitution': r'\b(?:substitut|remplac|garantie supplémentaire|personne qualifiée|fonction voisine|autre usage)\w*',
            'reduce_need': r'\b(?:réduire le besoin|périmètre plus étroit|réduction du besoin|moins de besoin|limiter le périmètre)\b',
            'redteam': r'\b(?:red team|contradicteur|attaqu|ce qui rendrait|qu.?avons-nous considéré comme fixe|mauvaise idée)\w*',
          }

          lines=['# Rapport — ingénierie de solutions','', 'Généré automatiquement à partir des pages étalons. Les compteurs sont des signaux, pas une note de qualité.','']
          for p in paths:
            raw=Path(p).read_text(encoding='utf-8',errors='replace')
            text=html.unescape(strip_tags.sub(' ',strip_scripts.sub(' ',raw)))
            counts={k:len(re.findall(v,text,re.I)) for k,v in pats.items()}
            words=len(word_re.findall(text)); nums=len(num_re.findall(text)); tables=len(re.findall(r'<table\b',raw,re.I)); sources=len(re.findall(r'href=["\']https?://',raw,re.I))
            h2=[html.unescape(strip_tags.sub(' ',x)).strip() for x in re.findall(r'<h2[^>]*>(.*?)</h2>',raw,re.I|re.S)]
            h2_join=' | '.join(h2)
            plan_heading=bool(re.search(r'<h2[^>]*>.*?(?:plan|exécution|jours).*?</h2>',raw,re.I|re.S))
            timeline=len(re.findall(r'\b(?:7|15|20|30|45|60|90)\s*jours?\b',text,re.I))>=3
            sequence_present=counts['sequence']>=1 or (plan_heading and timeline) or counts['execution']>=4
            progressive_present=(counts['progressive']>=2 or (counts['sequence']>=1 and counts['reduce_need']>=1 and counts['windows']>=5) or bool(re.search(r'\b(?:ajouter .* ensuite|avant d.?ajouter|jusqu.?à 100|50/50.*100/0)\b',text,re.I)))
            combination_present=(counts['combination']>=1 or (counts['scenarios']>=5 and tables>=3 and counts['variables']>=2 and counts['windows']>=4) or bool(re.search(r'\b(?:architecture|matrice).{0,120}(?:prêt|revenu|garantie|coût|fiscalité|temps)\b',text,re.I)))
            contradiction_present=(counts['redteam']>=1 or bool(re.search(r'\b(?:quand .* mauvaise idée|quand .* abandon|condition d.?abandon|six questions avant|red team)\b',h2_join,re.I)))
            families={'progressif/fractionné':progressive_present,'séquence réelle':sequence_present,'recomposition':combination_present,'substitution':counts['substitution']>=1,'réduction du besoin':counts['reduce_need']>=1}
            failures=[]
            if words<1600: failures.append('moins de 1600 mots')
            if tables<3: failures.append('moins de 3 tableaux')
            if sources<3: failures.append('moins de 3 sources')
            if nums<10: failures.append('quantification insuffisante')
            if counts['obstacle']<3 or counts['variables']<2: failures.append('verrou/variables insuffisants')
            if sum(families.values())<3: failures.append('moins de 3 familles')
            if not progressive_present: failures.append('pas de progressif/fractionné')
            if not sequence_present: failures.append('pas de séquence réelle')
            if not combination_present: failures.append('pas de recomposition')
            if not re.search(r'\b(?:point de bascule|seuil|écart à fermer|à partir de quel|devient possible|devient finançable)\b',text,re.I): failures.append('pas de seuil explicite')
            if counts['execution']<2 or not plan_heading: failures.append('pas de plan d’exécution')
            if counts['revision']<2: failures.append('abandon/révision trop faible')
            if not contradiction_present: failures.append('pas de contradiction explicite')
            if 'answer-box' not in raw: failures.append('pas de réponse courte')
            if 'ce-related' not in raw: failures.append('pas de suite éditoriale')

            lines += [f'## `{p}`','',f'- Mots utiles : **{words}**',f'- Éléments chiffrés : **{nums}**',f'- Tableaux : **{tables}**',f'- Liens sources externes : **{sources}**']
            for name in ['obstacle','variables','windows','conditions','scenarios','execution','revision','progressive','sequence','combination','substitution','reduce_need','redteam']:
              lines.append(f'- {name} : **{counts[name]}** occurrence(s)')
            lines.append('- Familles détectées : ' + ' · '.join(f"{name}={'OUI' if ok else 'NON'}" for name,ok in families.items()))
            lines.append(f"- Contradiction structurelle : **{'OUI' if contradiction_present else 'NON'}**")
            lines.append(f"- Verdict garde-fou : **{'OK' if not failures else 'ÉCHEC — ' + ', '.join(failures)}**")
            lines.append('- H2 : ' + ' · '.join(h2))
            lines.append('')
          Path('reports').mkdir(exist_ok=True)
          Path('reports/solution-engineering-audit.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
      - name: Commit report if changed
        run: |
          if git diff --quiet -- reports/solution-engineering-audit.md && git ls-files --error-unmatch reports/solution-engineering-audit.md >/dev/null 2>&1; then
            echo "Report already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/solution-engineering-audit.md
          git commit -m "Mise à jour du rapport d’ingénierie de solutions"
          git push
