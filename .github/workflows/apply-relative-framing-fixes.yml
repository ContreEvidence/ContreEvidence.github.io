name: Apply relative framing fixes

on:
  push:
    paths:
      - 'scripts/apply_relative_framing_fixes.py'
      - '.github/workflows/apply-relative-framing-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply editorial fixes
        run: python scripts/apply_relative_framing_fixes.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/grosse-entree-argent-que-faire.html outil-repartir-grosse-somme.html dossiers/acheter-logement-sans-se-fragiliser.html dossiers/acheter-sans-vider-epargne.html dossiers/bien-immobilier-garder-vendre-transformer.html dossiers/liquidites-reserve-securite.html dossiers/puis-je-me-permettre-reconversion.html dossiers/audit-budget-60-minutes.html
          git diff --cached --check
          git commit -m "Make financial thresholds relative to user context"
          git push
