name: Editorial plain tables finish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/editorial-plain-tables-finish.yml"

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Collapse late plain tables on the last two dense dossiers
        shell: python
        run: |
          from __future__ import annotations
          import pathlib,re
          targets=[
            'dossiers/demenager-pour-un-emploi-salaire-minimum.html',
            'dossiers/quitter-travail-reconversion-sans-se-fragiliser.html',
          ]
          table_re=re.compile(r'<table\b[^>]*>.*?</table\s*>',re.I|re.S)
          root=pathlib.Path('.')
          def inside_detail(raw,pos):
              before=raw[:pos]
              return before.rfind('<details class="ce-legacy-detail">')>before.rfind('</details>')
          changed=[]
          for rel in targets:
              p=root/rel
              raw=p.read_text(encoding='utf-8',errors='replace'); original=raw
              matches=list(table_re.finditer(raw)); out=[]; last=0; visible=0
              for m in matches:
                  out.append(raw[last:m.start()]); block=m.group(0)
                  if inside_detail(raw,m.start()):
                      out.append(block)
                  else:
                      visible+=1
                      if visible<=2: out.append(block)
                      else: out.append('<details class="ce-legacy-detail"><summary>Voir le tableau détaillé</summary>'+block+'</details>')
                  last=m.end()
              out.append(raw[last:]); raw=''.join(out)
              if raw!=original:
                  p.write_text(raw,encoding='utf-8'); changed.append(rel)
          print(f'Pages allégées: {len(changed)}')
          for r in changed: print('CLEANED',r)
      - name: Validate and commit
        run: |
          git diff --check
          if git diff --quiet -- dossiers; then
            echo "No cleanup required."
            exit 0
          fi
          git config user.name "ContreEvidence"
          git config user.email "contreevidence@gmail.com"
          git add dossiers
          git commit -m "Collapse late tables on final dense dossiers"
          git push
