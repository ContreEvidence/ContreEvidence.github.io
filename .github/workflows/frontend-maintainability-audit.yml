name: Frontend maintainability audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/**/*.css'
      - '.github/workflows/frontend-maintainability-audit.yml'

permissions:
  contents: write

concurrency:
  group: frontend-maintainability-audit
  cancel-in-progress: true

jobs:
  extract_verified_card_component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Move only the six exact card copies to the shared component
        shell: python
        run: |
          from pathlib import Path

          targets = [
              'dossiers/accepter-emploi-moins-paye-vivre-mieux.html',
              'dossiers/finances-difficiles-sortir-decouvert-dettes.html',
              'dossiers/patrimoine-marge-de-manoeuvre.html',
              'dossiers/premier-investissement-comment-commencer.html',
              'dossiers/quand-arreter-optimiser-utiliser-patrimoine.html',
              'dossiers/sante-travail-equilibre-vie-pro-perso.html',
          ]
          base = '.ce-card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem;margin:1rem 0}.ce-card{padding:1rem 1.05rem;border:1px solid rgba(16,24,32,.14);border-radius:15px;background:#fff}.ce-card b{display:block;margin-bottom:.28rem;color:#73530c}'
          link = '<link rel="stylesheet" href="../assets/editorial-components.css?v=20260818-1"/>'
          mobile = {
              targets[0]: ('.ce-job-branches,.ce-card-grid{grid-template-columns:1fr}', '.ce-job-branches{grid-template-columns:1fr}'),
              targets[1]: ('.ce-triage-grid,.ce-card-grid{grid-template-columns:1fr}', '.ce-triage-grid{grid-template-columns:1fr}'),
              targets[2]: ('.ce-card-grid{grid-template-columns:1fr}', ''),
              targets[3]: ('.ce-card-grid,.ce-size-grid{grid-template-columns:1fr}', '.ce-size-grid{grid-template-columns:1fr}'),
              targets[4]: ('.ce-card-grid{grid-template-columns:1fr}', ''),
              targets[5]: ('.ce-health-grid,.ce-card-grid{grid-template-columns:1fr}', '.ce-health-grid{grid-template-columns:1fr}'),
          }

          if not Path('assets/editorial-components.css').exists():
              raise SystemExit('shared component file is missing')

          changed=[]
          for path in targets:
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if 'editorial-components.css?v=20260818-1' in text:
                  if base in text:
                      raise SystemExit(f'{path}: shared link exists but local base rules remain')
                  continue
              if text.count(base) != 1:
                  raise SystemExit(f'{path}: exact base component changed; refusing migration')
              old_mobile,new_mobile=mobile[path]
              if text.count(old_mobile) != 1:
                  raise SystemExit(f'{path}: exact mobile component changed; refusing migration')
              text=text.replace(base,'',1).replace(old_mobile,new_mobile,1)
              anchors=[
                  '<link rel="stylesheet" href="../assets/ux-retention.css?v=20260810-13"/>',
                  '<link href="../assets/ux-retention.css?v=20260810-13" rel="stylesheet"/>',
              ]
              anchor=next((a for a in anchors if a in text),None)
              if not anchor:
                  raise SystemExit(f'{path}: ux-retention anchor not found')
              text=text.replace(anchor,anchor+link,1)
              p.write_text(text,encoding='utf-8')
              changed.append(path)

          print('Migrated:', ', '.join(changed) if changed else 'already complete')
      - name: Commit migration when needed
        run: |
          if [ -z "$(git status --porcelain -- dossiers)" ]; then exit 0; fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dossiers/accepter-emploi-moins-paye-vivre-mieux.html \
            dossiers/finances-difficiles-sortir-decouvert-dettes.html \
            dossiers/patrimoine-marge-de-manoeuvre.html \
            dossiers/premier-investissement-comment-commencer.html \
            dossiers/quand-arreter-optimiser-utiliser-patrimoine.html \
            dossiers/sante-travail-equilibre-vie-pro-perso.html
          git diff --cached --check
          git commit -m 'Share stable editorial card component'
          git push origin HEAD:main

  audit:
    needs: extract_verified_card_component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0, ref: main}
      - name: Measure local and shared CSS surface
        shell: python
        run: |
          from pathlib import Path
          from datetime import date
          import collections, hashlib, re

          STYLE_BLOCK=re.compile(r'<style\b[^>]*>(.*?)</style>',re.I|re.S)
          STYLE_ATTR=re.compile(r'\sstyle=["\'][^"\']*["\']',re.I)
          LINK_CSS=re.compile(r'<link\b[^>]*href=["\']([^"\']+\.css(?:\?[^"\']*)?)["\']',re.I)
          CLASS_RULE=re.compile(r'([^{}]+)\{([^{}]*)\}')

          pages=[]
          exact_blocks=collections.defaultdict(list)
          css_refs=collections.Counter()
          local_selectors=collections.Counter()
          selector_pages=collections.defaultdict(set)
          selector_bodies=collections.defaultdict(lambda: collections.defaultdict(set))

          for p in sorted(Path('.').rglob('*.html')):
              if any(part.startswith('.') for part in p.parts):
                  continue
              raw=p.read_text(encoding='utf-8',errors='ignore')
              blocks=STYLE_BLOCK.findall(raw)
              inline_attrs=len(STYLE_ATTR.findall(raw))
              local_chars=sum(len(b) for b in blocks)
              refs=[]
              for href in LINK_CSS.findall(raw):
                  clean=href.split('?',1)[0]
                  refs.append(clean)
                  css_refs[clean]+=1
              for b in blocks:
                  norm=re.sub(r'\s+',' ',b).strip()
                  if norm:
                      exact_blocks[hashlib.sha1(norm.encode()).hexdigest()].append(str(p))
                  for sel,body in CLASS_RULE.findall(b):
                      body_norm=re.sub(r'\s+',' ',body).strip()
                      for part in sel.split(','):
                          s=re.sub(r'\s+',' ',part).strip()
                          if s.startswith('.') and len(s)<120:
                              local_selectors[s]+=1
                              selector_pages[s].add(str(p))
                              selector_bodies[s][body_norm].add(str(p))
              gate='EXTRACT' if local_chars>=2000 else ('REVIEW' if local_chars>=600 or inline_attrs>=8 else 'OK')
              pages.append(dict(path=str(p),blocks=len(blocks),chars=local_chars,attrs=inline_attrs,refs=len(set(refs)),gate=gate))

          css_files=[]
          for p in sorted(Path('assets').rglob('*.css')) if Path('assets').exists() else []:
              raw=p.read_text(encoding='utf-8',errors='ignore')
              css_files.append((len(raw),str(p)))
          css_files.sort(reverse=True)

          pages.sort(key=lambda x:(-x['chars'],-x['attrs'],x['path']))
          extract=[x for x in pages if x['gate']=='EXTRACT']
          review=[x for x in pages if x['gate']=='REVIEW']
          with_style=[x for x in pages if x['blocks']]
          duplicate_groups=[v for v in exact_blocks.values() if len(v)>1]
          duplicate_groups.sort(key=lambda v:(-len(v),v[0]))
          repeated_selectors=[(n,s) for s,n in local_selectors.items() if n>=2]
          repeated_selectors.sort(reverse=True)
          stable_shared=[]
          for s,pageset in selector_pages.items():
              if len(pageset)>=3 and len(selector_bodies[s])==1:
                  stable_shared.append((len(pageset),local_selectors[s],s,sorted(pageset)))
          stable_shared.sort(key=lambda x:(-x[0],-x[1],x[2]))

          out=['# Audit de maintenabilité front-end','',f'Mise à jour automatique : {date.today().isoformat()}','',
               f'Pages HTML analysées : **{len(pages)}**. Pages avec CSS local `<style>` : **{len(with_style)}**. Candidats `EXTRACT` (≥ 2 000 caractères de CSS local) : **{len(extract)}**. Candidats `REVIEW` : **{len(review)}**.','',
               'Cet audit mesure la **surface de maintenance**, pas la qualité visuelle. Un style local peut être légitime ; la priorité augmente lorsqu’un gros bloc local recrée des composants déjà présents ailleurs.','',
               '## Pages avec le plus de CSS local','',
               '| Gate | Page | Blocs `<style>` | Caractères CSS local | Attributs `style=` | CSS partagés référencés |','|---|---|---:|---:|---:|---:|']
          for x in pages[:50]:
              if not x['blocks'] and not x['attrs']: continue
              out.append(f"| {x['gate']} | `{x['path']}` | {x['blocks']} | {x['chars']} | {x['attrs']} | {x['refs']} |")

          out += ['','## Fichiers CSS partagés les plus lourds','', '| Fichier | Taille source |','|---|---:|']
          for size,path in css_files[:25]: out.append(f'| `{path}` | {size:,} caractères |'.replace(',',' '))

          out += ['','## Références CSS les plus fréquentes','', '| Référence telle qu’utilisée dans les pages | Pages |','|---|---:|']
          for ref,n in css_refs.most_common(25): out.append(f'| `{ref}` | {n} |')

          out += ['','## Blocs locaux exactement dupliqués','']
          if duplicate_groups:
              for i,group in enumerate(duplicate_groups[:20],1):
                  out.append(f'**Groupe {i} — {len(group)} pages** : '+', '.join(f'`{p}`' for p in group))
          else:
              out.append('Aucun bloc `<style>` strictement identique sur plusieurs pages.')

          out += ['','## Candidats de composants strictement stables','',
                  'Sélecteurs présents sur au moins trois pages avec **une seule variante exacte de déclarations**. Ce sont les meilleurs candidats à une extraction sans changement de rendu.','']
          if stable_shared:
              out += ['| Pages | Occurrences | Sélecteur | Où |','|---:|---:|---|---|']
              for page_count,n,s,plist in stable_shared[:30]:
                  listed=', '.join(f'`{p}`' for p in plist[:10])
                  if len(plist)>10: listed+=f' + {len(plist)-10} autres'
                  out.append(f'| {page_count} | {n} | `{s.replace("|","\\|")}` | {listed} |')
          else:
              out.append('Aucun candidat strictement stable selon ce critère.')

          out += ['','## Sélecteurs locaux répétés entre blocs','']
          if repeated_selectors:
              out += ['| Occurrences | Variantes | Sélecteur | Pages |','|---:|---:|---|---|']
              for n,s in repeated_selectors[:40]:
                  listed=', '.join(f'`{p}`' for p in sorted(selector_pages[s])[:12])
                  if len(selector_pages[s])>12: listed+=f' + {len(selector_pages[s])-12} autres'
                  out.append(f'| {n} | {len(selector_bodies[s])} | `{s.replace("|","\\|")}` | {listed} |')
          else:
              out.append('Aucun sélecteur local répété au moins deux fois.')

          out += ['','## Règle de consolidation','',
                  '1. Extraire d’abord les composants locaux réutilisés ou répliqués, pas les exceptions de mise en page réellement uniques.',
                  '2. Ne pas déplacer un bloc uniquement pour faire baisser un compteur : un composant partagé doit avoir un nom et une responsabilité stables.',
                  '3. Après chaque extraction, comparer le rendu desktop/mobile avant et après.',
                  '4. Éviter les nouvelles couches correctives globales lorsque la règle peut vivre dans le composant concerné.',
                  '5. Les attributs `style=` répétés sont des candidats à une classe ; un attribut isolé peut rester local si son intention est réellement unique.','']
          Path('reports/frontend-maintainability-audit.md').write_text('\n'.join(out),encoding='utf-8')
      - name: Commit report if changed
        run: |
          if [ -z "$(git status --porcelain -- reports/frontend-maintainability-audit.md)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/frontend-maintainability-audit.md
          git commit -m 'Update frontend maintainability audit'
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; sleep 2; continue; }
            git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
