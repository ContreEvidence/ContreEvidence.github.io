name: Batch 38 integrate dossier visuals

on:
  push:
    paths:
      - 'scripts/batch38_integrate_dossier_visuals.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Integrate visuals into dossiers
        run: python scripts/batch38_integrate_dossier_visuals.py
      - name: Commit batch 38
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/finance.css dossiers articles
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrate educational visuals into finance dossiers"
          git pull --rebase origin main
          git push origin main
