name: Restore scenario tables that are the page content

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/intent-fit-specific-restores.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore scenario and comparison tables
        shell: python
        run: |
          from pathlib import Path
          import re, html

          tag_re=re.compile(r'<[^>]+>')
          h2_re=re.compile(r'<h2\b[^>]*>(.*?)</h2>',re.I|re.S)
          detail_re=re.compile(r'<details\b([^>]*)class=(["\'])([^"\']*\bce-legacy-detail\b[^"\']*)\2([^>]*)>\s*<summary>(.*?)</summary>\s*(.*?)</details\s*>',re.I|re.S)
          def plain(s): return re.sub(r'\s+',' ',html.unescape(tag_re.sub(' ',s))).strip()

          rules={
            'dossiers/allocation-patrimoine-selon-situation.html': lambda section: True,
            'dossiers/trajectoire-professionnelle-selon-situation.html': lambda section: True,
            'dossiers/garages-parkings-locaux-commerciaux.html': lambda section: (
                section.startswith(('5. Cas','7. Cas','8. Cas','9. Cas','10. Stress','12. Ce qui fait inverser'))
            ),
          }

          for rel,should_open in rules.items():
            p=Path(rel); s=p.read_text(encoding='utf-8')
            headings=list(h2_re.finditer(s))
            out=[]; last=0; opened=[]
            for m in detail_re.finditer(s):
              out.append(s[last:m.start()])
              section=''
              for h in headings:
                if h.start()<m.start(): section=plain(h.group(1))
                else: break
              attrs=(m.group(1)+f'class={m.group(2)}{m.group(3)}{m.group(2)}'+m.group(4)).strip()
              summary=m.group(5); body=m.group(6)
              if should_open(section):
                attrs=re.sub(r'\s*data-ce-table-role=["\'][^"\']*["\']','',attrs,flags=re.I)
                if not re.search(r'\bopen\b',attrs,re.I): attrs+=' open'
                attrs+=' data-ce-table-role="primary"'
                summary='Tableau principal de cette section'
                opened.append(section)
              out.append(f'<details {attrs.strip()}><summary>{summary}</summary>{body}</details>')
              last=m.end()
            out.append(s[last:])
            new=''.join(out)
            if rel.endswith('allocation-patrimoine-selon-situation.html'):
              new=new.replace('"dateModified":"2026-08-15"','"dateModified":"2026-08-17"')
            if new!=s:
              p.write_text(new,encoding='utf-8')
              print('UPDATED',rel)
              for x in opened: print('  OPEN',x)

      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "ContreEvidence"
          git config user.email "contreevidence@gmail.com"
          git add dossiers
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore scenario tables that carry the page answer"
          git push
