name: Batch 28 roadmap resets

on:
  push:
    paths:
      - '.github/workflows/batch-28-roadmap-resets.yml'

permissions:
  contents: write

jobs:
  patch-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Surface roadmap from homepage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          old = '<div class="home-principle"><strong>Le principe</strong><span>Le besoin d’abord. Le domaine ensuite. Les chiffres lorsqu’ils éclairent la décision, les biais lorsqu’ils peuvent la fausser, et les hypothèses clairement séparées des faits.</span></div>'
          new = old + '<div class="home-principle"><strong>Vous voulez voir plus loin ?</strong><span>La <a href="parcours-de-vie.html#feuille-route"><strong>feuille de route vie professionnelle × patrimoine</strong></a> montre comment les priorités évoluent avec les étapes de vie — et comment un enfant, un achat, une promotion, une séparation, un héritage ou la retraite peuvent obliger à recalculer le plan.</span></div>'
          if t.count(old) != 1:
              raise SystemExit(f'homepage principle anchor: expected 1, found {t.count(old)}')
          t = t.replace(old, new, 1)
          t = t.replace('<meta name="dateModified" content="2026-08-15"/>','<meta name="dateModified" content="2026-08-16"/>',1)
          p.write_text(t, encoding='utf-8')
          PY
      - name: Commit homepage roadmap route
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Surface life roadmap from homepage"
          git pull --rebase origin main
          git push origin HEAD:main
