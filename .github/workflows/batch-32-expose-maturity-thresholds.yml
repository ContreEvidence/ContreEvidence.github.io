name: Batch 32 expose maturity thresholds

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Expose patrimonial maturity thresholds in navigation
        shell: python
        run: |
          from pathlib import Path

          hub = Path('themes/argent.html')
          text = hub.read_text(encoding='utf-8')
          old = '<div class="maturity-note">Vous pouvez passer d’un chemin à l’autre à tout moment. Le site ne déduit aucun « niveau » à partir de vos données.</div><p style="margin:.8rem 0 0"><a href="../parcours-de-vie.html#feuille-route"><strong>→ Voir la feuille de route qui relie âge, vie professionnelle, épargne, patrimoine et retraite</strong></a></p>'
          new = '<div class="maturity-note">Vous pouvez passer d’un chemin à l’autre à tout moment. Le site ne déduit aucun « niveau » à partir de vos données.</div><div class="foundation" style="margin-top:1rem"><div><div class="kicker">Me situer avant de choisir un produit</div><h2>500 €, 1 000 €, réserve, capital investissable : où en suis-je vraiment ?</h2><p>Une échelle indépendante de l’âge pour savoir si votre priorité est encore de sécuriser, si vous pouvez commencer à investir, quand la diversification devient utile et à partir de quand le patrimoine commence à acheter du temps.</p><div class="foundation-actions"><a class="btn btn-primary" href="../dossiers/seuils-maturite-patrimoniale.html">Voir mes seuils patrimoniaux →</a><a class="btn btn-ghost" href="../parcours-de-vie.html#feuille-route">Voir la feuille de route complète →</a></div></div><div class="foundation-side"><strong>Le repère central</strong><span>Capital investissable = liquidités − réserve − projets proches − dettes prioritaires. On ne monte pas d’un niveau en détruisant le précédent.</span></div></div>'
          assert text.count(old) == 1, text.count(old)
          hub.write_text(text.replace(old, new, 1), encoding='utf-8')

          inv = Path('parcours-argent.html')
          text = inv.read_text(encoding='utf-8')
          old = '<p><a href="dossiers/premier-investissement-comment-commencer.html">Je commence : préparer mon premier investissement →</a></p>'
          new = '<p><a href="dossiers/seuils-maturite-patrimoniale.html"><strong>Avant d’investir : vérifier si mon capital est réellement investissable →</strong></a></p><p><a href="dossiers/premier-investissement-comment-commencer.html">Je commence : préparer mon premier investissement →</a></p>'
          assert text.count(old) == 1, text.count(old)
          inv.write_text(text.replace(old, new, 1), encoding='utf-8')

          report = Path('reports/content-review-decisions-2026-08-16-batch-32.md')
          report.write_text('''# Revue éditoriale autonome — lot 32 — 16 août 2026\n\n## Problème constaté\nLa page `dossiers/seuils-maturite-patrimoniale.html` était publiée et reliée à la feuille de route, mais pas suffisamment exposée depuis les entrées naturelles du site. Un utilisateur pouvait donc ne pas la trouver.\n\n## Décisions\n- **NAVIGATION — `themes/argent.html`** : ajout d’un bloc très visible sous les trois chemins Patrimoine, avec accès direct aux seuils patrimoniaux.\n- **NAVIGATION — `parcours-argent.html`** : ajout de la vérification du capital réellement investissable avant le premier investissement.\n\n## Doctrine\nUne page structurante n’est pas réellement intégrée au site si elle n’est trouvable que via une page secondaire ou une URL connue. Les pages de progression doivent être accessibles depuis les hubs de domaine et les parcours d’action.\n''', encoding='utf-8')

      - name: Commit batch 32
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/argent.html parcours-argent.html reports/content-review-decisions-2026-08-16-batch-32.md
          git diff --cached --check
          git commit -m "Expose patrimonial maturity thresholds"
          git pull --rebase origin main
          git push
