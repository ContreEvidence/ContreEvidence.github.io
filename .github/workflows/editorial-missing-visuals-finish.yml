name: Editorial missing visuals finish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/editorial-missing-visuals-finish.yml"

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore three bespoke comprehension visuals
        shell: python
        run: |
          from __future__ import annotations
          import pathlib,re
          pages={
            'dossiers/preparer-candidature-avant-postuler.html':(
              'Avant d’envoyer le CV, construisez le système qui permettra de l’améliorer',
              [('Cible','Un ou deux rôles précis, une zone et des contraintes assumées.'),('Marché','Dix à vingt offres lues comme des données : attentes récurrentes, vrais filtres, vocabulaire.'),('Preuves','Reliez chaque exigence importante à une situation, une action et un résultat observable.'),('Petit test','Envoyez une première série comparable et modifiez seulement ce que les réponses permettent d’identifier.')],
              'Le CV vient après la cible et les preuves. Une petite série comparable apprend davantage que cinquante candidatures différentes envoyées au hasard.'),
            'articles/competences-invisibles-preuves.html':(
              'Une compétence devient visible quand elle quitte le vocabulaire abstrait',
              [('Activité réelle','Partez d’un problème, d’une responsabilité ou d’une décision que vous avez réellement prise.'),('Action','Décrivez ce que vous avez fait vous-même, sans vous cacher derrière le titre du poste.'),('Résultat','Ajoutez ce qui a changé : délai, qualité, volume, risque évité, continuité ou satisfaction.'),('Traduction','Présentez cette preuve avec les mots du poste cible pour que le recruteur voie immédiatement le pont.')],
              '« Organisation », « autonomie » ou « relation client » sont faibles seules. Une situation + une action + un résultat rendent la compétence crédible et transférable.'),
            'dossiers/debloquer-demarche-administrative.html':(
              'Quand une démarche bloque, cessez de traiter “l’administration” comme un seul acteur',
              [('Blocage exact','Quelle étape ne passe plus : pièce, délai, décision, identité, paiement, droit ou accès technique ?'),('Preuve attendue','Quel document, texte, numéro, accusé ou justificatif permet de rendre la demande vérifiable ?'),('Bon interlocuteur','Qui possède réellement le pouvoir de corriger, instruire, décider ou escalader ce point précis ?'),('Prochaine action écrite','Demande claire, trace conservée, délai annoncé et règle de relance si rien ne bouge.')],
              'Le bon levier n’est pas « insister davantage » : c’est identifier le point exact de blocage, la preuve attendue et l’acteur qui peut réellement le modifier.')
          }
          root=pathlib.Path('.')
          def div_end(raw,start):
              token=re.compile(r'<div\b[^>]*>|</div\s*>',re.I); depth=0
              for m in token.finditer(raw,start):
                  if m.group(0).lower().startswith('<div'): depth+=1
                  else:
                      depth-=1
                      if depth==0:return m.end()
              return None
          def remove_visual(raw):
              pat=re.compile(r'<div\b[^>]*class=(["\'])[^"\']*\bce-priority-visual\b[^"\']*\1[^>]*>',re.I)
              m=pat.search(raw)
              if not m:return raw
              end=div_end(raw,m.start())
              return raw[:m.start()]+raw[end:] if end else raw
          def answer_end(raw):
              m=re.search(r'<div\b[^>]*class=(["\'])[^"\']*\banswer-box\b[^"\']*\1[^>]*>',raw,re.I)
              return div_end(raw,m.start()) if m else None
          def visual(title,steps,result):
              cards=''.join(f'<div class="ce-priority-step"><b>{a}</b><span>{b}</span></div>' for a,b in steps)
              return f'<div class="ce-priority-visual" role="img" aria-label="Résumé visuel de la décision"><h3>{title}</h3><div class="ce-priority-grid">{cards}</div><div class="ce-priority-result"><strong>À retenir :</strong> {result}</div></div>'
          changed=[]
          for rel,(title,steps,result) in pages.items():
              p=root/rel; raw=p.read_text(encoding='utf-8',errors='replace'); original=raw
              if 'editorial-standard.css' not in raw:
                  raw=raw.replace('</head>','<link rel="stylesheet" href="../assets/editorial-standard.css?v=20260817-4"/></head>',1)
              raw=remove_visual(raw)
              pos=answer_end(raw)
              if pos is None:
                  m=re.search(r'<article\b[^>]*>',raw,re.I); pos=m.end() if m else None
              if pos is not None: raw=raw[:pos]+visual(title,steps,result)+raw[pos:]
              if raw!=original:
                  p.write_text(raw,encoding='utf-8'); changed.append(rel)
          print(f'Visuels rétablis: {len(changed)}')
          for r in changed: print('RESTORED',r)
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "ContreEvidence"
          git config user.email "contreevidence@gmail.com"
          git add articles dossiers
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore bespoke visuals on remaining pages"
          git push
