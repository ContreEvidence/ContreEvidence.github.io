name: Batch 37 homogenize patrimoine typography

on:
  push:
    paths:
      - 'scripts/batch37_homogenize_patrimoine_typography.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Normalize typography
        run: python scripts/batch37_homogenize_patrimoine_typography.py
      - name: Commit batch 37
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/argent.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Homogenize patrimoine typography"
          git pull --rebase origin main
          git push origin main
