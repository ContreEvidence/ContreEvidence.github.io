name: Corpus Solution Engineer Review

on:
  push:
    branches: [main]
    paths:
      - 'dossiers/**.html'
      - 'articles/**.html'
      - 'reports/corpus-solution-human-review*.json'
      - '.github/workflows/corpus-solution-review.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corpus-solution-review
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan corpus for solution-engineering depth
        run: |
          python - <<'PY'
          from pathlib import Path
          from html import unescape
          import re, json, subprocess
          from datetime import date

          roots = [Path('dossiers'), Path('articles')]
          files = []
          for root in roots:
              if root.exists():
                  files.extend(root.rglob('*.html'))

          review_files = []
          base_review = Path('reports/corpus-solution-human-review.json')
          if base_review.exists():
              review_files.append(base_review)
          review_files.extend(sorted(Path('reports').glob('corpus-solution-human-review-*.json')))

          reviews = {}
          for reviews_path in review_files:
              try:
                  payload = json.loads(reviews_path.read_text(encoding='utf-8'))
                  reviews.update(payload.get('pages', {}))
              except Exception as exc:
                  print(f'Ignoring invalid review file {reviews_path}: {exc}')

          TAG = re.compile(r'<[^>]+>', re.S)
          SCRIPT = re.compile(r'<(script|style)\b[^>]*>.*?</\1>', re.I | re.S)
          COMMENTS = re.compile(r'<!--.*?-->', re.S)
          NOINDEX = re.compile(r'<meta\b[^>]*name=["\']robots["\'][^>]*content=["\'][^"\']*noindex', re.I)

          def visible_text(raw):
              raw = SCRIPT.sub(' ', raw)
              raw = COMMENTS.sub(' ', raw)
              raw = TAG.sub(' ', raw)
              raw = unescape(raw)
              return re.sub(r'\s+', ' ', raw).strip().lower()

          def blob_sha(path):
              return subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()

          checks = {
              'probleme': [r'probl[eè]me', r'obstacle', r'verrou', r'goulot', r'blocage', r'contrainte', r'pi[eè]ge'],
              'causalite': [r'parce que', r'cause', r'entra[iî]ne', r'm[eé]canisme', r'si .{0,100} alors', r'test causal', r'change parce'],
              'options': [r'alternative', r'option', r'sc[eé]nario', r'voie', r'plan b', r'autre solution', r'hybride', r'progressi'],
              'temps_seuil': [r'seuil', r'bascule', r'fen[eê]tre', r'horizon', r'temporaire', r'\bavant\b', r'\bapr[eè]s\b', r'\bmois\b', r'\bans?\b'],
              'quantification': [r'\d\s?%', r'\d[\d\s.,]*\s?€', r'\d+[,.]\d+', r'formule', r'calcul', r'point mort', r'co[uû]t'],
              'adverse': [r'stress test', r'sc[eé]nario d[eé]grad', r'choc', r'mauvaise nouvelle', r'risque', r'fragile', r'perte'],
              'sequence': [r'\b[eé]tape', r'\bplan\b', r'\bordre\b', r's[eé]quence', r'30 jours', r'90 jours', r'commence', r'puis'],
              'sortie': [r'r[eé]versib', r'sortie', r'abandon', r'renonc', r'revenir', r'arr[eê]t', r'cesser', r'quand .* changer'],
              'preuve': [r'source', r'r[eé]f[eé]rence', r'v[eé]rifi', r'officiel', r'hypoth[eè]se', r'p[eé]dagogique', r'ne prouve pas', r'condition'],
          }

          rows = []
          excluded = 0
          human_valid = 0
          human_stale = 0
          for path in sorted(files):
              raw = path.read_text(encoding='utf-8', errors='ignore')
              if NOINDEX.search(raw):
                  excluded += 1
                  continue
              text = visible_text(raw)
              words = len(text.split())
              result = {key: any(re.search(p, text, re.I | re.S) for p in patterns) for key, patterns in checks.items()}
              score = sum(result.values())
              p = str(path)
              current_sha = blob_sha(path)
              review = reviews.get(p)
              reviewed_sha = review.get('sha', '') if review else ''
              human_ok = bool(review and review.get('status') == 'conforme' and reviewed_sha == current_sha)
              stale = bool(review and reviewed_sha != current_sha)
              human_valid += int(human_ok)
              human_stale += int(stale)
              rows.append((score, words, p, result, human_ok, stale, current_sha, reviewed_sha))

          rows.sort(key=lambda x: (x[0], x[1], x[2]))
          out = []
          out.append('# Revue corpus — Solution Engineer')
          out.append('')
          out.append(f'Mise à jour automatique : {date.today().isoformat()}')
          out.append('')
          out.append('Cet audit couvre les contenus indexables de `dossiers/` et `articles/`. Les pages `noindex` sont exclues. Les validations humaines restent actives uniquement tant que le SHA du fichier ne change pas.')
          out.append('')
          out.append('Dimensions détectées : problème/contrainte, causalité, options, temps/seuils, quantification, scénario adverse, séquence, sortie/réversibilité, preuve.')
          out.append('')
          out.append(f'Pages analysées : **{len(rows)}**. Pages `noindex` exclues : **{excluded}**. Validations humaines actives : **{human_valid}**. Validations devenues caduques après modification : **{human_stale}**.')
          out.append('')
          out.append('## Priorité humaine')
          out.append('')
          out.append('| Score | Mots | Page | Dimensions manquantes |')
          out.append('|---:|---:|---|---|')
          priority_count = 0
          for score, words, path, result, human_ok, stale, current_sha, reviewed_sha in rows:
              if (score <= 6 or words < 700) and not human_ok:
                  missing = ', '.join(k for k,v in result.items() if not v) or '—'
                  suffix = ' · validation précédente caduque' if stale else ''
                  out.append(f'| {score}/9 | {words} | `{path}` | {missing}{suffix} |')
                  priority_count += 1
          if not priority_count:
              out.append('| — | — | — | **Aucune priorité critique non relue** |')
          out.append('')
          out.append('## Validations devenues caduques')
          out.append('')
          stale_rows = [row for row in rows if row[5]]
          if stale_rows:
              out.append('| Page | SHA relu | SHA courant |')
              out.append('|---|---|---|')
              for score, words, path, result, human_ok, stale, current_sha, reviewed_sha in stale_rows:
                  out.append(f'| `{path}` | `{reviewed_sha}` | `{current_sha}` |')
          else:
              out.append('Aucune.')
          out.append('')
          out.append('## Pages validées humainement et inchangées')
          out.append('')
          for score, words, path, result, human_ok, stale, current_sha, reviewed_sha in rows:
              if human_ok:
                  note = reviews[path].get('note', '')
                  out.append(f'- `{path}` — {score}/9 automatique — {note}')
          out.append('')
          out.append('## Corpus complet')
          out.append('')
          out.append('| Score | Mots | Revue | Page |')
          out.append('|---:|---:|---|---|')
          for score, words, path, result, human_ok, stale, current_sha, reviewed_sha in rows:
              status = 'humaine ✓' if human_ok else ('à revoir après changement' if stale else 'heuristique')
              out.append(f'| {score}/9 | {words} | {status} | `{path}` |')
          out.append('')
          out.append('## Règle de reprise')
          out.append('')
          out.append('Une page signalée n’est réécrite que si une lecture humaine identifie un gain réel : faux verrou, levier causal manquant, seuil, séquence, combinaison, scénario adverse, preuve ou condition de sortie. Une validation humaine est attachée au contenu exact du fichier : toute modification la révoque automatiquement.')
          out.append('')
          Path('reports/corpus-solution-review.md').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

      - name: Commit report if changed
        run: |
          if [ -z "$(git status --porcelain -- reports/corpus-solution-review.md)" ]; then
            echo 'No report change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/corpus-solution-review.md
          git commit -m 'Update corpus Solution Engineer review'
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; sleep 2; continue; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 2))
          done
          exit 1