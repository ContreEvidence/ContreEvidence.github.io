name: Update RSS feeds

on:
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'dossiers/**'
      - 'themes/**'
      - 'fiches-metiers/**'
      - '*.html'
      - 'outil*.html'
      - 'simulateur*.html'
      - 'assets/library-catalog.js'
      - 'assets/library-daily-money.js'
      - 'assets/library-work-foundations.js'
      - 'assets/tools-catalog.js'
      - 'scripts/generate-rss.cjs'
      - '.github/workflows/rss.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rss-root-site
  cancel-in-progress: true

jobs:
  rss:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate RSS feeds
        run: node scripts/generate-rss.cjs

      - name: Commit generated feeds if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss.xml rss-*.xml rss-feeds.json '*.html' articles dossiers themes fiches-metiers 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "RSS feeds are already current."
            exit 0
          fi
          git commit -m "Mise à jour automatique des flux RSS"
          git pull --rebase origin main
          git push
