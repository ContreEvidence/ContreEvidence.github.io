name: Deepen low-profit entrepreneurship diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deepen-low-profit-diagnostic.yml'
      - 'scripts/deepen-low-profit-diagnostic.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Add thresholds, scenarios and stress tests
        run: python scripts/deepen-low-profit-diagnostic.py
      - name: Commit article
        run: |
          if git diff --quiet -- articles/travailler-beaucoup-gagner-peu-prix.html; then
            echo 'Article already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles/travailler-beaucoup-gagner-peu-prix.html
          git commit -m 'Approfondir le diagnostic activité pleine peu rentable'
          git pull --rebase origin main
          git push
