name: Apply coherence patch

on:
  push:
    paths:
      - 'scripts/apply_coherence_patch.py'
      - '.github/workflows/apply-coherence-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply_coherence_patch.py
      - name: Show changed files
        run: git status --short
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git add confidentialite.html assets/personal-space.js outil-microscope-pea.html outil-capital-professionnel.html themes/argent.html parcours-argent.html parcours-de-vie.html assets/context-tools.js articles/grosse-entree-argent-que-faire.html dossiers/decider-a-deux-travail-patrimoine.html assets/library-transitions.js
          git commit -m "Fix coherence gaps across decision journeys"
          git push
