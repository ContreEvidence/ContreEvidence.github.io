name: Fix final render residuals
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-final-render-residuals.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fix remaining page-specific render issues
        shell: python
        run: |
          from pathlib import Path

          # Old dossier shells that missed the current mobile/brand layers.
          dossier_layers = {
            'dossiers/bien-immobilier-garder-vendre-transformer.html': ['../assets/voice.css','../assets/personal-space.css?v=20260810-13','../assets/ux-retention.css?v=20260810-13'],
            'dossiers/competent-mais-invisible-travail.html': ['../assets/brand.css?v=20260808-22','../assets/personal-space.css?v=20260810-13','../assets/ux-retention.css?v=20260810-13'],
            'dossiers/patrimoine-marge-de-manoeuvre.html': ['../assets/voice.css','../assets/personal-space.css?v=20260810-13','../assets/ux-retention.css?v=20260810-13'],
            'dossiers/quitter-travail-reconversion-sans-se-fragiliser.html': ['../assets/voice.css','../assets/personal-space.css?v=20260810-13','../assets/ux-retention.css?v=20260810-13'],
            'dossiers/travailler-moins-vivre-mieux.html': ['../assets/voice.css','../assets/ux-retention.css?v=20260810-13'],
          }
          for file, hrefs in dossier_layers.items():
              p=Path(file); s=p.read_text(encoding='utf-8')
              additions=[]
              for href in hrefs:
                  base=href.split('?')[0]
                  if base not in s:
                      additions.append(f'<link rel="stylesheet" href="{href}">')
              if additions:
                  s=s.replace('</head>',''.join(additions)+'</head>',1)
                  p.write_text(s,encoding='utf-8')

          # Three dossier pages had the long-form stylesheet/content but missed the common reading runtime.
          for file in [
            'dossiers/accepter-emploi-plus-loin-cout-trajet.html',
            'dossiers/acheter-ou-louer-si-on-risque-demenager.html',
            'dossiers/demenager-pour-un-emploi-salaire-minimum.html',
          ]:
              p=Path(file); s=p.read_text(encoding='utf-8')
              if 'longform.js' not in s:
                  s=s.replace('</body>','<script src="../assets/longform.js?v=20260810-13"></script></body>',1)
                  p.write_text(s,encoding='utf-8')

          # Capital-professional grid: selects were imposing their intrinsic width on the one-column mobile grid.
          p=Path('outil-capital-professionnel.html'); s=p.read_text(encoding='utf-8')
          guard='/* cap mobile intrinsic-width guard */'
          if guard not in s:
              css='''<style>/* cap mobile intrinsic-width guard */\n.cap-dims,.cap-field{min-width:0}.cap-field select{width:100%;max-width:100%;min-width:0}\n</style>'''
              s=s.replace('</head>',css+'</head>',1); p.write_text(s,encoding='utf-8')

          # Investment tool: direct unit text after 100%-wide inputs added ~20px to the row.
          p=Path('simulateur-investissement-locatif.html'); s=p.read_text(encoding='utf-8')
          guard='/* inline-unit mobile guard */'
          if guard not in s:
              css='''<style>/* inline-unit mobile guard */\n@media(max-width:850px){#vacancy,#rate,#years,#stressRent,#stressCosts{width:calc(100% - 2.8rem)}}\n</style>'''
              s=s.replace('</head>',css+'</head>',1); p.write_text(s,encoding='utf-8')

          # Three tiny residual scroll widths are caused by legacy decorative/off-canvas elements, not content.
          for file in [
            'articles/contraintes-innovation.html',
            'articles/investir-grosse-somme-dun-coup-ou-progressivement.html',
            'dossiers/management-relations-conflits.html',
          ]:
              p=Path(file); s=p.read_text(encoding='utf-8')
              guard='legacy-offcanvas-render-guard'
              if guard not in s:
                  s=s.replace('</head>','<style id="legacy-offcanvas-render-guard">html,body{overflow-x:clip}</style></head>',1)
                  p.write_text(s,encoding='utf-8')

          # Avoid an unnecessary /favicon.ico 404 on this older article.
          p=Path('articles/premiere-chance-sans-experience.html'); s=p.read_text(encoding='utf-8')
          if 'rel="icon"' not in s and "rel='icon'" not in s:
              s=s.replace('</head>','<link rel="icon" href="../assets/logo.png"></head>',1); p.write_text(s,encoding='utf-8')

          # HTML sitemap: preserve its minimalist design but give it a semantic main region.
          p=Path('plan-du-site.html'); s=p.read_text(encoding='utf-8')
          if '<main' not in s.lower():
              first=s.find('<section>')
              last=s.rfind('</section>')
              if first<0 or last<0: raise SystemExit('plan-du-site sections not found')
              s=s[:first]+'<main>'+s[first:last+10]+'</main>'+s[last+10:]
              p.write_text(s,encoding='utf-8')
      - name: Commit targeted residual fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles dossiers outil-capital-professionnel.html simulateur-investissement-locatif.html plan-du-site.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Resolve remaining browser render findings"
          git push
