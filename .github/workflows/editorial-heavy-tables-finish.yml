name: Editorial heavy tables finish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/editorial-heavy-tables-finish.yml"

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Keep only two comparison tables in the main reading flow
        shell: python
        run: |
          from __future__ import annotations
          import pathlib,re

          targets=[
            'dossiers/seuils-maturite-patrimoniale.html',
            'dossiers/prix-attendre-finances.html',
            'dossiers/calculer-prix-minimum-rentable.html',
            'dossiers/demenager-pour-un-emploi-salaire-minimum.html',
            'dossiers/quitter-travail-reconversion-sans-se-fragiliser.html',
            'dossiers/preparer-candidature-avant-postuler.html',
            'articles/premiere-chance-sans-experience.html',
            'dossiers/premier-salaire-18-ans-chez-parents.html',
            'articles/competences-invisibles-preuves.html',
            'articles/investir-grosse-somme-dun-coup-ou-progressivement.html',
          ]
          root=pathlib.Path('.')
          pat=re.compile(r'<div\b[^>]*class=(["\'])[^"\']*\bcompare-wrap\b[^"\']*\1[^>]*>\s*<table\b.*?</table>\s*</div>',re.I|re.S)

          def in_detail(raw,pos):
              before=raw[:pos]
              return before.rfind('<details class="ce-legacy-detail">')>before.rfind('</details>')

          changed=[]
          for rel in targets:
              p=root/rel
              if not p.exists():
                  print('MISSING',rel); continue
              raw=p.read_text(encoding='utf-8',errors='replace'); original=raw
              if 'editorial-standard.css' not in raw:
                  raw=raw.replace('</head>','<link rel="stylesheet" href="../assets/editorial-standard.css?v=20260817-3"/></head>',1)
              matches=list(pat.finditer(raw))
              out=[]; last=0; visible_seen=0
              for m in matches:
                  out.append(raw[last:m.start()]); block=m.group(0)
                  if in_detail(raw,m.start()):
                      out.append(block)
                  else:
                      visible_seen+=1
                      if visible_seen<=2:
                          out.append(block)
                      else:
                          out.append('<details class="ce-legacy-detail"><summary>Voir le tableau détaillé</summary>'+block+'</details>')
                  last=m.end()
              out.append(raw[last:]); raw=''.join(out)
              if raw!=original:
                  p.write_text(raw,encoding='utf-8'); changed.append(rel)
          print(f'Pages allégées: {len(changed)}')
          for r in changed: print('CLEANED',r)
      - name: Validate and commit
        run: |
          git diff --check
          if git diff --quiet -- articles dossiers; then
            echo "No visible-table cleanup required."
            exit 0
          fi
          git config user.name "ContreEvidence"
          git config user.email "contreevidence@gmail.com"
          git add articles dossiers
          git commit -m "Reduce visible table density across remaining pages"
          git push
