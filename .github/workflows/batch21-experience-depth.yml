name: Batch 21 experience depth patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/batch21-experience-depth.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Deepen experienced-candidate decision guide
        shell: python
        run: |
          from pathlib import Path
          path = Path('dossiers/experience-devient-risque-recruteur.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('2026-08-10', '2026-08-16')
          text = text.replace('Mis à jour le 09/08/2026 · Sources et hypothèses précisées dans le dossier', 'Mis à jour le 16/08/2026 · Gatekeepers, tests de diagnostic, effets secondaires et conditions de renversement intégrés')
          anchor = '<h2>13. Préparer cinq preuves</h2>'
          if anchor not in text:
              raise SystemExit('Anchor not found; refusing to patch')
          addition = '<h2>13. Localiser le filtre avant de corriger le profil</h2><p>Un refus n’a pas la même signification selon l’endroit où il se produit. Si vous ne savez pas qui vous élimine, vous risquez de traiter le mauvais problème.</p><div class="compare-wrap"><table class="compare-table"><thead><tr><th>Étape où ça bloque</th><th>Gatekeeper probable</th><th>Ce qu’il peut lire comme risque</th><th>Réponse utile</th></tr></thead><tbody><tr><td>Aucune réponse malgré des offres compatibles</td><td>tri initial, RH, recruteur, parfois outil de présélection</td><td>intitulé, salaire supposé, surqualification, mots-clés, trajectoire peu lisible</td><td>clarifier le poste visé, raccourcir la démonstration, aligner les preuves et tester un canal plus direct.</td></tr><tr><td>Échange RH puis arrêt</td><td>recruteur / RH</td><td>budget, motivation, disponibilité, stabilité</td><td>traiter explicitement salaire, raison du changement et horizon de présence.</td></tr><tr><td>Entretien manager puis arrêt</td><td>futur responsable</td><td>autonomie, hiérarchie, méthodes, intégration dans l’équipe</td><td>apporter des exemples de coopération et montrer comment l’expérience sert le rôle sans le redéfinir.</td></tr><tr><td>Dernier tour puis refus</td><td>décideur final / comparaison avec un autre candidat</td><td>écart de risque ou de valeur très précis</td><td>chercher le motif récurrent et comparer la preuve manquante plutôt que refaire toute la candidature.</td></tr></tbody></table></div><p><strong>La bonne question n’est donc pas seulement “qu’est-ce qui inquiète un recruteur ?” mais “quel acteur doit être rassuré, à quel moment, avec quelle preuve ?”.</strong></p><h2>14. Ne répondez pas à une objection que personne n’a encore formulée</h2><p>Un profil expérimenté peut se fragiliser lui-même en anticipant trop fortement la surqualification : CV excessivement amputé, salaire minimisé avant toute discussion, discours défensif sur l’âge ou insistance sur le fait de ne plus vouloir manager. Vous rendez alors visible un problème que l’interlocuteur n’avait peut-être pas encore.</p><div class="decision-box"><h3>Principe</h3><p><strong>Montrez d’abord la valeur pertinente pour le poste. Traitez ensuite le risque qui apparaît réellement.</strong> La candidature doit réduire l’incertitude, pas ouvrir cinq objections préventives.</p></div><h2>15. Tester l’hypothèse au lieu de réécrire son CV chaque semaine</h2><p>Si vous soupçonnez que l’ancien niveau de responsabilité bloque le premier filtre, construisez un test simple sur des offres comparables. Gardez la cible, la zone et le niveau de poste aussi stables que possible, puis modifiez une variable principale.</p><div class="compare-wrap"><table class="compare-table"><thead><tr><th>Série</th><th>Variable testée</th><th>Ce qu’on observe</th></tr></thead><tbody><tr><td>A</td><td>CV actuel</td><td>réponses humaines / candidatures comparables.</td></tr><tr><td>B</td><td>haut de CV recentré sur le rôle cible et preuves opérationnelles</td><td>variation du taux de réponse et nature des échanges.</td></tr><tr><td>Canal direct</td><td>même proposition via réseau, prescripteur ou contact ciblé</td><td>écart entre filtre documentaire et lecture humaine du profil.</td></tr></tbody></table></div><p>Il ne s’agit pas d’un protocole scientifique parfait. Il sert à éviter une erreur coûteuse : <strong>changer simultanément le CV, les postes visés, le salaire et le discours, puis ne plus savoir ce qui a produit le résultat.</strong></p><h2>16. Les vraies substitutions : parfois le problème n’est pas la candidature</h2><p>Si le marché ciblé valorise peu l’expérience que vous apportez, le meilleur levier peut être ailleurs que dans la formulation du CV.</p><div class="compare-wrap"><table class="compare-table"><thead><tr><th>Problème constaté</th><th>Substitution possible</th><th>Ce que cela change</th></tr></thead><tbody><tr><td>Postes très standardisés et sensibles au coût</td><td>cibler des environnements où erreur, coordination ou relation client coûtent plus cher</td><td>l’expérience devient une réduction de risque plutôt qu’un surcoût supposé.</td></tr><tr><td>Changement de secteur</td><td>viser une fonction adjacente qui réutilise davantage les preuves existantes</td><td>moins d’incertitudes à faire accepter simultanément.</td></tr><tr><td>Profil difficile à comprendre sur CV</td><td>augmenter la part de mises en relation, recommandations et échanges directs</td><td>un humain peut interpréter la trajectoire avant le filtre binaire.</td></tr><tr><td>Salaire cible incompatible avec le marché</td><td>modifier le niveau de poste, le secteur, les contraintes acceptées ou le package total</td><td>on traite un problème économique au lieu de le maquiller en problème de communication.</td></tr></tbody></table></div><p><strong>Une candidature ne peut pas convaincre durablement un poste dont les paramètres fondamentaux ne vous conviennent pas.</strong></p><h2>17. Les effets de second ordre d’une sur-correction</h2><div class="compare-wrap"><table class="compare-table"><thead><tr><th>Correction intuitive</th><th>Risque déplacé</th></tr></thead><tbody><tr><td>Effacer fortement les responsabilités passées</td><td>le parcours devient incohérent ou sous-documenté.</td></tr><tr><td>Accepter n’importe quel salaire pour rassurer</td><td>frustration réelle et départ rapide quelques mois plus tard.</td></tr><tr><td>Multiplier les formations pour paraître “à jour”</td><td>beaucoup de certificats, mais toujours peu de preuves récentes d’utilisation.</td></tr><tr><td>Descendre fortement de niveau sans raison positive</td><td>le recruteur peut précisément renforcer son doute sur la stabilité.</td></tr><tr><td>Se vendre comme capable de “tout faire”</td><td>le poste visé devient moins lisible, pas plus.</td></tr></tbody></table></div><p>La bonne stratégie ne consiste donc pas à rendre l’expérience plus petite. Elle consiste à <strong>rendre sa contribution plus précise et son coût supposé moins incertain</strong>.</p><h2>18. Quand attendre ou repositionner peut être supérieur à accepter tout de suite</h2><p>Accepter rapidement un poste moins payé ou beaucoup moins qualifié peut être rationnel si le revenu est urgent. Mais attendre quelques semaines peut être supérieur si vous disposez d’une réserve suffisante et qu’un test précis est en cours : nouveau segment, processus avancé, qualification courte réellement demandée ou repositionnement qui montre déjà de meilleurs signaux.</p><p>À l’inverse, attendre n’a plus beaucoup de valeur si aucune information nouvelle n’est attendue et que vous répétez la même stratégie. Dans ce cas, le coût d’attendre augmente sans améliorer la décision.</p><h2>19. Conditions de renversement : quand cesser d’essayer de “rassurer”</h2><div class="compare-wrap"><table class="compare-table"><thead><tr><th>Conclusion provisoire</th><th>Information nouvelle</th><th>Révision</th></tr></thead><tbody><tr><td>« mon expérience est mal présentée »</td><td>les échanges humains sont nombreux mais le salaire bloque systématiquement</td><td>traiter le marché et le niveau de rémunération, pas le CV.</td></tr><tr><td>« je dois viser plus bas »</td><td>les postes plus bas doutent encore davantage de la stabilité</td><td>remonter vers un niveau où l’expérience paraît cohérente.</td></tr><tr><td>« mon âge me ferme tout »</td><td>un segment ou canal produit nettement plus d’entretiens</td><td>concentrer l’effort là où la preuve passe le filtre.</td></tr><tr><td>« il me faut une nouvelle formation »</td><td>les refus portent sur l’expérience récente ou le contexte, pas sur une qualification</td><td>chercher une preuve d’usage ou une première mission plutôt qu’un diplôme supplémentaire.</td></tr><tr><td>« ce poste moins élevé est mon meilleur compromis »</td><td>le budget ou le contenu devient intenable à deux ans</td><td>ne pas bâtir une candidature sur une promesse de stabilité que vous ne pourrez pas tenir.</td></tr></tbody></table></div><h2>20. Préparer cinq preuves</h2>'
          text = text.replace(anchor, addition, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "contre-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dossiers/experience-devient-risque-recruteur.html
          git commit -m "Deepen experienced-candidate risk diagnosis"
          git push
