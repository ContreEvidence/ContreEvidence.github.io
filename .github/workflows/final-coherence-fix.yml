name: Final coherence fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-coherence-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Align final Vie professionnelle card copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('parcours-vie-professionnelle.html')
          s = p.read_text(encoding='utf-8')
          old = '<p>Comparer rester, partir ou préparer une troisième voie, avec leurs coûts, leurs risques et les options futures qu’ils ouvrent.</p>'
          new = '<p>Voir ce qui peut encore changer dans le poste et ce qui deviendrait possible en partant.</p>'
          if old not in s:
              raise SystemExit('Expected Vie pro card copy not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit page correction
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parcours-vie-professionnelle.html
          git commit -m "Align final Vie pro card copy"
          git push
