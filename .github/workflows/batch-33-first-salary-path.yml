          report.write_text('''# Revue éditoriale autonome — lot 33 — 16 août 2026\n\n## Problème constaté\nLe dossier des seuils patrimoniaux était utile comme cadre, mais trop abstrait pour un jeune de 18 ans qui touche son premier salaire, vit chez ses parents et doit décider seul quoi faire de l’argent.\n\n## Décisions\n- **CREATE — `dossiers/premier-salaire-18-ans-chez-parents.html`** : plan immédiatement exécutable, exemple à 1 600 € net, répartition mois 1–3 puis mois 4+, fonds d’autonomie, PEA/PEA jeune, assurance-vie et erreurs à éviter.\n- **REWRITE — `dossiers/seuils-maturite-patrimoniale.html`** : le dossier commence désormais par le cas premier salaire ; la théorie des niveaux vient ensuite.\n- **REWRITE — `parcours-de-vie.html`** : la phase 18–25 renvoie directement au premier salaire et corrige la présentation du LEP/PEA jeune selon le rattachement fiscal.\n- **NAVIGATION — `themes/argent.html`** : le cas premier salaire devient la première entrée du pilier Argent au quotidien.\n- **INDEX — `sitemap.xml`** : nouvelle page ajoutée.\n\n## Doctrine\n1. Un débutant doit pouvoir agir avant de comprendre toute l’architecture patrimoniale.\n2. À 18 ans sans charges, le repère n’est pas les dépenses actuelles mais le coût de la future autonomie.\n3. La période sans loyer est un accélérateur temporaire : elle doit financer à la fois plaisir, autonomie, capital professionnel et long terme.\n4. Livret et capital long terme ne servent pas la même échéance.\n5. Les produits viennent après l’usage : Livret A pour disponibilité, PEA/PEA jeune pour le long terme, assurance-vie facultative au départ.\n''', encoding='utf-8')

