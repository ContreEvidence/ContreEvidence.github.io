name: Batch 33 first salary beginner path

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Connect the concrete first-salary path
        shell: python
        run: |
          from pathlib import Path

          page = Path('dossiers/premier-salaire-18-ans-chez-parents.html')
          p = page.read_text(encoding='utf-8')
          robots = '<meta name="robots" content="noindex,nofollow">\n'
          assert p.count(robots) == 1
          page.write_text(p.replace(robots, '', 1), encoding='utf-8')

          thresholds = Path('dossiers/seuils-maturite-patrimoniale.html')
          t = thresholds.read_text(encoding='utf-8')
          anchor = '<article class="prose novice-prose">\n'
          block = '<article class="prose novice-prose">\n<div class="answer-box"><h2>Vous avez 18 ans, un premier salaire et presque aucune charge ? Commencez ici.</h2><p>Ne commencez pas par calculer votre « runway ». Votre première décision est beaucoup plus simple : <strong>combien gardez-vous pour profiter du mois, combien mettez-vous de côté pour devenir autonome, et quelle petite partie peut vraiment rester investie longtemps ?</strong></p><p>Exemple avec 1 600 € net et aucun loyer : pendant trois mois, 350 € pour vivre et 1 250 € sur Livret A. Une fois 3 000–5 000 € liquides et les projets des deux prochaines années chiffrés, une partie du nouveau salaire peut commencer à aller vers un PEA/PEA jeune. Si permis, voiture ou déménagement arrivent bientôt, elle reste liquide.</p><p><a href="premier-salaire-18-ans-chez-parents.html"><strong>→ Ouvrir le plan concret « premier salaire à 18 ans » : montants, comptes et ordre des décisions</strong></a></p></div>\n'
          assert t.count(anchor) == 1
          t = t.replace(anchor, block, 1)
          old = '<div class="answer-box"><h2>La carte en sept niveaux</h2>'
          assert t.count(old) == 1
          t = t.replace(old, '<div class="answer-box"><h2>Ensuite seulement : la carte en sept niveaux</h2>', 1)
          thresholds.write_text(t, encoding='utf-8')

          roadmap = Path('parcours-de-vie.html')
          r = roadmap.read_text(encoding='utf-8')
          old = '<p class="tools"><strong>Outils à regarder maintenant</strong><a href="dossiers/liquidites-reserve-securite.html">LEP si vous y avez droit, Livret A puis LDDS</a> pour la réserve disponible. Une fois ce socle crédible, un <a href="dossiers/finances-enveloppes-fiscalite.html">PEA et/ou une bonne assurance-vie</a> peuvent être ouverts avec peu pour lancer leur ancienneté si vous avez une vraie raison de les utiliser plus tard. Si votre employeur abonde un PEE, comparez-le avant de l’ignorer.</p>'
          new = '<p class="tools"><strong>Si c’est votre premier salaire</strong><a href="dossiers/premier-salaire-18-ans-chez-parents.html">Commencez par répartir concrètement le salaire entre plaisir, autonomie et long terme →</a> Pour l’argent qui doit rester disponible, le Livret A est le point de départ simple. Le LEP n’est possible que si vous avez votre propre imposition et remplissez ses conditions ; un jeune encore rattaché fiscalement à ses parents ne peut pas en détenir. Pour le long terme, regardez le <a href="dossiers/finances-enveloppes-fiscalite.html">PEA jeune si vous êtes rattaché, ou le PEA classique sinon</a>. L’assurance-vie peut venir ensuite avec une fonction claire ; elle n’est pas une urgence à 18 ans. Si votre employeur abonde un PEE, comparez-le tôt.</p>'
          assert r.count(old) == 1
          roadmap.write_text(r.replace(old, new, 1), encoding='utf-8')

          hub = Path('themes/argent.html')
          h = hub.read_text(encoding='utf-8')
          old = '<div class="pillar-links"><a href="../articles/construire-epargne-de-zero.html">Commencer : construire sa première épargne à partir de zéro →</a>'
          new = '<div class="pillar-links"><a href="../dossiers/premier-salaire-18-ans-chez-parents.html"><strong>Premier salaire : j’ai 18 ans, peu de charges, que faire de l’argent ? →</strong></a><a href="../articles/construire-epargne-de-zero.html">Commencer : construire sa première épargne à partir de zéro →</a>'
          assert h.count(old) == 1
          hub.write_text(h.replace(old, new, 1), encoding='utf-8')

          sitemap = Path('sitemap.xml')
          s = sitemap.read_text(encoding='utf-8')
          entry = '  <url><loc>https://contreevidence.github.io/dossiers/premier-salaire-18-ans-chez-parents.html</loc><lastmod>2026-08-16</lastmod></url>\n'
          assert 'dossiers/premier-salaire-18-ans-chez-parents.html' not in s
          sitemap.write_text(s.replace('</urlset>', entry + '</urlset>', 1), encoding='utf-8')

      - name: Commit batch 33
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dossiers/premier-salaire-18-ans-chez-parents.html dossiers/seuils-maturite-patrimoniale.html parcours-de-vie.html themes/argent.html sitemap.xml
          git diff --cached --check
          git commit -m "Add concrete first-salary beginner path"
          git pull --rebase origin main
          git push
