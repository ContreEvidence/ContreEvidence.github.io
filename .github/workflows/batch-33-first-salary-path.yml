<header id="site-header"><div class="ce-fallback-header"><a class="ce-fallback-brand" href="../index.html">CONTRE-ÉVIDENCE</a><nav><a href="../themes/argent.html">Patrimoine</a><a href="../parcours-vie-professionnelle.html">Vie professionnelle</a><a href="../hors-cadre.html">Fenêtres</a><a href="../bibliotheque.html?type=outil">Outils</a><a href="../bibliotheque.html">Bibliothèque</a><a href="../mon-espace.html">Mon espace</a></nav></div></header>
<main id="contenu">
<section class="article-hero"><div class="container"><div class="voice-signature">Le risque à 18 ans n’est pas de ne pas optimiser chaque euro. C’est de laisser passer deux années presque sans charges sans avoir construit ni autonomie, ni compétence, ni capital.</div><div class="kicker">Patrimoine · Premier salaire · 18–25 ans</div><h1>Vous touchez votre premier salaire et vivez encore chez vos parents : qu’est-ce que vous faites de l’argent ?</h1><p>Vous n’avez peut-être ni loyer, ni courses, ni crédit. C’est une situation provisoire et très favorable. <strong>Le but n’est pas de tout investir ni de tout dépenser : c’est d’utiliser cette période pour acheter votre future autonomie sans renoncer à profiter de votre salaire.</strong></p><div class="ce-update-meta"><span>Créé le 16/08/2026 · Cas premier salaire, vie chez les parents, livrets, PEA et assurance-vie</span></div></div></section>
<article class="prose novice-prose">
<div class="answer-box"><h2>Si vous voulez juste savoir quoi faire dès le prochain salaire</h2><ol><li><strong>Décidez d’abord ce que vous gardez pour vivre et profiter du mois.</strong> Ne laissez pas « ce qui reste » décider à votre place.</li><li><strong>Virez le reste dès le lendemain de la paie sur un Livret A.</strong> Tant que permis, voiture, études, ordinateur, déménagement et premier logement ne sont pas chiffrés, cet argent doit rester disponible.</li><li><strong>Construisez d’abord 1 000 € de coussin, puis un fonds d’autonomie de plusieurs milliers d’euros.</strong></li><li><strong>Ensuite seulement, commencez le long terme.</strong> PEA jeune si vous êtes encore rattaché fiscalement à vos parents, PEA classique si vous avez votre propre foyer fiscal.</li><li><strong>L’assurance-vie est facultative à ce stade.</strong> Une bonne assurance-vie peut être ouverte avec peu pour commencer son ancienneté, mais vous n’avez aucune raison d’en collectionner plusieurs.</li></ol></div>

<h2>1. Exemple : 1 600 € net par mois, zéro loyer et presque aucune charge</h2>
<p>Voici un exemple volontairement simple et assez offensif en épargne. <strong>Ce n’est pas un pourcentage obligatoire.</strong> Il correspond à quelqu’un qui vit réellement chez ses parents sans participation importante au foyer.</p>
<div class="compare-wrap"><table class="compare-table"><thead><tr><th>Période</th><th>À dépenser librement</th><th>À garder liquide</th><th>À investir long terme</th></tr></thead><tbody><tr><td><strong>Mois 1 à 3</strong></td><td>350 €/mois</td><td><strong>1 250 €/mois sur Livret A</strong></td><td>0 €</td></tr><tr><td><strong>À partir du mois 4</strong><br>si les projets proches sont chiffrés</td><td>350 €/mois</td><td><strong>850 €/mois</strong> pour permis, voiture, logement, études, projets</td><td><strong>400 €/mois</strong> sur PEA/PEA jeune, si cet argent peut rester longtemps investi</td></tr></tbody></table></div>
<div class="case-study"><h3>Ce que cela donne après un an</h3><p>Sans compter intérêts ni rendement : <strong>11 400 € encore disponibles</strong>, <strong>3 600 € investis à long terme</strong> et <strong>4 200 € dépensés librement</strong>. Vous avez profité de votre première année de salaire tout en transformant une période sans loyer en avance réelle pour la suite.</p></div>
<p>Vous avez besoin d’une voiture dans six mois, d’un dépôt de garantie ou d’un déménagement ? <strong>Réduisez ou supprimez temporairement les 400 € investis et gardez-les liquides.</strong> Vous n’avez aucun gros projet avant cinq à dix ans et votre emploi est stable ? La part long terme peut au contraire augmenter progressivement.</p>

<h2>2. Avant d’ouvrir un placement, répondez à cinq questions</h2>
<div class="compare-wrap"><table class="compare-table"><thead><tr><th>Question</th><th>Pourquoi elle change la répartition</th></tr></thead><tbody><tr><td>Mes parents me demandent-ils une participation mensuelle ?</td><td>C’est une vraie charge : retirez-la avant de répartir le reste.</td></tr><tr><td>Permis, véhicule ou transports vont-ils coûter cher dans les 24 mois ?</td><td>Cet argent ne doit pas dépendre de la Bourse.</td></tr><tr><td>Études, formation, ordinateur ou matériel peuvent-ils améliorer mon revenu futur ?</td><td>À 18 ans, quelques milliers d’euros bien placés dans votre mobilité ou vos compétences peuvent compter davantage qu’une optimisation financière.</td></tr><tr><td>Est-ce que je pense quitter le domicile familial dans moins de deux ans ?</td><td>Il faudra dépôt, premier loyer, meubles, assurance, abonnements et marge de sécurité.</td></tr><tr><td>Mon revenu est-il stable ou provisoire ?</td><td>Un CDD, une alternance ou un premier emploi incertain justifie davantage de liquidité.</td></tr></tbody></table></div>

<h2>3. Trois poches suffisent pour commencer</h2>
<div class="compare-wrap"><table class="compare-table"><thead><tr><th>Poche</th><th>Où ?</th><th>À quoi elle sert</th></tr></thead><tbody><tr><td><strong>1 · Le mois en cours</strong></td><td>Compte courant</td><td>Sorties, téléphone, vêtements, loisirs, participation familiale éventuelle. Fixez un montant plutôt que de dépenser jusqu’à la prochaine paie.</td></tr><tr><td><strong>2 · L’autonomie à 0–3 ans</strong></td><td>Livret A ; LEP seulement si vous avez votre propre imposition et remplissez les conditions</td><td>Permis, véhicule, formation, déménagement, dépôt de garantie, première installation et coussin de sécurité.</td></tr><tr><td><strong>3 · L’argent dont vous n’avez pas besoin avant longtemps</strong></td><td>PEA jeune si vous êtes rattaché fiscalement ; PEA classique sinon</td><td>Commencer à investir à long terme sans mélanger l’argent de votre future installation avec celui exposé aux marchés.</td></tr></tbody></table></div>
<div class="decision-box"><h3>Pourquoi pas quatre banques et six produits ?</h3><p>Parce qu’au début la priorité est de savoir <strong>ce que chaque euro doit faire</strong>. Une architecture simple que vous alimentez tous les mois vaut davantage qu’une collection de comptes ouverts « au cas où ».</p></div>

<h2>4. Le vrai deuxième objectif n’est pas « six mois de charges » quand vos charges sont proches de zéro</h2>
<p>Si vos parents paient actuellement logement et nourriture, six mois de vos dépenses actuelles peuvent représenter très peu et donner une fausse impression de sécurité. <strong>Estimez plutôt le coût de votre prochaine vie autonome.</strong></p>
<div class="case-study"><h3>Exemple de sortie du domicile</h3><p>Vous estimez qu’une fois installé, vos dépenses essentielles seront autour de 1 200 €/mois. Ajoutez le dépôt, le premier équipement et les frais de déménagement. Votre cible liquide peut alors devenir « coût d’installation + deux ou trois mois de vie autonome », et non « six mois de sorties quand je vis encore chez mes parents ».</p></div>

<h2>5. Où mettre le premier argent : l’ordre le plus simple</h2>
<ol><li><strong>Livret A :</strong> le premier outil par défaut pour l’argent qui doit rester disponible.</li><li><strong>LEP :</strong> à regarder seulement si vous n’êtes plus fiscalement rattaché et que vous respectez les conditions de revenu. Un majeur encore fiscalement à charge de ses parents ne peut pas en détenir.</li><li><strong>PEE de l’employeur :</strong> s’il existe avec abondement, regardez-le tôt : l’argent ajouté par l’employeur peut modifier l’ordre des priorités.</li><li><strong>PEA jeune / PEA :</strong> pour le capital réellement long terme et une exposition aux actions compatible avec votre risque.</li><li><strong>Assurance-vie :</strong> facultative. Une bonne assurance-vie peut avoir du sens pour prendre date ou diversifier plus tard ; une mauvaise ouverte seulement parce qu’un conseiller l’a proposée ne devient pas bonne parce que vous avez 18 ans.</li><li><strong>PER :</strong> ce n’est généralement pas la première enveloppe à ouvrir à 18 ans. L’argent est destiné à la retraite et la contrainte de liquidité doit avoir une vraie contrepartie fiscale ou employeur.</li></ol>
<p><a href="finances-enveloppes-fiscalite.html"><strong>→ Comprendre PEA, assurance-vie, CTO et PER sans jargon</strong></a></p>

<h2>6. À quel moment commencer réellement à investir ?</h2>
<p>Vous n’avez pas besoin d’attendre 10 000 €. Vous avez besoin que <strong>l’argent investi n’ait pas déjà un travail à accomplir dans les prochaines années.</strong></p>
<div class="compare-wrap"><table class="compare-table"><thead><tr><th>Situation</th><th>Réponse raisonnable</th></tr></thead><tbody><tr><td>0–1 000 € d’épargne totale</td><td>Restez principalement liquide. Apprenez, mais ne cherchez pas encore à maximiser le rendement.</td></tr><tr><td>1 000–5 000 € mais permis/voiture/déménagement proches</td><td>Gardez l’essentiel disponible ; un petit versement long terme peut servir à apprendre sans mettre le projet en danger.</td></tr><tr><td>Fonds d’autonomie déjà constitué + projets proches financés</td><td>Commencez une alimentation mensuelle du PEA/PEA jeune avec l’argent réellement long terme.</td></tr><tr><td>Pas de projet proche, emploi stable, forte capacité d’épargne</td><td>La part investie peut augmenter plus vite, à condition d’accepter les baisses de marché sans devoir vendre.</td></tr></tbody></table></div>
<p><a href="premier-investissement-comment-commencer.html">→ Premier investissement : comment commencer avec 100, 500 ou 1 000 €</a></p>

<h2>7. Assurance-vie : faut-il en ouvrir une à 18 ans ?</h2>
<p><strong>Possible, oui. Prioritaire, non.</strong> Si vous avez déjà une poche liquide solide et que vous trouvez un contrat peu chargé en frais avec une fonction claire, l’ouvrir avec une petite somme peut lancer son ancienneté. Mais ne détournez pas plusieurs milliers d’euros du permis ou du premier logement uniquement pour « prendre date ».</p>
<p>Et à ce stade, <strong>une seule bonne assurance-vie suffit largement</strong>. La deuxième ne devient pertinente que si elle apporte une vraie fonction différente : autre assureur, supports, bénéficiaires ou usage.</p>

<h2>8. Ce que cette période sans charges peut financer de plus rentable qu’un placement</h2>
<ul><li>un permis ou une mobilité qui élargit réellement la zone d’emploi ;</li><li>une formation courte et vérifiable qui augmente les postes accessibles ;</li><li>un ordinateur ou du matériel qui permet de travailler ou d’apprendre ;</li><li>un déménagement vers un bassin d’emploi plus favorable ;</li><li>quelques mois de marge pour refuser un mauvais poste ou chercher mieux.</li></ul>
<div class="decision-box"><h3>À 18 ans, votre capital professionnel compte aussi.</h3><p>Le bon arbitrage n’est pas toujours « livret ou ETF ». Il peut être <strong>1 500 € investis en Bourse ou 1 500 € qui vous permettent d’obtenir un permis, une compétence ou une mobilité qui augmente durablement votre revenu.</strong></p></div>

<h2>9. Les erreurs les plus coûteuses au premier salaire</h2>
<ul><li><strong>Laisser tout sur le compte courant :</strong> l’argent disponible devient progressivement le niveau de vie normal.</li><li><strong>Prendre immédiatement un crédit auto important :</strong> vous transformez votre première liberté financière en charge fixe.</li><li><strong>Investir l’argent du permis ou du premier appartement :</strong> une baisse de marché peut arriver exactement au mauvais moment.</li><li><strong>Mettre 100 % en Bourse ou crypto parce que « j’ai le temps » :</strong> l’horizon long ne supprime ni les projets proches ni le risque de comportement.</li><li><strong>Ouvrir plusieurs assurances-vie, PER ou produits structurés sans comprendre leur rôle.</strong></li><li><strong>Ne rien dépenser par peur de mal faire :</strong> un plan durable doit aussi prévoir de profiter du revenu gagné.</li></ul>

<h2>10. Votre règle mensuelle peut tenir sur une ligne</h2>
<div class="decision-box"><h3>Paie → virement automatique → reste à vivre</h3><p>Le lendemain du salaire, virez automatiquement la somme décidée vers le fonds d’autonomie et, lorsque le socle est prêt, vers le long terme. <strong>Ce que vous laissez sur le compte courant devient votre budget de liberté du mois.</strong> Vous n’avez plus à décider vingt fois si chaque achat est « raisonnable ».</p></div>
<p>La répartition changera quand vous participerez au loyer, prendrez une voiture, reprendrez des études ou quitterez le domicile familial. À ce moment-là, <a href="seuils-maturite-patrimoniale.html"><strong>recalculez votre niveau de sécurité et votre capital réellement investissable →</strong></a></p>

<h2>Sources utiles pour les règles françaises</h2>
<ul class="source-list"><li><a href="https://www.service-public.fr/particuliers/vosdroits/F2367" rel="noopener noreferrer">Service-Public — LEP et rattachement fiscal</a></li><li><a href="https://www.economie.gouv.fr/particuliers/gerer-mon-argent/gerer-mon-budget-et-mon-epargne/quest-ce-que-le-plan-depargne-en-actions-pea" rel="noopener noreferrer">Bercy — PEA et PEA jeune</a></li><li><a href="https://www.service-public.fr/particuliers/vosdroits/F22414" rel="noopener noreferrer">Service-Public — assurance-vie</a></li><li><a href="https://www.economie.gouv.fr/particuliers/impots-et-fiscalite/gerer-mon-impot-sur-le-revenu/premiere-declaration-de-revenus-mode-demploi" rel="noopener noreferrer">Bercy — première déclaration et rattachement fiscal</a></li></ul>
