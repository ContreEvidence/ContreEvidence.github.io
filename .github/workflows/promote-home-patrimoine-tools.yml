name: Promote homepage Patrimoine tools

on:
  push:
    branches: [main]
    paths:
      - 'scripts/promote-home-patrimoine-tools.py'
      - '.github/workflows/promote-home-patrimoine-tools.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Promote calculators
        run: python scripts/promote-home-patrimoine-tools.py
      - name: Commit promoted tools
        run: |
          if git diff --quiet -- simulateur-prix-attendre.html simulateur-acheter-ou-louer.html; then
            echo 'Tools already promoted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulateur-prix-attendre.html simulateur-acheter-ou-louer.html
          git commit -m 'Indexer les deux simulateurs Patrimoine de l’accueil'
          git pull --rebase origin main
          git push
