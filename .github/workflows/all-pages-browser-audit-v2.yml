name: All pages browser audit v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/all-pages-browser-audit-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --no-save puppeteer-core@24
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ce-http.log 2>&1 &
          sleep 1
      - name: Render every published page
        run: |
          cat > audit-pages.mjs <<'JS'
          import fs from 'fs'; import path from 'path'; import puppeteer from 'puppeteer-core';
          const root=process.cwd();
          const excluded=new Set(['.git','.github','scripts','editorial','publication','publications','node_modules','_site']);
          function walk(d,o=[]){for(const n of fs.readdirSync(d)){if(excluded.has(n))continue;const p=path.join(d,n),s=fs.statSync(p);if(s.isDirectory())walk(p,o);else if(n.endsWith('.html'))o.push(path.relative(root,p).replaceAll('\\','/'));}return o;}
          const pages=walk(root).sort();
          const bins=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'];
          const executablePath=bins.find(fs.existsSync); if(!executablePath)throw new Error('Chrome not found');
          const browser=await puppeteer.launch({executablePath,headless:'new',args:['--no-sandbox','--disable-dev-shm-usage']});
          const vps=[['desktop',1440,900],['mobile',390,844]], failures=[]; let renders=0;
          for(const rel of pages){for(const [name,width,height] of vps){
            const p=await browser.newPage(); await p.setViewport({width,height});
            await p.setRequestInterception(true); p.on('request',r=>{const u=r.url(); if(u.startsWith('http://127.0.0.1:4173/')||u.startsWith('data:')||u.startsWith('blob:'))r.continue(); else r.abort();});
            const js=[],bad=[]; p.on('pageerror',e=>js.push(String(e.message||e))); p.on('response',r=>{if(r.url().startsWith('http://127.0.0.1:4173/')&&r.status()>=400)bad.push(`${r.status()} ${r.url()}`)});
            const url='http://127.0.0.1:4173/'+rel.split('/').map(encodeURIComponent).join('/'); let nav='';
            try{await p.goto(url,{waitUntil:'domcontentloaded',timeout:8000});await new Promise(r=>setTimeout(r,220));}catch(e){nav=String(e.message||e)}
            const m=await p.evaluate(()=>{const vis=e=>{if(!e)return false;const c=getComputedStyle(e),r=e.getBoundingClientRect();return c.display!=='none'&&c.visibility!=='hidden'&&r.width>5&&r.height>5};const badTables=[];document.querySelectorAll('table').forEach((t,i)=>{const r=t.getBoundingClientRect();if(r.right<=innerWidth+2&&r.left>=-2)return;let a=t.parentElement,ok=false;while(a&&a!==document.body){const c=getComputedStyle(a);if(['auto','scroll'].includes(c.overflowX)&&a.scrollWidth>a.clientWidth+2){ok=true;break}a=a.parentElement}if(!ok)badTables.push(i+1)});return{text:(document.body?.innerText||'').trim().length,overflow:Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth),header:vis(document.querySelector('#site-header, header')),main:vis(document.querySelector('main')),badTables};});
            const why=[]; if(nav)why.push('navigation-error'); if(bad.length)why.push('local-http:'+bad.join('|')); if(js.length)why.push('js:'+ [...new Set(js)].join('|')); if(m.overflow>3)why.push(`horizontal-overflow:${m.overflow}px`); if(m.badTables.length)why.push('uncontained-table:'+m.badTables.join(',')); if(!m.header&&rel!=='404.html')why.push('header-not-visible'); if(!m.main&&rel!=='404.html')why.push('main-not-visible'); if(m.text<80&&!['merci.html','404.html'].includes(rel))why.push('very-low-text:'+m.text); if(why.length)failures.push({rel,viewport:name,reasons:why});renders++;await p.close();
          }}
          await browser.close(); const grouped=new Map();for(const f of failures){if(!grouped.has(f.rel))grouped.set(f.rel,[]);grouped.get(f.rel).push(`${f.viewport}: ${f.reasons.join('; ')}`)}
          console.log(`PUBLISHED_HTML=${pages.length}\nRENDERS=${renders}\nPAGES_WITH_FINDINGS=${grouped.size}\nRENDER_CASES_WITH_FINDINGS=${failures.length}`);for(const [r,x]of grouped){console.log(`\n## ${r}`);x.forEach(v=>console.log(v))}fs.writeFileSync('/tmp/browser-audit.json',JSON.stringify({pages:pages.length,renders,failures},null,2));
          JS
          node audit-pages.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-pages-browser-audit-v2
          path: /tmp/browser-audit.json
          if-no-files-found: warn
          retention-days: 7
