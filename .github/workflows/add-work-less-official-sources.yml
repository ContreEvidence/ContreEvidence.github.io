name: Add official sources to work-less dossier

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add-work-less-official-sources.py'
      - '.github/workflows/add-work-less-official-sources.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Add official reference block
        run: python scripts/add-work-less-official-sources.py
      - name: Commit dossier update
        run: |
          if git diff --quiet -- dossiers/travailler-moins-vivre-mieux.html; then
            echo 'Dossier already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dossiers/travailler-moins-vivre-mieux.html
          git commit -m 'Ajouter les repères officiels au dossier travailler moins'
          git pull --rebase origin main
          git push
