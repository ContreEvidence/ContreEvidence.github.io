name: Batch 30 source links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Add official sources to life-stage financial tools
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dossiers/patrimoine-selon-age-construire-utiliser.html')
          text = p.read_text(encoding='utf-8')
          anchor = '<p><a href="finances-enveloppes-fiscalite.html"><strong>→ Comparer en détail PEA, assurance-vie, CTO et PER</strong></a> · <a href="premier-investissement-comment-commencer.html"><strong>Premier investissement : passer de la réserve au marché →</strong></a></p>'
          source = '<p class="source-note">Repères réglementaires : <a href="https://www.service-public.fr/particuliers/vosdroits/F34913" rel="noopener noreferrer">Service-Public — fiscalité des livrets réglementés</a> · <a href="https://www.economie.gouv.fr/particuliers/gerer-mon-argent/gerer-mon-budget-et-mon-epargne/quest-ce-que-le-plan-depargne-en-actions-pea" rel="noopener noreferrer">Bercy — PEA et date du premier versement</a> · <a href="https://www.service-public.fr/particuliers/vosdroits/F22414" rel="noopener noreferrer">Service-Public — assurance-vie</a> · <a href="https://www.service-public.fr/particuliers/vosdroits/F36526" rel="noopener noreferrer">Service-Public — PER individuel</a>.</p>'
          assert text.count(anchor) == 1, text.count(anchor)
          assert 'Repères réglementaires :' not in text
          text = text.replace(anchor, source + anchor, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit source links
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dossiers/patrimoine-selon-age-construire-utiliser.html
          git diff --cached --check
          git commit -m "Source life-stage financial tool guidance"
          git push
