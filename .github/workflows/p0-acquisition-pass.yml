name: P0 acquisition promise review

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/p0-acquisition-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p0-acquisition-pass
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply reviewed P0 pass
        run: python .github/scripts/p0_acquisition_pass.py
      - name: Validate and commit to review branch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/audience-variant-coverage.yml reports/audience-variant-coverage.md \
            dossiers/acheter-logement-sans-se-fragiliser.html \
            dossiers/acheter-sans-vider-epargne.html \
            dossiers/puis-je-me-permettre-reconversion.html \
            dossiers/comparer-strategies-immobilieres.html
          git diff --cached --check
          git commit -m "Refine acquisition promises and routing"
          git push origin HEAD:${{ github.head_ref }}
