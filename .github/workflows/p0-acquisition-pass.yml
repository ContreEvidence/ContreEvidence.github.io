name: P0 acquisition promise review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p0-acquisition-pass.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p0-acquisition-pass
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine promises, routing and audit semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {n}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 1) The audit must recognise pages whose visible promise is intentionally narrow.
          audit = '.github/workflows/audience-variant-coverage.yml'
          replace_once(
              audit,
              "'n':[r'sans perte de salaire',r'après interruption',r'sans diplôme',r'avant.*crédit immobilier'],",
              "'n':[r'sans perte de salaire',r'après interruption',r'sans diplôme',r'avant.*crédit immobilier',r'métier.*poste.*fonction',r'compétences? transférables?',r'quitter.*\\bcdi\\b'],"
          )
          replace_once(
              audit,
              "'b':[r'créer.*entreprise',r'lancer.*activité',r'entreprendre',r'vivre de son activité',r'choisir.*statut'],",
              "'b':[r'créer.*entreprise',r'lancer.*activité',r'entreprendre',r'vivre de son activité',r'choisir.{0,60}(?:statut|structure)'],"
          )
          replace_once(
              audit,
              "'n':[r'micro.*ei.*eurl.*sasu',r'sans diplôme',r'sans quitter.*emploi'],",
              "'n':[r'micro.*ei.*eurl.*sasu',r'sans diplôme',r'sans quitter.*emploi',r'\\bare\\b.*\\barce\\b.*\\bacre\\b'],"
          )
          replace_once(
              audit,
              "'n':[r'audit.*60',r'surendettement'],",
              "'n':[r'audit.*60',r'surendettement',r'construire.*épargne',r'créer.*entreprise.*peu d.argent'],"
          )
          replace_once(
              audit,
              "'v':{'déficit temporaire / structurel':[r'temporaire',r'structurel'],",
              "'v':{'déficit temporaire / structurel':[r'temporaire',r'structurel',r'déficit permanent',r'transition.*bornée'],"
          )

          # 2) Broad 'buying together' promises should route immediately to ownership/exit architecture.
          path = 'dossiers/acheter-logement-sans-se-fragiliser.html'
          old = '<p><a href="acheter-sans-vider-epargne.html"><strong>→ Réserve commune, réserves personnelles et apports à deux</strong></a></p><h2>9. Stress test : calibre le choc au foyer</h2>'
          new = '''<p><a href="acheter-sans-vider-epargne.html"><strong>→ Réserve commune, réserves personnelles et apports à deux</strong></a></p><div class="decision-box"><h3>Achat à deux : séparez le financement de la propriété</h3><p>Cette page mesure la robustesse financière de l’achat. Si vous achetez à deux, il faut aussi traiter séparément <strong>qui possède quoi et comment chacun peut sortir</strong>. Mariage, PACS ou concubinage ne se lisent pas de la même façon qu’une simple répartition des mensualités ; l’indivision directe et la SCI sont deux architectures à examiner avant de signer.</p><p><a href="indivision-couple-separation-rachat-soulte.html"><strong>→ Achat à deux : indivision, apports, séparation et rachat</strong></a> · <a href="sci-immobiliere-acheter-gerer-transmettre-sortir.html"><strong>→ SCI : acheter, gérer, transmettre et sortir</strong></a></p></div><h2>9. Stress test : calibre le choc au foyer</h2>'''
          replace_once(path, old, new)

          path = 'dossiers/acheter-sans-vider-epargne.html'
          old = '<p>Si les apports et droits de propriété sont inégaux, le traitement juridique doit être documenté dans l’acte et les conventions appropriées : ne laissez pas la comptabilité future dépendre d’un souvenir oral.</p><h2>6. CDD ou revenu temporaire : ne transformez pas l’incertitude en interdiction automatique</h2>'
          new = '''<p>Si les apports et droits de propriété sont inégaux, le traitement juridique doit être documenté dans l’acte et les conventions appropriées : ne laissez pas la comptabilité future dépendre d’un souvenir oral.</p><div class="decision-box"><h3>Le montant à garder et la structure de propriété sont deux décisions différentes</h3><p>Pour un achat à deux, cette page répond à la première : <strong>combien de marge financière conserver ?</strong> La seconde demande de regarder l’acte et le cadre choisi : mariage, PACS ou concubinage, indivision directe ou SCI. Ne déduisez pas les droits de propriété de la seule contribution mensuelle au crédit.</p><p><a href="indivision-couple-separation-rachat-soulte.html"><strong>→ Indivision : apports, propriété, comptes et sortie</strong></a> · <a href="sci-immobiliere-acheter-gerer-transmettre-sortir.html"><strong>→ SCI : ce qu’elle change réellement</strong></a></p></div><h2>6. CDD ou revenu temporaire : ne transformez pas l’incertitude en interdiction automatique</h2>'''
          replace_once(path, old, new)

          # 3) 'Can I afford a reconversion?' needs a financial precondition, not more generic content.
          path = 'dossiers/puis-je-me-permettre-reconversion.html'
          anchor = '<h2>1. Voulez-vous vraiment changer de métier ?</h2>'
          insertion = '''<div class="warning-box"><strong>Garde-fou financier : distinguez transition et fragilité déjà installée.</strong> Un <strong>déficit temporaire</strong> créé par une reconversion peut être rationnel s’il est borné, financé et associé à une sortie crédible. Un <strong>déficit structurel</strong> déjà présent avant le projet est différent : la réserve de reconversion ne doit pas simplement retarder le moment où le budget casse. Même logique si une dette coûteuse ou une situation de surendettement absorbe déjà la marge : stabilisez d’abord le socle ou privilégiez une voie qui maintient davantage de revenu. <a href="finances-difficiles-sortir-decouvert-dettes.html"><strong>→ Stabiliser budget, découvert et dettes avant de consommer le capital de transition</strong></a></div>'''
          replace_once(path, anchor, insertion + anchor)

          # 4) The strategy map should expose the ownership layer without turning into a SCI treatise.
          path = 'dossiers/comparer-strategies-immobilieres.html'
          old = '<p>Cette page ne remplace pas les dossiers spécialisés : elle sert à choisir <strong>quelle comparaison détaillée mérite d’être faite</strong>.</p>'
          new = '''<p><strong>Le mode de détention est une couche distincte du mode d’exploitation.</strong> Détenir un bien en direct ou via une <strong>SCI</strong> peut modifier la façon de gérer, financer, transmettre ou sortir ; ce choix ne se déduit donc pas du seul rendement locatif. <a href="sci-immobiliere-acheter-gerer-transmettre-sortir.html"><strong>→ SCI : vérifier si cette architecture répond réellement au besoin</strong></a></p><p>Cette page ne remplace pas les dossiers spécialisés : elle sert à choisir <strong>quelle comparaison détaillée mérite d’être faite</strong>.</p>'''
          replace_once(path, old, new)

          # Update modification dates only on pages materially edited in this pass.
          for fp in [
              'dossiers/acheter-logement-sans-se-fragiliser.html',
              'dossiers/acheter-sans-vider-epargne.html',
              'dossiers/puis-je-me-permettre-reconversion.html',
              'dossiers/comparer-strategies-immobilieres.html',
          ]:
              p = Path(fp)
              s = p.read_text(encoding='utf-8')
              s = s.replace('2026-08-17', '2026-08-18')
              if fp in ('dossiers/acheter-sans-vider-epargne.html','dossiers/puis-je-me-permettre-reconversion.html'):
                  s = s.replace('"dateModified":"2026-08-16"', '"dateModified":"2026-08-18"')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Regenerate acquisition coverage report with the revised audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          raw = Path('.github/workflows/audience-variant-coverage.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = raw.index(marker) + len(marker)
          end = raw.index("\n          PY", start)
          code = textwrap.dedent(raw[start:end])
          exec(compile(code, 'audience-variant-coverage-inline.py', 'exec'), {})
          PY

      - name: Validate scope and internal targets
        run: |
          python - <<'PY'
          from pathlib import Path
          allowed = {
              '.github/workflows/audience-variant-coverage.yml',
              'reports/audience-variant-coverage.md',
              'dossiers/acheter-logement-sans-se-fragiliser.html',
              'dossiers/acheter-sans-vider-epargne.html',
              'dossiers/puis-je-me-permettre-reconversion.html',
              'dossiers/comparer-strategies-immobilieres.html',
          }
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          extra = changed - allowed
          if extra:
              raise SystemExit(f'Unexpected changed paths: {sorted(extra)}')
          required = [
              'dossiers/indivision-couple-separation-rachat-soulte.html',
              'dossiers/sci-immobiliere-acheter-gerer-transmettre-sortir.html',
              'dossiers/finances-difficiles-sortir-decouvert-dettes.html',
          ]
          missing = [p for p in required if not Path(p).exists()]
          if missing:
              raise SystemExit(f'Missing internal targets: {missing}')
          report = Path('reports/audience-variant-coverage.md').read_text(encoding='utf-8')
          marker = 'Promesses larges à relire avant acquisition : **'
          pos = report.index(marker) + len(marker)
          print('Acquisition gate after human pass:', report[pos:report.index('**', pos)])
          PY
          git diff --check

      - name: Commit reviewed acquisition pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/audience-variant-coverage.yml reports/audience-variant-coverage.md \
            dossiers/acheter-logement-sans-se-fragiliser.html \
            dossiers/acheter-sans-vider-epargne.html \
            dossiers/puis-je-me-permettre-reconversion.html \
            dossiers/comparer-strategies-immobilieres.html
          git diff --cached --check
          git commit -m "Refine acquisition promises and routing"
          git push
