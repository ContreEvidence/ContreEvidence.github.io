name: Editorial standard migration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/editorial-standard-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Clean migration overlays and polish priority acquisition pages
        shell: python
        run: |
          from __future__ import annotations
          import pathlib
          import re
          import urllib.parse
          import xml.etree.ElementTree as ET

          root=pathlib.Path('.').resolve()
          prefix='https://contreevidence.github.io/'
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[n.text.strip() for n in ET.parse('sitemap.xml').findall('.//s:loc',ns) if n.text]
          rels=[]
          for url in urls:
              if not url.startswith(prefix): continue
              rel=urllib.parse.unquote(url[len(prefix):]) or 'index.html'
              if rel.startswith('dossiers/') or rel.startswith('articles/'):
                  rels.append(rel)

          priority={
            'dossiers/comparer-deux-offres-emploi.html':(
              'Ne comparez pas deux salaires : comparez deux vies possibles',
              [
                ('Argent réellement disponible','Salaire + variable − transport − repas − garde et autres coûts liés au poste.'),
                ('Temps réellement capturé','Contrat + trajet + disponibilité + récupération.'),
                ('Ce qui est vraiment garanti','Télétravail, horaires, charge, évolution : écrit, stable ou seulement promis ?'),
                ('Options dans 12–24 mois','Compétence, progression, réversibilité, capacité à changer à nouveau.')
              ],
              'La meilleure offre est celle dont l’ensemble reste supérieur même lorsque vous retirez les promesses fragiles.'),
            'dossiers/combien-epargne-avant-demissionner.html':(
              'Ne financez pas toute votre vie avec l’épargne : financez le déficit de transition',
              [
                ('Budget après départ','Ce qui doit réellement sortir chaque mois une fois le poste quitté.'),
                ('Revenus qui continuent','ARE éventuelle, activité, revenus du foyer ou autres flux réellement disponibles.'),
                ('Durée plausible','Le nombre de mois pendant lesquels le déficit doit être financé.'),
                ('Marge d’erreur','Ce qui protège contre une recherche plus longue ou une dépense imprévue.')
              ],
              'La réserve utile dépend du déficit mensuel à financer et de la durée du risque — pas d’un multiple universel de salaire.'),
            'dossiers/changer-travail-avant-credit-immobilier.html':(
              'Deux projets, un même point faible : perdre trop de marge au même moment',
              [
                ('Nouvel emploi','Stabilité réelle, période d’essai, revenu net et date de prise de poste.'),
                ('Projet immobilier','Apport, mensualité complète, frais et travaux prévisibles.'),
                ('Trésorerie après les deux','Ce qu’il reste si les deux décisions sont exécutées.'),
                ('Ordre des décisions','Celui qui préserve le plus d’options si l’un des projets dérape.')
              ],
              'Ne cherchez pas l’ordre « normal ». Cherchez l’ordre qui laisse le plus d’options si l’un des deux projets se passe moins bien que prévu.'),
            'dossiers/puis-je-me-permettre-reconversion.html':(
              'Une reconversion est d’abord un budget de transition',
              [
                ('Coût direct','Formation, déplacements, équipement et dépenses nouvelles réellement nécessaires.'),
                ('Revenu pendant la transition','Salaire maintenu, allocation, activité ou autre revenu réellement disponible.'),
                ('Durée avant revenu cible','Le temps pendant lequel le nouveau modèle reste moins rémunérateur.'),
                ('Retour possible','Ce qui permet de corriger le projet sans repartir de zéro.')
              ],
              'Le projet devient finançable quand la durée, le déficit et le scénario de repli sont explicites.'),
            'dossiers/acheter-sans-vider-epargne.html':(
              'L’apport maximal n’est pas l’apport raisonnable',
              [
                ('Sommes déjà promises','Frais, travaux, impôts et projets proches qui ont déjà une destination.'),
                ('Réserve de sécurité','Le cash qui doit survivre à la signature.'),
                ('Coût mensuel réel','Crédit + charges + taxe + entretien + coûts induits du logement.'),
                ('Apport disponible','Seulement ce qui reste après les trois filtres précédents.')
              ],
              'Un achat solide ne se juge pas à l’épargne utilisée le jour de la signature, mais à la marge qui reste le lendemain.'),
            'dossiers/reconversion-sans-perte-salaire.html':(
              'Cherchez d’abord les chemins qui déplacent le moins de risque vers votre budget',
              [
                ('Mobilité interne','Changer de fonction en gardant au maximum salaire, ancienneté et environnement connu.'),
                ('Compétence en parallèle','Construire la preuve avant de couper le revenu principal.'),
                ('Poste passerelle','Accepter un déplacement ciblé seulement s’il ouvre réellement la suite.'),
                ('Rupture complète','À réserver aux cas où les chemins moins coûteux ne produisent pas l’option recherchée.')
              ],
              '« Sans perte de salaire » n’est pas toujours possible. L’objectif est de minimiser la perte de revenu pour chaque unité de compétence ou d’option réellement gagnée.'),
            'dossiers/acheter-logement-sans-se-fragiliser.html':(
              'Le bon achat est celui que votre vie peut encore absorber après la signature',
              [
                ('Coût d’entrée','Apport, frais d’acquisition, déménagement et travaux immédiats.'),
                ('Coût mensuel complet','Crédit, charges, impôts, entretien et dépenses induites.'),
                ('Cash restant','La réserve et les projets proches qui restent réellement financés.'),
                ('Stress test','Ce qui se passe si revenu, taux d’effort ou dépenses se dégradent.')
              ],
              'Si le logement ne tient que dans le scénario parfait, le prix est probablement trop haut pour votre situation actuelle.'),
            'dossiers/accepter-emploi-plus-loin-cout-trajet.html':(
              'Une hausse de salaire peut être mangée par le trajet',
              [
                ('Gain net de salaire','Ce qui arrive réellement en plus sur le compte.'),
                ('Coût du déplacement','Carburant, péage, parking, usure ou abonnement supplémentaire.'),
                ('Temps capturé','Trajet aller-retour × jours travaillés, plus la récupération éventuelle.'),
                ('Fragilité','Ce que devient l’équation si télétravail, prix du carburant ou horaires changent.')
              ],
              'Le bon seuil n’est pas « combien paie le nouveau poste ? », mais « combien me reste-t-il pour chaque heure de vie supplémentaire qu’il consomme ? »')
          }

          def find_balanced_div_end(raw,start):
              token_re=re.compile(r'<div\b[^>]*>|</div\s*>',re.I)
              depth=0
              for t in token_re.finditer(raw,start):
                  if t.group(0).lower().startswith('<div'): depth+=1
                  else:
                      depth-=1
                      if depth==0: return t.end()
              return None

          def remove_class_div(raw,class_name):
              pat=re.compile(r'<div\b[^>]*class=(["\'])[^"\']*\b'+re.escape(class_name)+r'\b[^"\']*\1[^>]*>',re.I)
              while True:
                  m=pat.search(raw)
                  if not m: return raw
                  end=find_balanced_div_end(raw,m.start())
                  if end is None: return raw
                  raw=raw[:m.start()]+raw[end:]

          def find_answer_end(raw):
              m=re.search(r'<div\b[^>]*class=(["\'])[^"\']*\banswer-box\b[^"\']*\1[^>]*>',raw,re.I)
              if not m: return None
              return find_balanced_div_end(raw,m.start())

          def has_bespoke_visual(raw):
              stripped=remove_class_div(raw,'ce-legacy-route')
              stripped=remove_class_div(stripped,'ce-priority-visual')
              return bool(re.search(r'role=["\']img["\']|<figure\b',stripped,re.I))

          def priority_visual(title,steps,result):
              cards=''.join(f'<div class="ce-priority-step"><b>{a}</b><span>{b}</span></div>' for a,b in steps)
              return f'<div class="ce-priority-visual" role="img" aria-label="Résumé visuel de la décision"><h3>{title}</h3><div class="ce-priority-grid">{cards}</div><div class="ce-priority-result"><strong>À retenir :</strong> {result}</div></div>'

          def collapse_priority_tables(raw):
              pattern=re.compile(r'<div\b[^>]*class=(["\'])[^"\']*\bcompare-wrap\b[^"\']*\1[^>]*>\s*<table\b.*?</table>\s*</div>',re.I|re.S)
              matches=list(pattern.finditer(raw))
              if len(matches)<=2: return raw
              out=[]; last=0
              for idx,m in enumerate(matches,1):
                  out.append(raw[last:m.start()])
                  block=m.group(0)
                  if idx<=2:
                      out.append(block)
                  else:
                      before=raw[:m.start()]
                      inside=before.rfind('<details class="ce-legacy-detail">')>before.rfind('</details>')
                      if inside: out.append(block)
                      else: out.append('<details class="ce-legacy-detail"><summary>Voir le tableau détaillé</summary>'+block+'</details>')
                  last=m.end()
              out.append(raw[last:])
              return ''.join(out)

          def mark_v2(raw):
              m=re.search(r'<article\b([^>]*)>',raw,re.I)
              if not m: return raw
              attrs=m.group(1)
              if re.search(r'data-ce-editorial-standard=(["\']).*?\1',attrs,re.I):
                  attrs=re.sub(r'data-ce-editorial-standard=(["\']).*?\1','data-ce-editorial-standard="2026-08-17-v2"',attrs,flags=re.I)
              else: attrs+=' data-ce-editorial-standard="2026-08-17-v2"'
              return raw[:m.start()]+'<article'+attrs+'>'+raw[m.end():]

          def naturalize(raw):
              replacements=[
                (r'\binterlocuteurs qui décident\b','décideurs'),
                (r'\binterlocuteur qui décide\b','décideur'),
                (r'\ble interlocuteur\b','l’interlocuteur'),
                (r'\bGatekeepers\b','Décideurs'),(r'\bgatekeepers\b','décideurs'),
                (r'\bGatekeeper\b','Décideur'),(r'\bgatekeeper\b','décideur'),
                (r'\brunway\b','durée de sécurité'),
                (r'\bframework\b','cadre'),(r'\bscorecard\b','grille'),
                (r'\bflywheel\b','boucle de croissance'),
                (r'\bproof points?\b','preuves concrètes'),
                (r'\buse cases?\b','cas d’usage'),
                (r'\bred flags?\b','signaux d’alerte')]
              def repl(m):
                  text=m.group(1)
                  for pat,to in replacements: text=re.sub(pat,to,text,flags=re.I)
                  return '>'+text+'<'
              return re.sub(r'>([^<>]+)<',repl,raw)

          changed=[]
          priority_done=[]
          overlay_removed=[]
          for rel in rels:
              p=root/rel
              if not p.exists(): continue
              raw=p.read_text(encoding='utf-8',errors='replace')
              if re.search(r'<meta\s+name=["\']robots["\'][^>]*noindex',raw,re.I): continue
              original=raw
              raw=naturalize(raw)

              if rel in priority:
                  raw=remove_class_div(raw,'ce-legacy-route')
                  raw=remove_class_div(raw,'ce-priority-visual')
                  title,steps,result=priority[rel]
                  pos=find_answer_end(raw)
                  if pos is None:
                      am=re.search(r'<article\b[^>]*>',raw,re.I)
                      pos=am.end() if am else None
                  if pos is not None:
                      raw=raw[:pos]+priority_visual(title,steps,result)+raw[pos:]
                  raw=collapse_priority_tables(raw)
                  raw=mark_v2(raw)
                  priority_done.append(rel)
              elif 'ce-legacy-route' in raw and has_bespoke_visual(raw):
                  raw=remove_class_div(raw,'ce-legacy-route')
                  overlay_removed.append(rel)

              if raw!=original:
                  p.write_text(raw,encoding='utf-8')
                  changed.append(rel)

          print(f'Pages modifiées: {len(changed)}')
          print(f'Portes acquisition polies: {len(priority_done)}')
          for r in priority_done: print('PRIORITY',r)
          print(f'Parcours génériques retirés devant un visuel sur mesure: {len(overlay_removed)}')
          for r in overlay_removed: print('CLEAN',r)

      - name: Validate diff
        run: |
          git diff --check
          python3 - <<'PY'
          import pathlib,re,sys
          bad=[]
          for p in list(pathlib.Path('dossiers').glob('*.html'))+list(pathlib.Path('articles').glob('*.html')):
              s=p.read_text(encoding='utf-8',errors='replace')
              if 'ce-priority-visual' in s and 'editorial-standard.css' not in s:
                  bad.append(f'{p}: priority visual without stylesheet')
              if re.search(r'\b(?:gatekeeper|runway|framework|scorecard|flywheel|proof point|red flag)\b',re.sub(r'<[^>]+>',' ',s),re.I):
                  bad.append(f'{p}: jargon remains')
          if bad:
              print(*bad,sep='\n')
              sys.exit(1)
          PY
      - name: Commit migration
        run: |
          if git diff --quiet -- dossiers articles; then
            echo "No cleanup required."
            exit 0
          fi
          git config user.name "ContreEvidence"
          git config user.email "contreevidence@gmail.com"
          git add dossiers articles
          git commit -m "Polish priority acquisition pages and clean legacy overlays"
          git push
