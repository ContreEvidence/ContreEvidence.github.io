name: Batch 40 acquisition first

on:
  push:
    paths:
      - 'scripts/batch40_acquisition_first.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply acquisition-first rewrite
        run: python scripts/batch40_acquisition_first.py
      - name: Commit batch 40
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dossiers reports
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Make inflation dossier acquisition-first"
          git pull --rebase origin main
          git push origin main
