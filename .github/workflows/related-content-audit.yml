name: Related content audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/related-content-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare generated primary recommendations with catalog domains and categories
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const vm = require('vm');
          const ctx={window:{}}; vm.createContext(ctx);
          for(const rel of ['assets/library-catalog.js','assets/library-daily-money.js','assets/library-work-foundations.js']){
            if(fs.existsSync(rel)) vm.runInContext(fs.readFileSync(rel,'utf8'),ctx,{filename:rel});
          }
          const items=(ctx.window.CE_LIBRARY_CATALOG||[]).filter(x=>x?.h&&x?.n);
          const byHref=new Map(items.map(x=>[x.h,x]));
          const normalize=(from,href)=>path.posix.normalize(path.posix.join(path.posix.dirname(from),href));
          const primaryRe=/<a class="ce-related-primary" href="([^"]+)"/i;
          let total=0,crossDomain=[],sameDomainDiffCategory=[],missing=[];
          const domains=x=>new Set(String(x?.d||'').split(/\s+/).filter(Boolean));
          const sameDomain=(a,b)=>[...domains(a)].some(d=>domains(b).has(d));
          for(const item of items){
            if(!fs.existsSync(item.h)) continue;
            const html=fs.readFileSync(item.h,'utf8');
            const m=primaryRe.exec(html); if(!m) continue;
            total++;
            const targetHref=normalize(item.h,m[1].split('#')[0].split('?')[0]);
            const target=byHref.get(targetHref);
            if(!target){ missing.push([item.h,targetHref]); continue; }
            if(!sameDomain(item,target)) crossDomain.push([item.h,item.n,target.h,target.n,item.d,target.d]);
            else if(item.c && target.c && item.c!==target.c) sameDomainDiffCategory.push([item.h,item.n,item.c,target.h,target.n,target.c]);
          }
          console.log('Primary related links:',total);
          console.log('Cross-domain primary links:',crossDomain.length);
          for(const x of crossDomain) console.log('CROSS | '+x.join(' | '));
          console.log('Same-domain but different-category primary links:',sameDomainDiffCategory.length);
          for(const x of sameDomainDiffCategory) console.log('DIFFCAT | '+x.join(' | '));
          console.log('Targets missing from catalog:',missing.length);
          for(const x of missing) console.log('MISSING | '+x.join(' | '));
          NODE
