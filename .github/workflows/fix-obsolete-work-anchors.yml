name: Fix obsolete work anchors

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-obsolete-work-anchors.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Remove obsolete formation and salariat fragments
        shell: python
        run: |
          from pathlib import Path
          targets = [
              Path('videos.html'),
              Path('simulateur-cout-formation.html'),
              Path('articles/expliquer-parcours-accidente.html'),
              Path('articles/portes-fermees.html'),
              Path('articles/repartir-sans-recommencer-zero.html'),
              Path('articles/tester-metier-avant-investir.html'),
              Path('dossiers/formation-vaut-elle-le-cout.html'),
          ]
          changed=[]
          for p in targets:
              text=p.read_text(encoding='utf-8')
              new=text.replace('parcours-vie-professionnelle.html#formation','parcours-vie-professionnelle.html')
              new=new.replace('parcours-vie-professionnelle.html#salariat','parcours-vie-professionnelle.html')
              if new!=text:
                  p.write_text(new,encoding='utf-8'); changed.append(str(p))
          print('Changed:', ', '.join(changed) if changed else 'none')
      - name: Commit anchor fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add videos.html simulateur-cout-formation.html articles dossiers
          git commit -m 'Corriger les anciennes ancres Vie professionnelle'
          git pull --rebase origin main
          git push
