name: Relative framing audit

on:
  push:
    paths:
      - 'scripts/audit_relative_framing.py'
      - '.github/workflows/relative-framing-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit relative framing
        run: python scripts/audit_relative_framing.py | tee relative-framing-report.txt
      - name: Add report to summary
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat relative-framing-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
