name: Feature acquisition tools in hubs

on:
  push:
    branches: [main]
    paths:
      - 'scripts/feature-acquisition-tools-in-hubs.py'
      - '.github/workflows/feature-acquisition-tools-in-hubs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Feature selected tools
        run: python scripts/feature-acquisition-tools-in-hubs.py
      - name: Commit hub changes
        run: |
          if git diff --quiet -- themes/entreprendre.html themes/travail.html; then
            echo 'Hub tool links already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add themes/entreprendre.html themes/travail.html
          git commit -m 'Mettre en avant les outils utiles dans les hubs'
          git pull --rebase origin main
          git push
