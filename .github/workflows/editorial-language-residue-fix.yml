name: Fix editorial migration language residues

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/editorial-language-residue-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fix grammar and metadata residues
        shell: python
        run: |
          from pathlib import Path
          import re

          files=list(Path('dossiers').glob('*.html'))+list(Path('articles').glob('*.html'))
          changed=[]

          # Ordered replacements: specific expressions first, then safe generic grammatical corrections.
          literal=[
            ('AI Risk Management cadre','AI Risk Management Framework'),
            ('gatekeepers de facturation et paiement','points de blocage de facturation et de paiement'),
            ('gatekeepers du prix','contraintes qui verrouillent le prix'),
            ('chaque gatekeeper juridique, fiscal et économique','chaque condition juridique, fiscale et économique'),
            ('certification et gatekeeper','certification et condition d’accès'),
            ('preuve et gatekeeper','preuve et décideur'),
            ('gatekeeper du métier','condition d’accès au métier'),
            ('gatekeeper réel','étape réellement bloquante'),
            ('gatekeepers et interfaces','décideurs et interfaces'),
            ('immersion, gatekeepers, contraintes','immersion, conditions d’accès, contraintes'),
            ('Gatekeepers, canaux','Décideurs, canaux'),
            ('gatekeepers, hypothèses','décideurs, hypothèses'),
            ('durée de sécurité patrimonial','durée de sécurité patrimoniale'),
            ('durée de sécurité court','durée de sécurité courte'),
            ('durée de sécurité long','durée de sécurité longue'),
            ('la durée de sécurité brut','la durée de sécurité brute'),
            ('La durée de sécurité brut','La durée de sécurité brute'),
            ('la durée de sécurité immédiat','la durée de sécurité immédiate'),
            ('La durée de sécurité immédiat','La durée de sécurité immédiate'),
            ('la durée de sécurité trop court','la durée de sécurité trop courte'),
            ('La durée de sécurité trop court','La durée de sécurité trop courte'),
            ('La durée de sécurité doit être calculé','La durée de sécurité doit être calculée'),
            ('le durée de sécurité','la durée de sécurité'),
            ('Le durée de sécurité','La durée de sécurité'),
            ('un durée de sécurité','une durée de sécurité'),
            ('Un durée de sécurité','Une durée de sécurité'),
            ('du durée de sécurité','de la durée de sécurité'),
            ('Du durée de sécurité','De la durée de sécurité'),
          ]

          for p in files:
            s=p.read_text(encoding='utf-8',errors='replace')
            original=s
            for old,new in literal:
              s=s.replace(old,new)
            # Remaining English shorthand from the migration should be expressed in French,
            # except official proper names such as NIST AI Risk Management Framework.
            s=re.sub(r'\brunway\b','durée de sécurité',s,flags=re.I)
            s=re.sub(r'\bgatekeepers\b','décideurs',s,flags=re.I)
            s=re.sub(r'\bgatekeeper\b','décideur',s,flags=re.I)
            if p.as_posix()=='dossiers/seuils-maturite-patrimoniale.html':
              s=s.replace('"dateModified":"2026-08-16"','"dateModified":"2026-08-17"')
            if s!=original:
              p.write_text(s,encoding='utf-8')
              changed.append(p.as_posix())

          print('Pages modifiées:',len(changed))
          for x in changed: print('UPDATED',x)

      - name: Validate residues are gone
        shell: python
        run: |
          from pathlib import Path
          import re, sys
          pats={
            'article_duration': re.compile(r'\b(?:le|un|du) durée de sécurité\b',re.I),
            'bad_agreement': re.compile(r'\bdurée de sécurité (?:patrimonial|court|long|brut|immédiat)\b',re.I),
            'legacy_gatekeeper': re.compile(r'\bgatekeepers?\b',re.I),
            'legacy_runway': re.compile(r'\brunway\b',re.I),
            'bad_nist_translation': re.compile(r'AI Risk Management cadre',re.I),
          }
          bad=[]
          for p in list(Path('dossiers').glob('*.html'))+list(Path('articles').glob('*.html')):
            s=p.read_text(encoding='utf-8',errors='replace')
            for name,pat in pats.items():
              if pat.search(s): bad.append((name,p.as_posix()))
          if bad:
            for name,p in bad: print('RESIDUE',name,p)
            sys.exit(1)
          print('No targeted migration language residue remains.')
      - name: Commit
        run: |
          git diff --check
          git config user.name "ContreEvidence"
          git config user.email "contreevidence@gmail.com"
          git add dossiers articles
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Clean editorial migration language residues"
          git push
