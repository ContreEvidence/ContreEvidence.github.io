name: Update sitemap

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '.github/workflows/update-sitemap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate sitemaps and static crawl hub
        shell: python
        run: |
          from pathlib import Path
          from datetime import datetime, timezone
          from xml.sax.saxutils import escape
          from html import escape as hescape
          import re
          import subprocess

          root = Path('.')
          base = 'https://contreevidence.github.io/'
          excluded_names = {'404.html', 'plan-du-site.html'}
          excluded_dirs = {'node_modules', 'vendor', 'dist', 'build', 'coverage'}

          pages = []
          for path in sorted(root.rglob('*.html')):
              rel = path.as_posix()
              if any(part.startswith('.') for part in path.parts):
                  continue
              if any(part in excluded_dirs for part in path.parts):
                  continue
              if path.name in excluded_names:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              if re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\'][^"\']*noindex', text, re.I):
                  continue
              if re.search(r'<meta[^>]+content=["\'][^"\']*noindex[^"\']*["\'][^>]+name=["\']robots["\']', text, re.I):
                  continue
              url = base if rel == 'index.html' else base + rel
              title_m = re.search(r'<title>(.*?)</title>', text, re.I | re.S)
              title = re.sub(r'\s+', ' ', title_m.group(1)).strip() if title_m else rel
              title = re.sub(r'\s*[|—-]\s*Contre[-‑]?Évidence.*$', '', title, flags=re.I)
              try:
                  stamp = subprocess.check_output(['git','log','-1','--format=%cs','--',rel], text=True).strip()
              except Exception:
                  stamp = ''
              if not stamp:
                  stamp = datetime.now(timezone.utc).date().isoformat()
              pages.append((rel, url, stamp, title))

          plan_url = base + 'plan-du-site.html'
          sitemap_pages = [(url, stamp) for _, url, stamp, _ in pages]

          lines = ['<?xml version="1.0" encoding="UTF-8"?>','<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for url, stamp in sitemap_pages:
              lines.append(f'  <url><loc>{escape(url)}</loc><lastmod>{stamp}</lastmod></url>')
          lines.append('</urlset>')
          xml = '\n'.join(lines) + '\n'
          Path('sitemap.xml').write_text(xml, encoding='utf-8')
          Path('sitemap-google.xml').write_text(xml, encoding='utf-8')
          Path('sitemap.txt').write_text('\n'.join(url for url, _ in sitemap_pages) + '\n', encoding='utf-8')

          def group_for(rel):
              if rel.startswith('dossiers/'): return 'Dossiers'
              if rel.startswith('articles/'): return 'Articles'
              if rel.startswith('fiches-metiers/'): return 'Fiches métiers'
              if rel.startswith('themes/') or rel.startswith('parcours-'): return 'Parcours et thèmes'
              if rel.startswith('hors-cadre'): return 'Hors cadre'
              return 'Pages principales'

          order = ['Pages principales','Parcours et thèmes','Dossiers','Articles','Fiches métiers','Hors cadre']
          groups = {g: [] for g in order}
          for rel, url, stamp, title in pages:
              groups.setdefault(group_for(rel), []).append((rel, title))

          body = []
          for group in order:
              items = groups.get(group, [])
              if not items: continue
              body.append(f'<section><h2>{hescape(group)}</h2><ul>')
              for rel, title in items:
                  href = './' if rel == 'index.html' else rel
                  body.append(f'<li><a href="{hescape(href)}">{hescape(title)}</a></li>')
              body.append('</ul></section>')

          plan = f'''<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Plan du site | Contre-Évidence</title><meta name="description" content="Plan HTML de Contre-Évidence : accès direct aux pages, dossiers, articles, parcours et fiches métiers."><link rel="canonical" href="{plan_url}"><style>body{{font-family:system-ui,-apple-system,sans-serif;max-width:1100px;margin:auto;padding:32px 20px;line-height:1.5;background:#07131c;color:#f4f1e8}}a{{color:#f4b12b}}h1,h2{{line-height:1.15}}section{{margin:32px 0}}ul{{columns:2;column-gap:36px;padding-left:20px}}li{{break-inside:avoid;margin:.35rem 0}}@media(max-width:700px){{ul{{columns:1}}}}</style></head><body><header><a href="./">← Contre-Évidence</a><h1>Plan du site</h1><p>Accès HTML direct aux pages indexables du site pour les lecteurs qui préfèrent une liste complète.</p></header>{''.join(body)}<footer><p><a href="./">Retour à l’accueil</a> · <a href="bibliotheque.html">Bibliothèque</a></p></footer></body></html>'''
          Path('plan-du-site.html').write_text(plan, encoding='utf-8')
          print(f'Sitemaps and crawl hub generated with {len(pages)} indexable HTML pages.')

      - name: Commit generated discovery files if changed
        run: |
          if git diff --quiet -- sitemap.xml sitemap-google.xml sitemap.txt plan-du-site.html && git ls-files --error-unmatch sitemap.txt plan-du-site.html sitemap-google.xml >/dev/null 2>&1; then
            echo "Discovery files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml sitemap-google.xml sitemap.txt plan-du-site.html
          git commit -m "Mise à jour automatique de la découverte SEO"
          git push

# Les pages noindex et le plan HTML utilitaire sont exclus des sitemaps XML/TXT.
# Toute promotion d’un outil indexable est ainsi reprise automatiquement au prochain passage.
