name: Resolve freshness alerts

on:
  push:
    paths:
      - 'scripts/resolve_freshness_alerts.py'
      - '.github/workflows/resolve-freshness-alerts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted fixes
        run: python scripts/resolve_freshness_alerts.py
      - name: Commit editorial revalidation
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/audit_content_freshness.py \
            dossiers/patrimoine-permet-il-travailler-moins.html \
            dossiers/quitter-travail-reconversion-sans-se-fragiliser.html \
            articles/comparatif-enveloppes-pea-assurance-vie-cto-per.html \
            dossiers/lancer-activite-sans-quitter-emploi.html
          git commit -m "Revalidate remaining sensitive content"
          git push
