name: Add official guardrails to immobilier and admin dossiers

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add-official-guardrails-immobilier-admin.py'
      - '.github/workflows/add-official-guardrails-immobilier-admin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Add official guardrails
        run: python scripts/add-official-guardrails-immobilier-admin.py
      - name: Commit dossier updates
        run: |
          if git diff --quiet -- dossiers/bien-immobilier-garder-vendre-transformer.html dossiers/debloquer-demarche-administrative.html; then
            echo 'Dossiers already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dossiers/bien-immobilier-garder-vendre-transformer.html dossiers/debloquer-demarche-administrative.html
          git commit -m 'Ajouter les garde-fous officiels immobilier et démarches'
          git pull --rebase origin main
          git push
