name: Finalize plain-language editorial layer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bake-plain-language.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clean duplicates and simplify remaining entry copy
        shell: python
        run: |
          from pathlib import Path
          import re

          def edit(path, replacements=(), dedupe_guides=False):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              if dedupe_guides:
                  pattern = re.compile(r'(<div class="answer-box ce-plain-guide"><h2>Pour commencer simplement</h2>.*?</div>)\s*\1', re.S)
                  while pattern.search(text):
                      text = pattern.sub(r'\1', text)
              p.write_text(text, encoding='utf-8')

          edit('index.html', [
              ('03 · Construire mon chemin mon chemin', '03 · Construire mon chemin'),
              ('<meta property="og:title" content="Contre-Évidence — Se situer, arbitrer, construire ses décisions de vie"/>', '<meta property="og:title" content="Contre-Évidence — Comprendre sa situation, faire un choix, avancer"/>'),
              ('<meta name="twitter:title" content="Contre-Évidence — Se situer, arbitrer, construire ses décisions de vie"/>', '<meta name="twitter:title" content="Contre-Évidence — Comprendre sa situation, faire un choix, avancer"/>'),
              ('Dossiers sourcés, comparaisons et outils pour se situer, arbitrer et construire des décisions de patrimoine, d\'emploi et de qualité de vie.', 'Dossiers sourcés, comparaisons et outils pour comprendre sa situation, faire des choix et construire des décisions de patrimoine, d\'emploi et de qualité de vie.'),
              ('Comprendre où l\'on en est, arbitrer entre plusieurs options et construire un chemin vers ses objectifs.', 'Comprendre où l\'on en est, comparer plusieurs options et construire un chemin vers ses objectifs.')
          ])

          edit('parcours-de-vie.html', [
              ('03 · Construire mon chemin mon chemin', '03 · Construire mon chemin'),
              ('<meta property="og:title" content="Par où commencer ? Se situer, arbitrer, construire | Contre-Évidence"/>', '<meta property="og:title" content="Par où commencer ? Comprendre, choisir, avancer | Contre-Évidence"/>'),
              ('<meta name="twitter:description" content="Se situer, arbitrer ou construire : choisissez le point de départ qui correspond à votre besoin."/>', '<meta name="twitter:description" content="Comprendre votre situation, comparer vos options ou construire un plan : choisissez le point de départ qui vous correspond."/>'),
              ('Comparer les options sans réduire la décision à un seul chiffre : coût, risque, temps, qualité de vie, réversibilité et effets futurs.', 'Comparer les options sans réduire la décision à un seul chiffre : coût, risque, temps, qualité de vie, possibilité de revenir en arrière et effets futurs.'),
              ('Une décision robuste ne consiste pas à chercher « la meilleure option » en général.', 'Une bonne décision ne consiste pas à chercher « la meilleure option » en général.'),
              ('Je veux situer ma position patrimoniale', 'Je veux savoir où j’en suis avec mon patrimoine'),
              ('Je veux situer ma trajectoire professionnelle', 'Je veux comprendre où va ma vie professionnelle'),
              ('Je veux tester mon capital professionnel', 'Je veux faire le point sur mes atouts professionnels'),
              ('Mettre des mots sur l’employabilité, la dépendance, la transférabilité et les marges de progression.', 'Voir ce que vous savez faire, ce qui dépend de votre poste actuel, ce que vous pouvez réutiliser ailleurs et vos possibilités de progression.'),
              ('Faire découler l’allocation des projets, de la liquidité nécessaire, de la capacité de risque et de l’horizon réel.', 'Faire découler la répartition de votre argent de vos projets, de ce qui doit rester disponible, du risque acceptable et du temps dont vous disposez.'),
              ('pour construire une trajectoire soutenable.', 'pour construire un chemin tenable dans la durée.')
          ])

          edit('parcours-vie-professionnelle.html', [
              ('identifier le levier immédiat.', 'identifier ce qui peut débloquer la situation maintenant.'),
              ('qualité de vie et capital professionnel futur.', 'qualité de vie et ce que le poste vous apportera pour la suite.'),
              ('Une fois la trajectoire située, chaque porte mène vers le dossier maître du problème immédiat puis vers les approfondissements utiles.', 'Chaque porte mène d’abord à la réponse utile pour le problème du moment, puis aux explications plus détaillées si vous voulez aller plus loin.')
          ])

          edit('dossiers/allocation-patrimoine-selon-situation.html', dedupe_guides=True)
          edit('dossiers/trajectoire-professionnelle-selon-situation.html', [
              ('<th>Priorité rationnelle</th>', '<th>Priorité logique</th>'),
              ('Reconstruire d’abord sécurité, transférabilité et solution soutenable', 'Reconstruire d’abord sécurité, compétences utilisables ailleurs et solution tenable dans la durée')
          ], dedupe_guides=True)
          edit('dossiers/tout-ca-pour-quoi-objectifs-besoins.html', dedupe_guides=True)

      - name: Commit final editorial cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Editorial cleanup already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html parcours-de-vie.html parcours-vie-professionnelle.html dossiers/allocation-patrimoine-selon-situation.html dossiers/trajectoire-professionnelle-selon-situation.html dossiers/tout-ca-pour-quoi-objectifs-besoins.html
          git commit -m 'Finaliser la vulgarisation éditoriale'
          git pull --rebase origin main
          git push
