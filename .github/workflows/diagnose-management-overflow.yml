name: Diagnose management mobile overflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-management-overflow.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --no-save puppeteer-core@24
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ce-http.log 2>&1 &
          sleep 1
      - name: Identify the element or pseudo-element contributing to page width
        shell: bash
        run: |
          cat > diag.mjs <<'JS'
          import fs from 'fs';
          import puppeteer from 'puppeteer-core';
          const bins=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'];
          const executablePath=bins.find(fs.existsSync);
          const browser=await puppeteer.launch({executablePath,headless:'new',args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage();
          await page.setViewport({width:390,height:844});
          await page.setRequestInterception(true);
          page.on('request',r=>r.url().startsWith('http://127.0.0.1:4173/')?r.continue():r.abort());
          await page.goto('http://127.0.0.1:4173/dossiers/management-relations-conflits.html',{waitUntil:'domcontentloaded'});
          await new Promise(r=>setTimeout(r,300));
          const result=await page.evaluate(()=>{
            const base={innerWidth,clientWidth:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth,bodyScrollWidth:document.body.scrollWidth};
            const all=[...document.body.querySelectorAll('*')];
            const contributors=[];
            for(let i=0;i<all.length;i++){
              const el=all[i];
              const old=el.style.display;
              el.style.display='none';
              const sw=document.documentElement.scrollWidth;
              el.style.display=old;
              if(sw<base.scrollWidth){
                const r=el.getBoundingClientRect();
                contributors.push({i,tag:el.tagName.toLowerCase(),id:el.id||'',cls:String(el.className||'').slice(0,120),text:(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,100),rect:{left:Math.round(r.left),right:Math.round(r.right),width:Math.round(r.width)},scrollWidth:el.scrollWidth,clientWidth:el.clientWidth,docWithout:sw});
              }
            }
            const pseudo=[];
            for(const el of all){
              for(const kind of ['::before','::after']){
                const c=getComputedStyle(el,kind);
                if(c.content && c.content!=='none' && c.content!=='normal'){
                  pseudo.push({tag:el.tagName.toLowerCase(),id:el.id||'',cls:String(el.className||'').slice(0,100),kind,content:c.content,width:c.width,left:c.left,right:c.right,position:c.position,display:c.display,transform:c.transform});
                }
              }
            }
            const scrollables=all.filter(el=>el.scrollWidth>el.clientWidth+2).slice(0,40).map(el=>({tag:el.tagName.toLowerCase(),id:el.id||'',cls:String(el.className||'').slice(0,100),scrollWidth:el.scrollWidth,clientWidth:el.clientWidth,overflowX:getComputedStyle(el).overflowX,text:(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,80)}));
            return {base,contributors,pseudo,scrollables};
          });
          console.log(JSON.stringify(result,null,2));
          await browser.close();
          JS
          node diag.mjs
