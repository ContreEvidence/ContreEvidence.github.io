name: Browser render audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/**/*.css'
      - 'assets/**/*.js'
      - '.github/workflows/browser-render-audit.yml'

permissions:
  contents: read

concurrency:
  group: browser-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install browser driver
        run: npm install --no-save puppeteer-core@24
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ce-http.log 2>&1 &
          sleep 1
      - name: Render every published page on desktop and mobile
        run: |
          cat > browser-render-audit.mjs <<'JS'
          import fs from 'fs';
          import path from 'path';
          import puppeteer from 'puppeteer-core';

          const root=process.cwd();
          const excluded=new Set(['.git','.github','scripts','editorial','publication','publications','node_modules','_site']);
          const utilityPages=new Set(['plan-du-site.html']);
          function walk(dir,out=[]){
            for(const name of fs.readdirSync(dir)){
              if(excluded.has(name)) continue;
              const p=path.join(dir,name), st=fs.statSync(p);
              if(st.isDirectory()) walk(p,out);
              else if(name.endsWith('.html')) out.push(path.relative(root,p).replaceAll('\\','/'));
            }
            return out;
          }

          const pages=walk(root).filter(rel=>!utilityPages.has(rel)).sort();
          const bins=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'];
          const executablePath=bins.find(fs.existsSync);
          if(!executablePath) throw new Error('Chrome/Chromium not found');

          const browser=await puppeteer.launch({executablePath,headless:'new',args:['--no-sandbox','--disable-dev-shm-usage']});
          const viewports=[['desktop',1440,900],['mobile',390,844]];
          const failures=[];
          let renders=0;

          for(const rel of pages){
            for(const [viewport,width,height] of viewports){
              const page=await browser.newPage();
              await page.setViewport({width,height});
              await page.setRequestInterception(true);
              page.on('request',r=>{
                const u=r.url();
                if(u.startsWith('http://127.0.0.1:4173/')||u.startsWith('data:')||u.startsWith('blob:')) r.continue();
                else r.abort();
              });
              const jsErrors=[], badResponses=[];
              page.on('pageerror',e=>jsErrors.push(String(e.message||e)));
              page.on('response',r=>{
                if(r.url().startsWith('http://127.0.0.1:4173/')&&r.status()>=400) badResponses.push(`${r.status()} ${r.url()}`);
              });

              const url='http://127.0.0.1:4173/'+rel.split('/').map(encodeURIComponent).join('/');
              let navigationError='';
              try{
                await page.goto(url,{waitUntil:'domcontentloaded',timeout:8000});
                await new Promise(r=>setTimeout(r,220));
              }catch(e){ navigationError=String(e.message||e); }

              const metrics=await page.evaluate(()=>{
                const visible=e=>{
                  if(!e) return false;
                  const c=getComputedStyle(e), r=e.getBoundingClientRect();
                  return c.display!=='none'&&c.visibility!=='hidden'&&r.width>5&&r.height>5;
                };
                const badTables=[];
                document.querySelectorAll('table').forEach((t,i)=>{
                  const r=t.getBoundingClientRect();
                  if(r.right<=innerWidth+2&&r.left>=-2) return;
                  let a=t.parentElement, contained=false;
                  while(a&&a!==document.body){
                    const c=getComputedStyle(a);
                    if(['auto','scroll'].includes(c.overflowX)&&a.scrollWidth>a.clientWidth+2){contained=true;break;}
                    a=a.parentElement;
                  }
                  if(!contained) badTables.push(i+1);
                });
                const overflow=Math.max(0,document.documentElement.scrollWidth-window.innerWidth);
                const overflowElements=[];
                if(overflow>3){
                  document.querySelectorAll('body *').forEach(el=>{
                    if(overflowElements.length>=8) return;
                    const c=getComputedStyle(el), r=el.getBoundingClientRect();
                    if(c.display==='none'||c.visibility==='hidden'||c.position==='fixed'||r.width<=2||r.height<=2) return;
                    if(r.right>innerWidth+3||r.left<-3){
                      overflowElements.push({
                        tag:el.tagName.toLowerCase(),
                        id:el.id||'',
                        cls:String(el.className||'').slice(0,80),
                        left:Math.round(r.left),
                        right:Math.round(r.right),
                        width:Math.round(r.width),
                        text:(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,90)
                      });
                    }
                  });
                }
                return {
                  textLen:(document.body?.innerText||'').trim().length,
                  overflow,
                  overflowElements,
                  headerVisible:visible(document.querySelector('#site-header, header')),
                  mainVisible:visible(document.querySelector('main')),
                  badTables
                };
              });

              const reasons=[];
              if(navigationError) reasons.push('navigation-error');
              if(badResponses.length) reasons.push('local-http:'+badResponses.join('|'));
              if(jsErrors.length) reasons.push('js:'+[...new Set(jsErrors)].join('|'));
              if(metrics.overflow>3) reasons.push(`horizontal-overflow:${metrics.overflow}px offenders=${JSON.stringify(metrics.overflowElements)}`);
              if(metrics.badTables.length) reasons.push('uncontained-table:'+metrics.badTables.join(','));
              if(!metrics.headerVisible&&rel!=='404.html') reasons.push('header-not-visible');
              if(!metrics.mainVisible&&rel!=='404.html') reasons.push('main-not-visible');
              if(metrics.textLen<80&&!['merci.html','404.html'].includes(rel)) reasons.push('very-low-text:'+metrics.textLen);
              if(reasons.length) failures.push({rel,viewport,reasons});
              renders++;
              await page.close();
            }
          }

          await browser.close();
          const grouped=new Map();
          for(const f of failures){
            if(!grouped.has(f.rel)) grouped.set(f.rel,[]);
            grouped.get(f.rel).push(`${f.viewport}: ${f.reasons.join('; ')}`);
          }
          console.log(`PUBLISHED_HTML=${pages.length}`);
          console.log(`RENDERS=${renders}`);
          console.log(`PAGES_WITH_FINDINGS=${grouped.size}`);
          console.log(`RENDER_CASES_WITH_FINDINGS=${failures.length}`);
          for(const [rel,rows] of grouped){
            console.log(`\n## ${rel}`);
            rows.forEach(row=>console.log(row));
          }
          fs.writeFileSync('/tmp/browser-render-audit.json',JSON.stringify({pages:pages.length,renders,failures},null,2));
          if(failures.length) process.exitCode=1;
          JS
          node browser-render-audit.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-render-audit
          path: /tmp/browser-render-audit.json
          if-no-files-found: warn
          retention-days: 7

# Compare page scroll width with window.innerWidth so the vertical scrollbar is not counted as horizontal overflow.
