name: Fix accessibility labels

on:
  push:
    paths:
      - 'scripts/fix_accessibility_labels.py'
      - '.github/workflows/fix-accessibility-labels.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply labels
        run: python scripts/fix_accessibility_labels.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outil-microscope-pea.html outil-pilotage-recherche-emploi.html simulateur-acheter-ou-louer.html simulateur-cout-formation.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Label interactive tool fields for accessibility"
          git push
