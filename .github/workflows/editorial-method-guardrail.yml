name: Editorial method guardrail

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-method-guardrail.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Add editorial voice rule to method page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('methode-sources.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
            (
              '<p><strong>Question réelle → réponse courte → faits et sources → exemple → comparaison → scénario adverse → limites → méthode applicable à soi.</strong></p>',
              '<p><strong>Question réelle → réponse courte → faits et sources → exemple → comparaison → scénario adverse → leviers et options → limites → méthode applicable à soi.</strong></p>'
            ),
            (
              '<p>Exemple : pour un passage à 80 %, deux salariés avec le même revenu peuvent avoir des décisions opposées si l’un épargne 1 000 € par mois et l’autre 100 €. Pour un achat immobilier, deux ménages avec le même apport peuvent avoir une robustesse très différente selon la réserve conservée après signature.</p>',
              '<p>Exemple : pour un passage à 80 %, deux salariés avec le même revenu peuvent avoir des décisions opposées si l’un épargne 1 000 € par mois et l’autre 100 €. Pour un achat immobilier, deux ménages avec le même apport peuvent avoir une robustesse très différente selon la réserve conservée après signature.</p><div class="decision-box"><h3>Règle de voix éditoriale</h3><p><strong>La formulation d’entrée suit la question réelle du lecteur, même lorsqu’elle exprime une inquiétude.</strong> La réponse ne force ensuite ni une conclusion positive ni une conclusion prudente : elle distingue ce qui est contraint, ce qui peut être modifié ou testé et les options réellement disponibles. Un risque reste nommé lorsqu’il existe ; une possibilité n’est présentée que lorsqu’elle est défendable.</p></div>'
            ),
            ('"dateModified":"2026-08-11"', '"dateModified":"2026-08-12"'),
            ('<meta name="dateModified" content="2026-08-11"/>', '<meta name="dateModified" content="2026-08-12"/>'),
            ('Cadre éditorial mis à jour le 11 août 2026', 'Cadre éditorial mis à jour le 12 août 2026'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected method text: {old[:100]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit method guardrail
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add methode-sources.html
          git commit -m "Codify query-first editorial voice"
          git push
