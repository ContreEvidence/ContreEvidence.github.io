name: Refine central starting paths

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refine-starting-paths.py'
      - '.github/workflows/refine-starting-paths.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Refine the first situation choices
        run: python scripts/refine-starting-paths.py
      - name: Commit central pathway update
        run: |
          if git diff --quiet -- parcours-de-vie.html; then
            echo 'Pathway already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add parcours-de-vie.html
          git commit -m 'Clarifier les points d’entrée débutant et avancé'
          git pull --rebase origin main
          git push
