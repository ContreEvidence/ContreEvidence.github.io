name: Patch 50 candidatures batch 24

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-50-candidatures-batch24.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align article update metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('articles/50-candidatures-zero-reponse.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('"dateModified":"2026-08-11"', '"dateModified":"2026-08-16"')
          s = s.replace('Mis à jour le 11/08/2026 · Hypothèses et seuils explicités', 'Mis à jour le 16/08/2026 · Gatekeepers, canaux, hypothèses et seuils explicités')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit metadata alignment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles/50-candidatures-zero-reponse.html
          git commit -m 'Align zero-response article update metadata'
          git push
