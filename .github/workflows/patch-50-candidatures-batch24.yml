name: Patch 50 candidatures batch 24

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-50-candidatures-batch24.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deepen recruitment gatekeeper diagnosis
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('articles/50-candidatures-zero-reponse.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('meta name="dateModified" content="2026-08-11"', 'meta name="dateModified" content="2026-08-16"')
          s = s.replace('meta property="article:modified_time" content="2026-08-11"', 'meta property="article:modified_time" content="2026-08-16"')
          anchor1 = '<h2>3. Trois personnes peuvent avoir « zéro offre » pour des raisons opposées</h2>'
          insert1 = '<h2>2 bis. Localiser aussi qui contrôle l’étape qui casse</h2><p>Une étape du tunnel n’est pas un acteur unique. Selon le canal et l’entreprise, la candidature peut d’abord être triée par une plateforme, un outil de présélection ou une personne chargée du recrutement ; plus tard, le futur manager ou plusieurs décideurs peuvent reprendre la main. <strong>Le même symptôme ne doit donc pas déclencher la même correction.</strong></p><div class="compare-wrap"><table class="compare-table"><thead><tr><th>Où cela bloque ?</th><th>Acteur à identifier</th><th>Question utile</th><th>Test prioritaire</th></tr></thead><tbody><tr><td>Aucune réponse humaine</td><td>Canal de candidature, présélection, recruteur</td><td>Le dossier atteint-il réellement une personne capable de comprendre le profil ?</td><td>Tester le même segment par un autre canal sans changer simultanément le fond du CV.</td></tr><tr><td>Échange RH puis arrêt</td><td>Recruteur / RH</td><td>Quel risque bloque : salaire, disponibilité, stabilité, lisibilité du projet ?</td><td>Demander ou reconstruire l’objection récurrente avant de réécrire tout le dossier.</td></tr><tr><td>Entretien métier puis arrêt</td><td>Futur manager / opérationnel</td><td>Quelle preuve de capacité ou d’adaptation manque après l’échange ?</td><td>Travailler les exemples et preuves liés au travail réel plutôt que le seul CV.</td></tr><tr><td>Finales répétées sans offre</td><td>Décideur final / comparaison avec d’autres candidats</td><td>Quel écart résiduel revient : conditions, niveau, salaire, référence, disponibilité ?</td><td>Comparer les trois dernières finales avant de modifier le positionnement général.</td></tr></tbody></table></div><p>Le but n’est pas de deviner l’organigramme du recrutement. Il est d’éviter une erreur de causalité : <strong>corriger le document alors que le verrou se trouve dans le canal ou chez un décideur qui évalue un autre risque.</strong></p>'
          if anchor1 not in s:
              raise SystemExit('anchor1 not found')
          s = s.replace(anchor1, insert1 + anchor1, 1)
          anchor2 = '<h2>7. Et si le problème est le marché, pas votre candidature ?</h2>'
          insert2 = '<h2>6 bis. Même preuve, autre canal : le test qui évite de surcorriger le CV</h2><p>Si vous soupçonnez un problème de filtre initial, conservez autant que possible <strong>la même cible, le même niveau et les mêmes preuves</strong>, puis changez seulement le canal sur une petite série : candidature via l’annonce, contact direct lorsque c’est approprié, recommandation ou autre voie légitime réellement disponible.</p><div class="case-study"><h3>Ce que le résultat peut apprendre</h3><p>Si le même positionnement reste silencieux sur un canal mais obtient plusieurs échanges humains sur un autre, la compétence n’a pas soudainement changé. Le verrou peut se situer dans la <strong>visibilité, le routage ou la lecture initiale</strong>. À l’inverse, si le silence converge sur plusieurs canaux comparables, revenir au ciblage, aux preuves ou à une contrainte structurelle devient plus rationnel.</p></div><div class="decision-box"><h3>Règle de test</h3><p><strong>Ne changez pas en même temps le CV, le métier, le salaire, la zone et le canal.</strong> Sinon davantage de candidatures produisent moins d’information sur la cause réelle du blocage.</p></div>'
          if anchor2 not in s:
              raise SystemExit('anchor2 not found')
          s = s.replace(anchor2, insert2 + anchor2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles/50-candidatures-zero-reponse.html
          git commit -m 'Deepen zero-response recruitment gatekeeper diagnosis'
          git push
