name: Batch 34b preserve patrimoine depth

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Preserve secondary links
        shell: python
        run: |
          from pathlib import Path
          p = Path('themes/argent.html')
          t = p.read_text(encoding='utf-8')
          old = '<a href="../dossiers/cout-reel-voiture-achat-credit-loa-lld.html">Calculer le coût réel d’une voiture →</a></div></article>'
          new = '<a href="../dossiers/cout-reel-voiture-achat-credit-loa-lld.html">Calculer le coût réel d’une voiture →</a><a href="../dossiers/assurer-ou-autoassurer-risques.html">Quels risques assurer ou autoassurer ? →</a><a href="../simulateur-prix-attendre.html">Calculer ce que me coûte le fait d’attendre →</a></div></article>'
          assert old in t
          t = t.replace(old, new, 1)
          old = '<a href="../articles/frais-fiscalite-rendement-net.html">Mesurer frais, fiscalité et rendement net →</a><a href="../dossiers/rembourser-credit-ou-investir.html">'
          new = '<a href="../articles/frais-fiscalite-rendement-net.html">Mesurer frais, fiscalité et rendement net →</a><a href="../dossiers/inflation-comprendre-histoire-pouvoir-achat.html">Comprendre inflation et pouvoir d’achat →</a><a href="../dossiers/rembourser-credit-ou-investir.html">'
          assert old in t
          t = t.replace(old, new, 1)
          old = '<a href="../dossiers/finances-investissement-locatif.html">Tester rendement, cash-flow et risques locatifs →</a><a href="../dossiers/bien-immobilier-garder-vendre-transformer.html">'
          new = '<a href="../dossiers/finances-investissement-locatif.html">Tester rendement, cash-flow et risques locatifs →</a><a href="../dossiers/location-nue-ou-meublee-comparer.html">Comparer location nue et meublée →</a><a href="../dossiers/location-courte-duree-meuble-tourisme.html">Comprendre courte durée et meublé de tourisme →</a><a href="../dossiers/garages-parkings-locaux-commerciaux.html">Diversifier avec garages, parkings ou locaux commerciaux →</a><a href="../dossiers/valeur-option-bien-immobilier.html">Mesurer la valeur des options laissées par un bien →</a><a href="../dossiers/bien-immobilier-garder-vendre-transformer.html">'
          assert old in t
          t = t.replace(old, new, 1)
          old = '<a href="../simulateur-vendre-ou-conserver.html">Vendre ou conserver un bien →</a></div></div></article>'
          new = '<a href="../simulateur-vendre-ou-conserver.html">Vendre ou conserver un bien →</a><a href="../simulateur-comparer-strategies-immobilieres.html">Comparer trois stratégies immobilières →</a></div></div></article>'
          assert old in t
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')
      - name: Commit preservation patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/argent.html
          git diff --cached --check
          git commit -m "Preserve patrimoine navigation depth"
          git pull --rebase origin main
          git push
