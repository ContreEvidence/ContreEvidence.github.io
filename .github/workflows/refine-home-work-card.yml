name: Refine homepage work card

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refine-home-work-card.py'
      - '.github/workflows/refine-home-work-card.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Align Vie professionnelle homepage card
        run: python scripts/refine-home-work-card.py
      - name: Commit homepage update
        run: |
          if git diff --quiet -- index.html; then
            echo 'Homepage already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Aligner l’accueil avec le parcours Vie professionnelle'
          git pull --rebase origin main
          git push
