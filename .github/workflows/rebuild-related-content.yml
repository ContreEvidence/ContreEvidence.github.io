name: Rebuild related content

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/library-catalog.js'
      - 'assets/library-daily-money.js'
      - 'assets/library-work-foundations.js'
      - 'assets/library-transitions.js'
      - 'assets/library-acquisition.js'
      - 'scripts/add-related-content.cjs'
      - '.github/workflows/rebuild-related-content.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate related-content blocks only
        run: node scripts/add-related-content.cjs
      - name: Commit regenerated recommendations
        run: |
          if git diff --quiet -- '*.html' articles dossiers fiches-metiers themes; then
            echo 'No related-content change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' articles dossiers fiches-metiers themes
          git commit -m 'Synchroniser les recommandations de lecture'
          git pull --rebase origin main
          git push
