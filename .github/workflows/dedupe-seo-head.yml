name: Deduplicate SEO head tags

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dedupe-seo-head.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Keep the final authoritative singleton meta tags
        shell: python
        run: |
          from pathlib import Path
          import re

          pages = [
              Path('articles/competences-invisibles-preuves.html'),
              Path('articles/construire-epargne-de-zero.html'),
              Path('articles/grosse-entree-argent-que-faire.html'),
              Path('articles/tester-metier-avant-investir.html'),
          ]
          singleton_keys = {
              ('name','description'),
              ('property','og:type'),
              ('property','og:title'),
              ('property','og:description'),
              ('property','og:url'),
              ('property','og:image'),
              ('name','twitter:card'),
              ('name','twitter:title'),
              ('name','twitter:description'),
              ('name','twitter:image'),
          }
          meta_re = re.compile(r'<meta\b[^>]*?/?>', re.I)
          attr_re = re.compile(r'\b(name|property)\s*=\s*["\']([^"\']+)["\']', re.I)

          for page in pages:
              text = page.read_text(encoding='utf-8')
              tags = []
              for m in meta_re.finditer(text):
                  a = attr_re.search(m.group(0))
                  if not a:
                      continue
                  key = (a.group(1).lower(), a.group(2).lower())
                  if key in singleton_keys:
                      tags.append((m.start(), m.end(), key))
              by_key = {}
              for start,end,key in tags:
                  by_key.setdefault(key, []).append((start,end))
              removals = []
              for key, spans in by_key.items():
                  if len(spans) > 1:
                      removals.extend(spans[:-1])
              if not removals:
                  continue
              for start,end in sorted(removals, reverse=True):
                  text = text[:start] + text[end:]
              page.write_text(text, encoding='utf-8')
              print(page, 'removed', len(removals), 'duplicate meta tags')

      - name: Commit deduplication
        run: |
          if git diff --quiet; then
            echo 'No duplicate singleton SEO tags found.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles
          git commit -m 'Nettoyer les balises SEO dupliquées'
          git push
