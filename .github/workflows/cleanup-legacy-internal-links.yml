name: Clean legacy internal links

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-legacy-internal-links.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Replace links to known legacy transition pages
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'articles/construire-epargne-de-zero.html': {
                  '50000-euros-livret-peur-investir.html': 'investir-grosse-somme-dun-coup-ou-progressivement.html',
              },
              'articles/premiere-chance-sans-experience.html': {
                  'accepter-nimporte-quel-premier-emploi.html': 'accepter-nimporte-quel-poste-retour-emploi.html',
              },
              'articles/entretien-rate-ce-qui-bloque.html': {
                  'expliquer-parcours-accidente.html': '../dossiers/plan-30-jours-recherche-emploi.html#parcours-atypique',
              },
              'articles/competences-invisibles-preuves.html': {
                  'reconversion-ne-commence-pas-formation.html': 'tester-metier-avant-investir.html',
              },
              'dossiers/audit-copropriete-avant-achat.html': {
                  'finances-immobilier-patrimoine.html': 'immobilier-allocation-globale-patrimoine.html',
              },
              'dossiers/cout-complet-achat-immobilier.html': {
                  'finances-immobilier-patrimoine.html': 'immobilier-allocation-globale-patrimoine.html',
                  'vendre-ou-conserver-bien-immobilier.html': 'bien-immobilier-garder-vendre-transformer.html',
              },
              'dossiers/finances-credit-endettement.html': {
                  'finances-immobilier-patrimoine.html': 'immobilier-allocation-globale-patrimoine.html',
              },
              'dossiers/finances-investissement-locatif.html': {
                  'finances-immobilier-indirect.html': 'immobilier-allocation-globale-patrimoine.html',
                  'finances-immobilier-patrimoine.html': 'immobilier-allocation-globale-patrimoine.html',
                  'vendre-ou-conserver-bien-immobilier.html': 'bien-immobilier-garder-vendre-transformer.html',
              },
              'dossiers/garages-parkings-locaux-commerciaux.html': {
                  'vendre-ou-conserver-bien-immobilier.html': 'bien-immobilier-garder-vendre-transformer.html',
              },
              'dossiers/valeur-option-bien-immobilier.html': {
                  'vendre-ou-conserver-bien-immobilier.html': 'bien-immobilier-garder-vendre-transformer.html',
              },
              'simulateur-vendre-ou-conserver.html': {
                  'dossiers/vendre-ou-conserver-bien-immobilier.html': 'dossiers/bien-immobilier-garder-vendre-transformer.html',
              },
          }

          changed = []
          for rel, mapping in replacements.items():
              path = Path(rel)
              text = path.read_text(encoding='utf-8')
              new = text
              for old, target in mapping.items():
                  new = new.replace(old, target)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(rel)
          print('Changed:', ', '.join(changed) if changed else 'none')

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo 'No legacy links to update.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles dossiers simulateur-vendre-ou-conserver.html
          git commit -m 'Relier directement les contenus canoniques'
          git push
