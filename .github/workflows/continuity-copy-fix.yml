name: Continuity copy fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continuity-copy-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Align CTA and destination copy
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Keep the third option visible in the CTA that follows the rewritten card.
          p = Path('parcours-vie-professionnelle.html')
          s = p.read_text(encoding='utf-8')
          old = '<span>Comparer rester et partir →</span>'
          new = '<span>Comparer rester, préparer ou partir →</span>'
          if old not in s:
              raise SystemExit('Expected Vie pro CTA not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 2) Align the first visible screen of the destination page without changing its SEO title/meta intent.
          p = Path('dossiers/emploi-chercher-accepter-negocier-evoluer.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              (
                  '<h1>Chercher, accepter, négocier ou évoluer : quel est votre vrai problème d’emploi ?</h1>',
                  '<h1>Emploi : chercher, accepter, négocier ou évoluer — où agir d’abord ?</h1>'
              ),
              (
                  '<p>Une recherche qui n’aboutit pas, une offre difficile à évaluer et une progression bloquée ne relèvent pas du même problème. La première étape consiste à localiser précisément l’endroit où la chaîne se casse.</p>',
                  '<p>Une recherche qui n’aboutit pas, une offre difficile à évaluer et une progression bloquée ne demandent pas la même action. La première étape consiste à repérer où agir dans la chaîne : ciblage, candidature, entretien, offre, négociation ou évolution.</p>'
              ),
              (
                  '<h2>1. Avant d’agir, mesurez où la chaîne casse</h2>',
                  '<h2>1. Avant d’agir, repérez où intervenir dans la chaîne</h2>'
              ),
              ('<meta name="dateModified" content="2026-08-11"/>', '<meta name="dateModified" content="2026-08-12"/>'),
              ('<meta property="article:modified_time" content="2026-08-11"/>', '<meta property="article:modified_time" content="2026-08-12"/>'),
              ('"dateModified":"2026-08-11"', '"dateModified":"2026-08-12"'),
              ('Mis à jour le 11/08/2026 · Sources et hypothèses précisées dans le dossier', 'Mis à jour le 12/08/2026 · Parcours et sources vérifiés')
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected destination text not found: {old[:90]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit continuity fixes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parcours-vie-professionnelle.html dossiers/emploi-chercher-accepter-negocier-evoluer.html
          git commit -m "Align editorial links with destination copy"
          git push
