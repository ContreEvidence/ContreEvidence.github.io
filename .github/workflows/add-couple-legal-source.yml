name: Add couple property legal source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-couple-legal-source.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Add ANIL source where legal ownership structures are discussed
        shell: python
        run: |
          from pathlib import Path
          p=Path('dossiers/decider-a-deux-travail-patrimoine.html')
          s=p.read_text(encoding='utf-8')
          if 'ANIL — Achat en union libre et indivision' not in s:
            marker='<h2>16.'
            pos=s.find(marker)
            if pos<0: raise SystemExit('section 16 marker not found')
            source='<p class="source-note"><strong>Repère juridique :</strong> pour la propriété en indivision, les quotes-parts inscrites à l’acte, la séparation et les principales architectures d’achat à deux, voir <a href="https://www.anil.org/votre-besoin/acheter/votre-situation-familiale/union-libre/" rel="noopener noreferrer">ANIL — Achat en union libre et indivision</a> et <a href="https://www.anil.org/votre-besoin/acheter/votre-situation-familiale/pacs/" rel="noopener noreferrer">ANIL — Achat immobilier et PACS</a>. Pour une situation réelle, l’acte, les statuts et les conventions applicables restent à examiner.</p>'
            s=s[:pos]+source+s[pos:]
            s=s.replace('name="dateModified" content="2026-08-16"','name="dateModified" content="2026-08-17"',1)
            s=s.replace('property="article:modified_time" content="2026-08-16"','property="article:modified_time" content="2026-08-17"',1)
            p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git diff --check
          git config user.name "ContreEvidence"
          git config user.email "contreevidence@gmail.com"
          git add dossiers/decider-a-deux-travail-patrimoine.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Source couple property legal architecture"
          git push
