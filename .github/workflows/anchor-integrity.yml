name: Internal anchor integrity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '.github/workflows/anchor-integrity.yml'
  pull_request:
    paths:
      - '**/*.html'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate local HTML fragments
        shell: python
        run: |
          from pathlib import Path
          import html,re,sys,urllib.parse,xml.etree.ElementTree as ET
          root=Path('.').resolve(); base='https://contreevidence.github.io/'
          excluded={'.git','.github','scripts','editorial','publication','publications','node_modules','_site'}
          href_re=re.compile(r'href\s*=\s*["\']([^"\']+)["\']',re.I)
          id_re=re.compile(r'\bid=["\']([^"\']+)["\']',re.I)
          ids_cache={}
          def ids(p):
              p=p.resolve()
              if p not in ids_cache:
                  text=p.read_text(encoding='utf-8',errors='replace') if p.exists() else ''
                  ids_cache[p]=set(html.unescape(x) for x in id_re.findall(text))
              return ids_cache[p]
          errors=[]; checked=0
          for p in root.rglob('*.html'):
              rel=p.relative_to(root)
              if any(part in excluded for part in rel.parts): continue
              text=p.read_text(encoding='utf-8',errors='replace')
              for raw in href_re.findall(text):
                  raw=html.unescape(raw.strip())
                  parsed=urllib.parse.urlparse(raw)
                  if not parsed.fragment: continue
                  if parsed.scheme in ('mailto','tel','javascript','data'): continue
                  if parsed.scheme in ('http','https'):
                      if parsed.netloc!='contreevidence.github.io': continue
                      target_rel=urllib.parse.unquote(parsed.path).lstrip('/') or 'index.html'
                      target=(root/target_rel).resolve()
                  else:
                      clean=urllib.parse.unquote(parsed.path)
                      target=(p.parent/clean).resolve() if clean else p.resolve()
                      if clean.endswith('/'): target=target/'index.html'
                  if target.suffix.lower()!='.html' or not target.exists(): continue
                  checked+=1
                  frag=urllib.parse.unquote(parsed.fragment)
                  if frag not in ids(target): errors.append(f'{rel} -> {raw} (target {target.relative_to(root)} has no id={frag!r})')
          print('Internal fragment links checked:',checked)
          for e in errors: print('ERROR:',e)
          if errors:
              print(f'{len(errors)} broken fragment link(s).')
              sys.exit(1)
          print('OK — every internal HTML fragment points to an existing id.')
