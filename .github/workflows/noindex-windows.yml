name: Keep Fenetres out of search acquisition

on:
  push:
    branches: [main]
    paths:
      - 'scripts/noindex-windows.py'
      - '.github/workflows/noindex-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Mark Fenetres as noindex follow
        run: python scripts/noindex-windows.py
      - name: Commit indexing policy
        run: |
          if git diff --quiet -- hors-cadre.html hors-cadre-cuisine.html hors-cadre-decouvertes.html hors-cadre-images.html; then
            echo 'Fenetres already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hors-cadre.html hors-cadre-cuisine.html hors-cadre-decouvertes.html hors-cadre-images.html
          git commit -m 'Réserver Fenêtres à la navigation interne'
          git pull --rebase origin main
          git push
