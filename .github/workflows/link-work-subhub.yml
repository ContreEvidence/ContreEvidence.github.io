name: Link work subhub

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/link-work-subhub.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Add explicit Emploi et carrière subhub link
        shell: python
        run: |
          from pathlib import Path
          p=Path('parcours-vie-professionnelle.html')
          text=p.read_text(encoding='utf-8')
          if 'href="themes/travail.html"' in text:
              print('Subhub link already present.')
              raise SystemExit(0)
          old='<div class="pro-actions"><a class="btn btn-primary" href="dossiers/emploi-chercher-accepter-negocier-evoluer.html">Je ne sais pas encore où ça bloque →</a><a class="btn btn-ghost" href="bibliotheque.html?domain=vie-pro&type=outil">Je veux utiliser un outil</a></div>'
          new='<div class="pro-actions"><a class="btn btn-primary" href="dossiers/emploi-chercher-accepter-negocier-evoluer.html">Je ne sais pas encore où ça bloque →</a><a class="btn btn-ghost" href="themes/travail.html">Parcourir Emploi &amp; carrière →</a><a class="btn btn-ghost" href="bibliotheque.html?domain=vie-pro&type=outil">Je veux utiliser un outil</a></div>'
          if old not in text:
              raise SystemExit('Expected action block not found')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
      - name: Commit hub link
        run: |
          if git diff --quiet -- parcours-vie-professionnelle.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add parcours-vie-professionnelle.html
          git commit -m 'Clarifier le sous-parcours Emploi et carrière'
          git pull --rebase origin main
          git push
