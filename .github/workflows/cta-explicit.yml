name: CTA explicit wording

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cta-explicit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Make departure CTA explicit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('parcours-vie-professionnelle.html')
          s = p.read_text(encoding='utf-8')
          old = '<span>Comparer rester, préparer ou partir →</span>'
          new = '<span>Comparer rester, préparer son départ ou partir maintenant →</span>'
          if old not in s:
              raise SystemExit('Expected CTA not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit CTA wording
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parcours-vie-professionnelle.html
          git commit -m "Make departure CTA explicit"
          git push
