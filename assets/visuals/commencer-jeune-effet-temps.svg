<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Effet du temps sur des versements mensuels identiques commencés à 20, 30 ou 40 ans</title><desc id="d">Avec 200 euros versés chaque mois et une hypothèse pédagogique de 5 pour cent par an jusqu'à 65 ans, commencer à 20 ans aboutit à environ 405 000 euros, à 30 ans environ 227 000 euros, et à 40 ans environ 119 000 euros.</desc><rect width="1200" height="720" rx="28" fill="#101820"/><style>text{font-family:Inter,Arial,sans-serif}.h{fill:#f6f1e7;font-weight:800}.g{fill:#d4ab56;font-weight:800}.m{fill:#cbd5dc}.s{font-size:20px}.grid{stroke:#fff;stroke-opacity:.10;stroke-dasharray:6 8}</style><text x="55" y="68" class="h" font-size="42">Commencer plus tôt : ce que le temps change vraiment</text><text x="55" y="106" class="g s">200 € par mois jusqu’à 65 ans · hypothèse pédagogique : 5 %/an</text><g transform="translate(0 20)"><line x1="90" y1="565" x2="1090" y2="565" stroke="#f6f1e7" stroke-opacity=".7"/><line x1="90" y1="155" x2="90" y2="565" stroke="#f6f1e7" stroke-opacity=".7"/><line x1="90" y1="462.6" x2="1090" y2="462.6" class="grid"/><line x1="90" y1="360.2" x2="1090" y2="360.2" class="grid"/><line x1="90" y1="257.9" x2="1090" y2="257.9" class="grid"/><line x1="90" y1="155.5" x2="1090" y2="155.5" class="grid"/><text x="72" y="570" text-anchor="end" class="m s">0</text><text x="72" y="468" text-anchor="end" class="m s">100 k€</text><text x="72" y="366" text-anchor="end" class="m s">200 k€</text><text x="72" y="264" text-anchor="end" class="m s">300 k€</text><text x="72" y="162" text-anchor="end" class="m s">400 k€</text><polyline points="90,565 201.1,551.1 312.2,533.2 423.3,510.3 534.4,480.8 645.6,443.1 756.7,394.6 867.8,332.4 978.9,252.5 1090,150.1" fill="none" stroke="#d4ab56" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polyline points="312.2,565 423.3,551.1 534.4,533.2 645.6,510.3 756.7,480.8 867.8,443.1 978.9,394.6 1090,332.4" fill="none" stroke="#8da47e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polyline points="534.4,565 645.6,551.1 756.7,533.2 867.8,510.3 978.9,480.8 1090,443.1" fill="none" stroke="#6f9ec4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><g class="m s"><text x="90" y="600" text-anchor="middle">20</text><text x="312" y="600" text-anchor="middle">30</text><text x="534" y="600" text-anchor="middle">40</text><text x="757" y="600" text-anchor="middle">50</text><text x="979" y="600" text-anchor="middle">60</text><text x="1090" y="600" text-anchor="middle">65 ans</text></g><circle cx="1090" cy="150.1" r="8" fill="#d4ab56"/><circle cx="1090" cy="332.4" r="8" fill="#8da47e"/><circle cx="1090" cy="443.1" r="8" fill="#6f9ec4"/><text x="875" y="188" class="g" font-size="23">Départ à 20 ans → ~405 k€</text><text x="875" y="370" fill="#a9bd9c" font-size="23" font-weight="800">Départ à 30 ans → ~227 k€</text><text x="875" y="481" fill="#8eb9d9" font-size="23" font-weight="800">Départ à 40 ans → ~119 k€</text></g><rect x="55" y="650" width="1090" height="42" rx="12" fill="#fff" opacity=".05"/><text x="600" y="677" text-anchor="middle" class="m" font-size="18">Illustration mathématique, pas prévision : rendement constant hypothétique, avant frais, fiscalité et inflation.</text></svg>