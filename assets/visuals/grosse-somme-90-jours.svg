<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Que faire pendant les 90 premiers jours après une grosse entrée d'argent</title><desc id="d">Quatre étapes : sécuriser, isoler les sommes déjà affectées, construire les poches, puis choisir les enveloppes et investir.</desc><rect width="1200" height="720" rx="28" fill="#101820"/><style>text{font-family:Inter,Arial,sans-serif}.h{fill:#f6f1e7;font-weight:800}.g{fill:#d4ab56;font-weight:800}.m{fill:#cbd5dc}.s{font-size:20px}.b{font-size:28px;font-weight:800}</style><text x="55" y="68" class="h" font-size="42">Grosse somme : ralentir avant d’allouer</text><text x="55" y="106" class="g s">Le protocole des 90 premiers jours</text><line x1="70" y1="215" x2="1130" y2="215" stroke="#d4ab56" stroke-width="4" opacity=".7"/><g transform="translate(85 155)"><circle cx="60" cy="60" r="48" fill="#d4ab56"/><text x="60" y="70" text-anchor="middle" fill="#101820" font-size="34" font-weight="900">1</text><text x="10" y="145" class="g b">0–7 jours</text><text x="10" y="182" class="h s">Sécuriser</text><text x="10" y="214" class="m s">Accès, justificatifs,</text><text x="10" y="242" class="m s">aucune décision pressée.</text></g><g transform="translate(350 155)"><circle cx="60" cy="60" r="48" fill="#8da47e"/><text x="60" y="70" text-anchor="middle" fill="#101820" font-size="34" font-weight="900">2</text><text x="0" y="145" class="g b">8–30 jours</text><text x="0" y="182" class="h s">Isoler</text><text x="0" y="214" class="m s">Impôts, dettes, réserve,</text><text x="0" y="242" class="m s">travaux et projets proches.</text></g><g transform="translate(625 155)"><circle cx="60" cy="60" r="48" fill="#6f9ec4"/><text x="60" y="70" text-anchor="middle" fill="#101820" font-size="34" font-weight="900">3</text><text x="0" y="145" class="g b">31–60 jours</text><text x="0" y="182" class="h s">Construire les poches</text><text x="0" y="214" class="m s">Sécurité, projets,</text><text x="0" y="242" class="m s">long terme.</text></g><g transform="translate(905 155)"><circle cx="60" cy="60" r="48" fill="#9a85b8"/><text x="60" y="70" text-anchor="middle" fill="#101820" font-size="34" font-weight="900">4</text><text x="0" y="145" class="g b">61–90 jours</text><text x="0" y="182" class="h s">Exécuter</text><text x="0" y="214" class="m s">Enveloppes, supports,</text><text x="0" y="242" class="m s">calendrier d’investissement.</text></g><g transform="translate(70 450)"><rect width="1060" height="175" rx="18" fill="#fff" opacity=".045" stroke="#d4ab56" stroke-opacity=".45"/><text x="28" y="42" class="g" font-size="23">EXEMPLE : 300 000 € REÇUS</text><rect x="28" y="70" width="200" height="50" rx="10" fill="#d4ab56"/><text x="128" y="102" text-anchor="middle" fill="#101820" class="b">60 000 €</text><text x="28" y="151" class="m s">Sécurité + projets proches</text><rect x="310" y="70" width="300" height="50" rx="10" fill="#8da47e"/><text x="460" y="102" text-anchor="middle" fill="#101820" class="b">90 000 €</text><text x="310" y="151" class="m s">Horizon intermédiaire</text><rect x="690" y="70" width="342" height="50" rx="10" fill="#6f9ec4"/><text x="861" y="102" text-anchor="middle" fill="#101820" class="b">150 000 €</text><text x="690" y="151" class="m s">Long terme</text></g><text x="70" y="675" class="m s">Exemple pédagogique : la répartition réelle dépend des impôts, dettes, projets et du patrimoine déjà détenu.</text></svg>