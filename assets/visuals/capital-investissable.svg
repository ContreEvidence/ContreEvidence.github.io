<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Calcul du capital réellement investissable</title><desc id="d">Exemple : 25 000 euros de liquidités moins 9 000 euros de réserve, 7 000 euros de projet voiture et 2 000 euros de travaux donnent 7 000 euros réellement investissables.</desc><rect width="1200" height="700" rx="28" fill="#101820"/><style>text{font-family:Inter,Arial,sans-serif}.h{fill:#f6f1e7;font-weight:800}.g{fill:#d4ab56;font-weight:800}.m{fill:#cbd5dc}.s{font-size:22px}.b{font-size:31px;font-weight:800}</style><text x="55" y="70" class="h" font-size="43">Capital investissable : ce n’est pas toute votre épargne</text><text x="55" y="108" class="g s">Exemple concret avant un premier investissement</text><g transform="translate(70 155)"><rect width="720" height="78" rx="15" fill="#fff" opacity=".06" stroke="#d4ab56" stroke-opacity=".55"/><text x="28" y="49" class="m s">Liquidités totales</text><text x="675" y="51" text-anchor="end" class="h b">25 000 €</text><text x="40" y="124" class="g b">−</text><rect x="90" y="92" width="630" height="66" rx="13" fill="#fff" opacity=".045"/><text x="120" y="133" class="m s">Réserve cible</text><text x="675" y="134" text-anchor="end" class="h b">9 000 €</text><text x="40" y="202" class="g b">−</text><rect x="90" y="170" width="630" height="66" rx="13" fill="#fff" opacity=".045"/><text x="120" y="211" class="m s">Projet voiture dans 18 mois</text><text x="675" y="212" text-anchor="end" class="h b">7 000 €</text><text x="40" y="280" class="g b">−</text><rect x="90" y="248" width="630" height="66" rx="13" fill="#fff" opacity=".045"/><text x="120" y="289" class="m s">Travaux / imprévus identifiés</text><text x="675" y="290" text-anchor="end" class="h b">2 000 €</text><line x1="0" y1="340" x2="720" y2="340" stroke="#d4ab56"/><rect y="365" width="720" height="95" rx="16" fill="#d4ab56" opacity=".16" stroke="#d4ab56"/><text x="28" y="422" class="g b">= Capital réellement investissable</text><text x="680" y="423" text-anchor="end" class="g" font-size="40">7 000 €</text></g><g transform="translate(835 180)"><rect width="300" height="330" rx="20" fill="#fff" opacity=".045" stroke="#d4ab56" stroke-opacity=".55"/><text x="28" y="62" class="g" font-size="26">Pourquoi ?</text><text x="28" y="112" class="h s">La réserve a déjà</text><text x="28" y="143" class="h s">un travail.</text><text x="28" y="195" class="m s">Le projet voiture</text><text x="28" y="226" class="m s">a déjà une date.</text><text x="28" y="278" class="m s">Seuls 7 000 €</text><text x="28" y="309" class="g s">peuvent attendre.</text></g><text x="70" y="650" class="m s">Si le revenu devient plus fragile ou si un projet se rapproche, le capital investissable diminue.</text></svg>