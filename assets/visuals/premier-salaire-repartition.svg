<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Exemple de répartition d'un premier salaire de 1 600 euros</title><desc id="d">Exemple pédagogique : 350 euros pour vivre, 850 euros pour l'autonomie et la réserve, 400 euros investis à long terme lorsque les projets proches sont financés.</desc><rect width="1200" height="700" rx="28" fill="#101820"/><style>text{font-family:Inter,Arial,sans-serif}.h{fill:#f6f1e7;font-weight:800}.g{fill:#d4ab56;font-weight:800}.m{fill:#cbd5dc}.s{font-size:22px}.b{font-size:30px;font-weight:800}</style><text x="55" y="70" class="h" font-size="40">Premier salaire : une répartition qui prépare l’autonomie</text><text x="55" y="108" class="g s">Exemple à partir du mois 4, une fois les projets proches chiffrés</text><line x1="55" y1="135" x2="1145" y2="135" stroke="#d4ab56" opacity=".55"/><text x="55" y="185" class="m s">Salaire net mensuel</text><text x="1085" y="185" text-anchor="end" class="h b">1 600 €</text><g transform="translate(55 225)"><rect width="1090" height="92" rx="16" fill="#f6f1e7" opacity=".06"/><rect x="0" y="0" width="239" height="92" rx="16" fill="#d4ab56"/><text x="24" y="40" fill="#101820" class="b">350 €</text><text x="24" y="69" fill="#101820" class="s">Vivre / profiter</text><text x="270" y="40" class="h b">850 €</text><text x="270" y="69" class="m s">Autonomie, réserve, permis, voiture, logement</text><rect x="244" y="0" width="580" height="92" fill="#8da47e" opacity=".72"/><rect x="829" y="0" width="261" height="92" rx="16" fill="#6f9ec4" opacity=".82"/><text x="852" y="40" class="h b">400 €</text><text x="852" y="69" class="h s">Long terme</text></g><g transform="translate(55 355)"><text class="g" font-size="20">LA LOGIQUE</text><rect y="28" width="1090" height="190" rx="18" fill="#fff" opacity=".05" stroke="#d4ab56" stroke-opacity=".35"/><circle cx="95" cy="115" r="40" fill="#d4ab56"/><text x="95" y="124" text-anchor="middle" fill="#101820" font-size="30" font-weight="900">1</text><text x="155" y="95" class="h b">Sécuriser d’abord</text><text x="155" y="130" class="m s">Le permis, le déménagement ou la voiture ne doivent pas dépendre de la Bourse.</text><circle cx="95" cy="176" r="40" fill="#6f9ec4"/><text x="95" y="185" text-anchor="middle" fill="#101820" font-size="30" font-weight="900">2</text><text x="155" y="165" class="h b">Investir ce qui peut attendre</text><text x="155" y="200" class="m s">Si un projet se rapproche, la part investie baisse et la liquidité augmente.</text></g><text x="55" y="635" class="m s">Ce n’est pas une règle de pourcentage : le bon partage dépend surtout des projets des 24 prochains mois.</text></svg>