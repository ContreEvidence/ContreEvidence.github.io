<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Rééquilibrer un budget avant et après</title><desc id="d">Exemple avec 2 100 euros nets : plusieurs arbitrages modestes permettent de dégager 450 euros d'épargne mensuelle.</desc><rect width="1200" height="720" rx="28" fill="#101820"/><style>text{font-family:Inter,Arial,sans-serif}.h{fill:#f6f1e7;font-weight:800}.g{fill:#d4ab56;font-weight:800}.m{fill:#cbd5dc}.l{stroke:#fff;stroke-opacity:.12}.s{font-size:21px}.v{font-size:25px;font-weight:800}</style><text x="55" y="68" class="h" font-size="42">Rééquilibrer un budget : avant / après</text><text x="55" y="106" class="g s">Exemple pédagogique : 2 100 € nets, sans changer de logement</text><g transform="translate(55 145)"><rect width="510" height="460" rx="20" fill="#fff" opacity=".045" stroke="#d4ab56" stroke-opacity=".5"/><text x="28" y="48" class="g" font-size="23">AVANT</text><text x="455" y="48" text-anchor="end" class="m s">Épargne : 0 €</text><g transform="translate(28 85)"><text class="m s">Loyer</text><text x="420" class="h v">750 €</text><line y1="22" x2="450" y2="22" class="l"/><text y="65" class="m s">Voiture</text><text x="420" y="65" class="h v">380 €</text><line y1="87" x2="450" y2="87" class="l"/><text y="130" class="m s">Courses</text><text x="420" y="130" class="h v">350 €</text><line y1="152" x2="450" y2="152" class="l"/><text y="195" class="m s">Abonnements / loisirs</text><text x="420" y="195" class="h v">220 €</text><line y1="217" x2="450" y2="217" class="l"/><text y="260" class="m s">Divers</text><text x="420" y="260" class="h v">280 €</text><line y1="282" x2="450" y2="282" class="l"/><text y="325" class="m s">Marge restante</text><text x="420" y="325" fill="#d46a56" class="v">120 €</text></g></g><g transform="translate(635 145)"><rect width="510" height="460" rx="20" fill="#fff" opacity=".045" stroke="#d4ab56" stroke-opacity=".5"/><text x="28" y="48" class="g" font-size="23">APRÈS</text><text x="455" y="48" text-anchor="end" class="g s">Épargne : 450 €</text><g transform="translate(28 85)"><text class="m s">Loyer</text><text x="420" class="h v">750 €</text><line y1="22" x2="450" y2="22" class="l"/><text y="65" class="m s">Voiture</text><text x="420" y="65" class="g v">260 €</text><line y1="87" x2="450" y2="87" class="l"/><text y="130" class="m s">Courses</text><text x="420" y="130" class="h v">320 €</text><line y1="152" x2="450" y2="152" class="l"/><text y="195" class="m s">Abonnements / loisirs</text><text x="420" y="195" class="g v">120 €</text><line y1="217" x2="450" y2="217" class="l"/><text y="260" class="m s">Divers</text><text x="420" y="260" class="g v">200 €</text><line y1="282" x2="450" y2="282" class="l"/><text y="325" class="m s">Marge + épargne</text><text x="420" y="325" class="g v">450 €</text></g></g><path d="M575 375h50" stroke="#d4ab56" stroke-width="5"/><path d="m618 363 18 12-18 12" fill="none" stroke="#d4ab56" stroke-width="5"/><rect x="245" y="630" width="710" height="58" rx="15" fill="#d4ab56" opacity=".13" stroke="#d4ab56" stroke-opacity=".55"/><text x="600" y="666" text-anchor="middle" class="h s">La marge vient ici de plusieurs arbitrages modestes, pas d’une seule coupe spectaculaire.</text></svg>