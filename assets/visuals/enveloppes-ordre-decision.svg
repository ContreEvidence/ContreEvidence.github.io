<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Ordre de décision avant de choisir une enveloppe</title><desc id="d">Le bon ordre est objectif, horizon, actif, enveloppe, support concret. Ouvrir une enveloppe et l'alimenter fortement sont deux décisions différentes.</desc><rect width="1200" height="650" rx="28" fill="#101820"/><style>text{font-family:Inter,Arial,sans-serif}.h{fill:#f6f1e7;font-weight:800}.g{fill:#d4ab56;font-weight:800}.m{fill:#cbd5dc}.s{font-size:20px}</style><text x="55" y="68" class="h" font-size="42">L’enveloppe vient après la fonction de l’argent</text><text x="55" y="106" class="g s">Un ordre simple évite de choisir un produit avant de savoir pourquoi on l’ouvre</text><g transform="translate(55 170)"><g><rect width="190" height="130" rx="18" fill="#fff" opacity=".055" stroke="#d4ab56" stroke-opacity=".45"/><text x="95" y="44" text-anchor="middle" class="g" font-size="22">1 · OBJECTIF</text><text x="95" y="83" text-anchor="middle" class="h s">À quoi sert</text><text x="95" y="110" text-anchor="middle" class="h s">cet argent ?</text></g><path d="M205 65h38" stroke="#d4ab56" stroke-width="4"/><path d="m236 56 14 9-14 9" fill="none" stroke="#d4ab56" stroke-width="4"/><g transform="translate(255)"><rect width="190" height="130" rx="18" fill="#fff" opacity=".055" stroke="#d4ab56" stroke-opacity=".45"/><text x="95" y="44" text-anchor="middle" class="g" font-size="22">2 · HORIZON</text><text x="95" y="83" text-anchor="middle" class="h s">Quand sera-t-il</text><text x="95" y="110" text-anchor="middle" class="h s">nécessaire ?</text></g><path d="M460 65h38" stroke="#d4ab56" stroke-width="4"/><path d="m491 56 14 9-14 9" fill="none" stroke="#d4ab56" stroke-width="4"/><g transform="translate(510)"><rect width="190" height="130" rx="18" fill="#fff" opacity=".055" stroke="#d4ab56" stroke-opacity=".45"/><text x="95" y="44" text-anchor="middle" class="g" font-size="22">3 · ACTIF</text><text x="95" y="83" text-anchor="middle" class="h s">Quel risque peut</text><text x="95" y="110" text-anchor="middle" class="h s">être supporté ?</text></g><path d="M715 65h38" stroke="#d4ab56" stroke-width="4"/><path d="m746 56 14 9-14 9" fill="none" stroke="#d4ab56" stroke-width="4"/><g transform="translate(765)"><rect width="190" height="130" rx="18" fill="#d4ab56" opacity=".16" stroke="#d4ab56"/><text x="95" y="44" text-anchor="middle" class="g" font-size="22">4 · ENVELOPPE</text><text x="95" y="83" text-anchor="middle" class="h s">PEA, AV, CTO,</text><text x="95" y="110" text-anchor="middle" class="h s">PER…</text></g><path d="M970 65h38" stroke="#d4ab56" stroke-width="4"/><path d="m1001 56 14 9-14 9" fill="none" stroke="#d4ab56" stroke-width="4"/><g transform="translate(1020)"><rect width="125" height="130" rx="18" fill="#fff" opacity=".055" stroke="#d4ab56" stroke-opacity=".45"/><text x="62" y="44" text-anchor="middle" class="g" font-size="20">5 · SUPPORT</text><text x="62" y="83" text-anchor="middle" class="h" font-size="18">ETF, fonds,</text><text x="62" y="108" text-anchor="middle" class="h" font-size="18">titres…</text></g></g><g transform="translate(80 360)"><rect width="1040" height="190" rx="20" fill="#fff" opacity=".045" stroke="#d4ab56" stroke-opacity=".45"/><text x="32" y="48" class="g" font-size="24">DEUX DÉCISIONS À NE PAS CONFONDRE</text><line x1="32" y1="70" x2="1008" y2="70" stroke="#fff" stroke-opacity=".12"/><text x="55" y="118" class="h" font-size="28">Ouvrir une enveloppe</text><text x="55" y="153" class="m s">Peut lancer une ancienneté ou préserver une option future.</text><text x="565" y="118" class="h" font-size="28">L’alimenter fortement</text><text x="565" y="153" class="m s">N’a de sens que si l’argent a réellement cet horizon et cette fonction.</text></g><text x="600" y="605" text-anchor="middle" class="m s">La fiscalité améliore une stratégie ; elle ne crée pas l’objectif.</text></svg>