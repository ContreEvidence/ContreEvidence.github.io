<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Même capital, trois allocations selon la situation</title><desc id="d">Comparaison pédagogique de trois allocations sur 100 000 euros : revenus stables, achat immobilier dans deux ans, et patrimoine déjà très immobilier.</desc><rect width="1200" height="760" rx="28" fill="#101820"/><style>text{font-family:Inter,Arial,sans-serif}.h{fill:#f6f1e7;font-weight:800}.g{fill:#d4ab56;font-weight:800}.m{fill:#cbd5dc}.s{font-size:20px}.v{font-size:22px;font-weight:800}</style><text x="55" y="68" class="h" font-size="42">Même 100 000 €, trois allocations différentes</text><text x="55" y="106" class="g s">La situation change la fonction de l’argent — donc la répartition</text><g transform="translate(45 155)"><rect width="350" height="470" rx="18" fill="#fff" opacity=".045" stroke="#d4ab56" stroke-opacity=".48"/><text x="24" y="42" class="g" font-size="24">1 · REVENUS STABLES</text><text x="24" y="75" class="m s">Aucun gros projet avant 10 ans</text><g transform="translate(24 112)"><text class="h s">Sécurité</text><rect y="16" width="300" height="22" rx="11" fill="#fff" opacity=".09"/><rect y="16" width="36" height="22" rx="11" fill="#d4ab56"/><text x="300" y="11" text-anchor="end" class="g v">12 %</text><text y="82" class="h s">Projets flexibles</text><rect y="98" width="300" height="22" rx="11" fill="#fff" opacity=".09"/><rect y="98" width="24" height="22" rx="11" fill="#8da47e"/><text x="300" y="93" text-anchor="end" class="g v">8 %</text><text y="164" class="h s">Long terme</text><rect y="180" width="300" height="22" rx="11" fill="#fff" opacity=".09"/><rect y="180" width="195" height="22" rx="11" fill="#6f9ec4"/><text x="300" y="175" text-anchor="end" class="g v">65 %</text><text y="246" class="h s">Défensif + optionnel</text><rect y="262" width="300" height="22" rx="11" fill="#fff" opacity=".09"/><rect y="262" width="45" height="22" rx="11" fill="#9a85b8"/><text x="300" y="257" text-anchor="end" class="g v">15 %</text></g></g><g transform="translate(425 155)"><rect width="350" height="470" rx="18" fill="#fff" opacity=".045" stroke="#d4ab56" stroke-opacity=".48"/><text x="24" y="42" class="g" font-size="24">2 · ACHAT DANS 2 ANS</text><text x="24" y="75" class="m s">55 000 € déjà destinés au projet</text><g transform="translate(24 112)"><text class="h s">Sécurité hors achat</text><rect y="16" width="300" height="22" rx="11" fill="#fff" opacity=".09"/><rect y="16" width="45" height="22" rx="11" fill="#d4ab56"/><text x="300" y="11" text-anchor="end" class="g v">15 %</text><text y="82" class="h s">Achat immobilier</text><rect y="98" width="300" height="22" rx="11" fill="#fff" opacity=".09"/><rect y="98" width="165" height="22" rx="11" fill="#8da47e"/><text x="300" y="93" text-anchor="end" class="g v">55 %</text><text y="164" class="h s">Long terme</text><rect y="180" width="300" height="22" rx="11" fill="#fff" opacity=".09"/><rect y="180" width="75" height="22" rx="11" fill="#6f9ec4"/><text x="300" y="175" text-anchor="end" class="g v">25 %</text><text y="246" class="h s">Optionnel</text><rect y="262" width="300" height="22" rx="11" fill="#fff" opacity=".09"/><rect y="262" width="15" height="22" rx="11" fill="#9a85b8"/><text x="300" y="257" text-anchor="end" class="g v">5 %</text></g></g><g transform="translate(805 155)"><rect width="350" height="470" rx="18" fill="#fff" opacity=".045" stroke="#d4ab56" stroke-opacity=".48"/><text x="24" y="42" class="g" font-size="24">3 · DÉJÀ TRÈS IMMOBILIER</text><text x="24" y="75" class="m s">350 000 € de résidence + 100 000 € financiers</text><g transform="translate(24 112)"><text class="h s">Sécurité</text><rect y="16" width="300" height="22" rx="11" fill="#fff" opacity=".09"/><rect y="16" width="60" height="22" rx="11" fill="#d4ab56"/><text x="300" y="11" text-anchor="end" class="g v">20 %</text><text y="82" class="h s">Long terme diversifié</text><rect y="98" width="300" height="22" rx="11" fill="#fff" opacity=".09"/><rect y="98" width="180" height="22" rx="11" fill="#6f9ec4"/><text x="300" y="93" text-anchor="end" class="g v">60 %</text><text y="164" class="h s">Défensif</text><rect y="180" width="300" height="22" rx="11" fill="#fff" opacity=".09"/><rect y="180" width="45" height="22" rx="11" fill="#8da47e"/><text x="300" y="175" text-anchor="end" class="g v">15 %</text><text y="246" class="h s">Optionnel</text><rect y="262" width="300" height="22" rx="11" fill="#fff" opacity=".09"/><rect y="262" width="15" height="22" rx="11" fill="#9a85b8"/><text x="300" y="257" text-anchor="end" class="g v">5 %</text></g></g><rect x="135" y="660" width="930" height="62" rx="15" fill="#d4ab56" opacity=".12" stroke="#d4ab56" stroke-opacity=".5"/><text x="600" y="698" text-anchor="middle" class="h s">Une allocation organise des contraintes : horizon, projets, stabilité des revenus et patrimoine déjà détenu.</text></svg>